name: Research 2026-10-12 full-day live audit (no purchase)
on:
  pull_request:
    paths:
      - "collectors/official_race_conditions.py"
      - "collectors/research_live_full_day_probe.py"
      - "tests/test_official_race_conditions.py"
      - ".github/workflows/20261012_full_live_audit.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: research-full-day-live-audit-20261012
  cancel-in-progress: false
jobs:
  research-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing research dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate exception cases without scraping
        run: |
          python -m py_compile collectors/official_race_conditions.py collectors/research_live_full_day_probe.py
          python -m unittest discover -s tests -p test_official_race_conditions.py -v
      - name: Recheck all saved predictions and only missing official exhibition pages
        run: |
          python -m collectors.research_live_full_day_probe \
            --date 20261012 --as-of 2026-10-12T20:02:31+09:00 \
            --max-official-gap-requests 15 --output-dir _research_probe
      - name: Retain research-only decoded report (no full official HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-20261012-comprehensive-research-audit
          path: _research_probe/full_day_audit.json
          if-no-files-found: warn
          retention-days: 30
