name: Research 2026-10-12 full-day live audit (no purchase)
on:
  pull_request:
    paths:
      - "collectors/official_race_conditions.py"
      - "collectors/research_live_full_day_probe.py"
      - "tests/test_official_race_conditions.py"
      - "collectors/v4_pipeline.py"
      - "tests/test_v4_pipeline_contract.py"
      - ".github/workflows/v4_stage1_capture.yml"
      - ".github/workflows/v4_stage2_decode.yml"
      - ".github/workflows/v4_stage3_predict.yml"
      - ".github/workflows/20261012_full_live_audit.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: research-full-day-live-audit-20261012
  cancel-in-progress: false
jobs:
  research-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing research dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate exception cases without scraping
        run: |
          python -m py_compile collectors/official_race_conditions.py collectors/research_live_full_day_probe.py
          python -m unittest discover -s tests -p test_official_race_conditions.py -v
      - name: V4 raw-first 3-stage pipeline contracts
        run: |
          python -m py_compile collectors/v4_pipeline.py
          python -m unittest discover -s tests -p test_v4_pipeline_contract.py -v
      - name: V4 official one-race actual HTTP body -> independent parse smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from collectors.v4_pipeline import fetch_one,decode_manifest
          meta={"date":"20261012","venue_code":"22","venue_name":"福岡",
                "race":12,"race_id":"20261012-22-12","deadline":"16:40",
                "source_url":"https://www.boatrace.jp/owpc/pc/race/beforeinfo?hd=20261012&jcd=22&rno=12"}
          with TemporaryDirectory() as tmp:
              root=Path(tmp)
              result=fetch_one(meta,root/"raw"/"raw")
              assert result.get("http_status")==200,result
              (root/"raw"/"manifest.json").write_text(
                  json.dumps({"schema":"boatrace-v4-capture-v1","date":"20261012",
                              "mode":"live","records":[result]}),encoding="utf-8")
              decoded=decode_manifest(root/"raw",root/"decoded",Path("."))
              assert decoded["observed_races"]==1,decoded
              # The real HTTP body is now fetched on a DIFFERENT day.
              # Its source SHA and content are research evidence, not a
              # prediction that existed before the October 12 deadline.
              assert decoded["decoded_races"]==0,decoded
              assert decoded["unparsed_races"][0]["reason"]=="after_deadline_observation",decoded
              print("V4_ACTUAL_OFFICIAL_RAW_RESEARCH_ONLY_PASS",{
                  "race_id":result["race_id"],"sha256":result["sha256"],
                  "decoded_races":decoded["decoded_races"],
                  "cutoff_enforced":True,"retrospective_research_only":True})
          PY
      - name: Recheck all saved predictions (official gap already checked in run 38240929058)
        run: |
          python -m collectors.research_live_full_day_probe \
            --date 20261012 --as-of 2026-10-12T20:02:31+09:00 \
            --max-official-gap-requests 0 --output-dir _research_probe
      - name: Retain research-only decoded report (no full official HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-20261012-comprehensive-research-audit
          path: _research_probe/full_day_audit.json
          if-no-files-found: warn
          retention-days: 30
