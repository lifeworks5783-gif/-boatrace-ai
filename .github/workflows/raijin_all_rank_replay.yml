name: Raijin all-rank historical replay

on:
  push:
    branches: [main]
    paths:
      - "collectors/evaluate_raijin_all_rank_replay.py"
      - "collectors/evaluate_signal_rank_research.py"
      - "config/research/signal_rank_diagnostic_v1_20261011.json"
      - "tests/test_signal_rank_research.py"
      - "config/run_raijin_rankless_replay.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raijin-all-rank-replay-main
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare prediction calculation dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Re-evaluate every archived observation under both rank policies
        run: |
          python -m unittest discover -s tests -p test_raijin_rank_independence.py -v
          python -u collectors/evaluate_raijin_all_rank_replay.py --output-dir evaluations/raijin_all_rank_v2_replay
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("evaluations/raijin_all_rank_v2_replay/summary.json").read_text())
          assert x["research_only"] is True
          assert x["result_as_input_to_signals"] is False
          assert x["valid_races"] > 0
          assert x["changed_raijin_levels"] > 0
          case=x["known_case_202610112306"]
          assert case is not None and case["old_raijin_level"] == 0, case
          assert case["new_raijin_level"] == 3, case
          print("RAIJIN_V2_HISTORICAL_REPLAY_PASS", x["valid_races"], x["changed_raijin_levels"])
          PY
      - name: Attribute every saved signal-race actual ranking to morning/live/buff stages
        run: |
          python -m unittest discover -s tests -p test_signal_rank_research.py -v
          python -u collectors/evaluate_signal_rank_research.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evaluations/signal_rank_research/v1")
          x=json.loads((p/"summary.json").read_text(encoding="utf-8"))
          assert x["baseline_full_replay_verified"] is True
          assert x["result_as_scoring_input"] is False
          assert x["finished_signal_races"] > 850
          assert len(x["comparisons"]["by_signal"]) == 16
          from collections import Counter
          assert x["overall"]["by_method"]["signal_score"]["races"] == x["finished_signal_races"]
          print("RESEARCH_ONLY_120_RANK_ATTRIBUTION_PASS", x["finished_signal_races"])
          PY
      - name: Save research output without touching historical canonical files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/raijin_all_rank_v2_replay/ evaluations/signal_rank_research/v1/
          if git diff --cached --quiet; then echo "Replay unchanged"; exit 0; fi
          git commit -m "Save rank-independent Raijin v2 retrospective comparison"
          git pull --rebase origin main
          git push origin HEAD:main
