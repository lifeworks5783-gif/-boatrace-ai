name: Live O-to-X Pair Diagnosis
on:
  push:
    branches: [main]
    paths:
      - "collectors/evaluate_live_o_to_x_pair_diagnosis.py"
      - ".github/workflows/live_o_to_x_pair_diagnosis.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pair diagnosis
        run: python collectors/evaluate_live_o_to_x_pair_diagnosis.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/live_o_to_x_pair_diagnosis_20260930_20261003/summary.json
          git diff --cached --quiet || git commit -m "Update live deterioration pair diagnosis"
          git push
