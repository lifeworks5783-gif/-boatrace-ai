name: Official F L Backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/official_fl_backfill.yml"
      - "collectors/enrich_official_fl.py"
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Backfill official F L by date
        run: |
          set -u
          failed=0
          for d in 20260930 20261001 20261002 20261003; do
            echo "===== START $d ====="
            if timeout 300s python -u collectors/enrich_official_fl.py --date "$d"; then
              echo "===== OK $d ====="
            else
              rc=$?
              echo "===== FAILED $d rc=$rc ====="
              failed=1
            fi
          done
          exit "$failed"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/program_entries_fl_20260930.csv data/program_entries_fl_20261001.csv data/program_entries_fl_20261002.csv data/program_entries_fl_20261003.csv
          git diff --cached --quiet || git commit -m "Backfill official F L average ST"
          git push
