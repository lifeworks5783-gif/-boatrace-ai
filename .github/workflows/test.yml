name: 前日全場自動収集

# GitHub Actionsから同じリポジトリへ
# 検証済みデータを保存できるようにする
permissions:
  contents: write

on:
  # 毎日 日本時間 4:30 に自動実行
  schedule:
    - cron: "30 4 * * *"
      timezone: "Asia/Tokyo"

  # 手動実行も可能
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    # 最大60分
    timeout-minutes: 60

    steps:
      - name: ファイルを読み込む
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: dataフォルダを準備
        run: mkdir -p data

      - name: 前日の開催場・全レース・全艇を収集
        continue-on-error: true
        run: |
          set +e

          echo "========================================"
          echo "前日全場収集を開始します"
          echo "最大収集時間：55分"
          echo "========================================"

          timeout --signal=TERM 55m python -u collectors/daily_all.py
          EXIT_CODE=$?

          echo ""
          echo "========================================"
          echo "収集処理終了"
          echo "終了コード: ${EXIT_CODE}"
          echo "========================================"

          if [ "${EXIT_CODE}" -eq 124 ]; then
            echo "::warning::55分に到達したため安全に収集処理を終了しました"
            exit 0
          fi

          exit "${EXIT_CODE}"

      - name: 収集データを自動検証
        if: always()
        run: |
          echo "========================================"
          echo "日次データ品質検証を開始します"
          echo "========================================"

          python -u collectors/validate_daily.py

          echo ""
          echo "========================================"
          echo "日次データ品質検証 PASS"
          echo "========================================"

      - name: 収集済みファイルを確認
        if: always()
        run: |
          echo "========================================"
          echo "現在保存されているデータファイル"
          echo "========================================"

          if [ -d "data" ]; then
            find data -maxdepth 1 -type f \( -name "*.csv" -o -name "*.json" \) -print | sort
          else
            echo "dataフォルダがありません"
          fi

      - name: CSVと検証結果をArtifactへ保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-results-${{ github.run_number }}
          path: |
            data/*.csv
            data/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: 検証PASSデータをGitHubへ長期保存
        if: success()
        run: |
          echo "========================================"
          echo "長期保存処理を開始します"
          echo "========================================"

          VALIDATION_FILE=$(find data -maxdepth 1 -type f -name "validation_*.json" | head -n 1)

          if [ -z "${VALIDATION_FILE}" ]; then
            echo "validationファイルがありません"
            exit 1
          fi

          TARGET_DATE=$(basename "${VALIDATION_FILE}" | sed -E 's/validation_([0-9]{8})\.json/\1/')

          YEAR=${TARGET_DATE:0:4}
          MONTH=${TARGET_DATE:4:2}
          DAY=${TARGET_DATE:6:2}

          DEST="archive/${YEAR}/${MONTH}/${DAY}"

          echo "対象日: ${TARGET_DATE}"
          echo "保存先: ${DEST}"

          mkdir -p "${DEST}"

          cp "data/venues_${TARGET_DATE}.csv" "${DEST}/"
          cp "data/results_${TARGET_DATE}_all.csv" "${DEST}/"
          cp "data/boat_results_${TARGET_DATE}_all.csv" "${DEST}/"
          cp "data/validation_${TARGET_DATE}.json" "${DEST}/"
          cp "data/manifest_${TARGET_DATE}.json" "${DEST}/"

          echo ""
          echo "保存対象ファイル:"
          find "${DEST}" -maxdepth 1 -type f -print | sort

          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"

          git add "${DEST}"

          if git diff --cached --quiet; then
            echo "同じデータが既に保存されています。"
            echo "重複コミットは行いません。"
            exit 0
          fi

          git commit -m "Archive BOAT RACE data ${TARGET_DATE}"
          git push

          echo ""
          echo "========================================"
          echo "GitHub長期保存 完了"
          echo "========================================"