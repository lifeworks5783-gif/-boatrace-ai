name: 前日全場自動収集

on:
  # 毎日 日本時間 4:30 に自動実行
  schedule:
    - cron: "30 4 * * *"
      timezone: "Asia/Tokyo"

  # 今まで通り手動実行も可能
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    # 最大60分
    timeout-minutes: 60

    steps:
      - name: ファイルを読み込む
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: dataフォルダを準備
        run: mkdir -p data

      - name: 前日の開催場・全レース・全艇を収集
        continue-on-error: true
        run: |
          set +e

          echo "========================================"
          echo "前日全場収集を開始します"
          echo "最大収集時間：55分"
          echo "========================================"

          timeout --signal=TERM 55m python -u collectors/daily_all.py
          EXIT_CODE=$?

          echo ""
          echo "========================================"
          echo "収集処理終了"
          echo "終了コード: ${EXIT_CODE}"
          echo "========================================"

          if [ "${EXIT_CODE}" -eq 124 ]; then
            echo "::warning::55分に到達したため安全に収集処理を終了しました"
            exit 0
          fi

          exit "${EXIT_CODE}"

      - name: 収集データを自動検証
        if: always()
        run: |
          echo "========================================"
          echo "日次データ品質検証を開始します"
          echo "========================================"

          python -u collectors/validate_daily.py

          echo ""
          echo "========================================"
          echo "日次データ品質検証 PASS"
          echo "========================================"

      - name: 収集済みファイルを確認
        if: always()
        run: |
          echo "========================================"
          echo "現在保存されているデータファイル"
          echo "========================================"

          if [ -d "data" ]; then
            find data -maxdepth 1 -type f \( -name "*.csv" -o -name "*.json" \) -print | sort
          else
            echo "dataフォルダがありません"
          fi

      - name: CSVと検証結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-results-${{ github.run_number }}
          path: |
            data/*.csv
            data/*.json
          if-no-files-found: warn
          retention-days: 30