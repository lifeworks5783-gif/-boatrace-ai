name: Python動作テスト

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ファイルを読み込む
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: レース結果一覧を取得
        run: python collectors/result.py

      - name: 12R・72艇の詳細データを取得
        run: python collectors/boat_results.py

      - name: CSVを保存
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-results
          path: data/*.csv
          retention-days: 30