name: 前日全場自動収集

permissions:
  contents: write

on:
  schedule:
    - cron: "0 1 * * *"
      timezone: "Asia/Tokyo"

  workflow_dispatch:

concurrency:
  group: daily-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ファイルを読み込む
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリを準備
        run: |
          python -m pip install --upgrade pip
          pip install lhafile

      - name: dataフォルダを準備
        run: mkdir -p data

      - name: 前日全場結果を軽量収集
        run: |
          echo "========================================"
          echo "前日全場結果・Kファイル軽量収集"
          echo "========================================"

          python -u collectors/daily_results_fast.py

          echo ""
          echo "========================================"
          echo "軽量収集完了"
          echo "========================================"

      - name: 収集データを自動検証
        run: |
          echo "========================================"
          echo "日次データ品質検証を開始"
          echo "========================================"

          python -u collectors/validate_daily.py

          echo ""
          echo "========================================"
          echo "日次データ品質検証 PASS"
          echo "========================================"

      - name: 作成ファイルを確認
        run: |
          echo "========================================"
          echo "今回作成されたデータ"
          echo "========================================"

          find data -maxdepth 1 -type f \
            \( -name "*.csv" -o -name "*.json" \) \
            -print | sort

      - name: 結果をArtifactへ短期保存
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-results-${{ github.run_number }}
          path: |
            data/venues_*.csv
            data/results_*_all.csv
            data/boat_results_*_all.csv
            data/validation_*.json
            data/manifest_*.json
          if-no-files-found: error
          retention-days: 14

      - name: 検証PASSデータをGitHubへ長期保存
        run: |
          VALIDATION_FILE=$(find data -maxdepth 1 \
            -type f \
            -name "validation_*.json" \
            | head -n 1)

          if [ -z "${VALIDATION_FILE}" ]; then
            echo "validationファイルがありません"
            exit 1
          fi

          TARGET_DATE=$(basename "${VALIDATION_FILE}" \
            | sed -E 's/validation_([0-9]{8})\.json/\1/')

          YEAR=${TARGET_DATE:0:4}
          MONTH=${TARGET_DATE:4:2}
          DAY=${TARGET_DATE:6:2}

          DEST="archive/${YEAR}/${MONTH}/${DAY}"

          echo "対象日: ${TARGET_DATE}"
          echo "保存先: ${DEST}"

          mkdir -p "${DEST}"

          cp "data/venues_${TARGET_DATE}.csv" "${DEST}/"
          cp "data/results_${TARGET_DATE}_all.csv" "${DEST}/"
          cp "data/boat_results_${TARGET_DATE}_all.csv" "${DEST}/"
          cp "data/validation_${TARGET_DATE}.json" "${DEST}/"
          cp "data/manifest_${TARGET_DATE}.json" "${DEST}/"

          echo ""
          echo "保存する5ファイル:"
          find "${DEST}" -maxdepth 1 -type f -print | sort

          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"

          git add "${DEST}"

          if git diff --cached --quiet; then
            echo "同じデータが既に保存されています"
            echo "重複コミットは行いません"
            exit 0
          fi

          git commit -m "Archive BOAT RACE data ${TARGET_DATE}"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin HEAD:"${GITHUB_REF_NAME}"

          echo ""
          echo "========================================"
          echo "GitHub長期保存 完了"
          echo "========================================"