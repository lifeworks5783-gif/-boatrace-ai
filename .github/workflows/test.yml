name: 開催場検出テスト

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: ファイルを読み込む
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 前日の開催場を自動検出
        run: python collectors/venue_test.py

      - name: CSVを保存
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-venues
          path: data/*.csv
          retention-days: 30