name: Crossvalidate ST candidates
on:
  push:
    paths:
      - 'collectors/crossvalidate_st_candidates_pdca.py'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python collectors/crossvalidate_st_candidates_pdca.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/st_candidate_crossvalidation/
          git diff --cached --quiet || git commit -m "Save ST candidate crossvalidation"
          git pull --rebase origin main
          git push origin main
