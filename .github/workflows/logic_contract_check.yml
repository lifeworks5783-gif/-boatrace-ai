name: Race prediction contract tests

on:
  push:
    branches:
      - main
      - refactor/logic-registry-canonical-race-v1
      - fix/recovered-live-canonical-signal-24
      - fix/recovery-signal24-current-main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies for existing prediction functions
        run: python -m pip install requests beautifulsoup4
      - name: Compile modified prediction and view components
        run: |
          python -m py_compile \
            collectors/logic_registry.py \
            collectors/race_prediction_store.py \
            collectors/recovery_live_overlay.py \
            collectors/build_morning_prediction.py \
            collectors/build_live_prediction.py \
            collectors/build_latest_prediction_view.py \
            collectors/build_deadline_prediction_view.py \
            collectors/build_family_race_compare_page.py
      - name: Model parity and signal 24 contracts
        run: python -m unittest discover -s tests -p test_logic_pipeline_contract.py -v
      - name: Production immutable-history and numerical-config safety
        run: python -m unittest discover -s tests -p test_production_safety.py -v
      - name: Neutral 0-delta provisional live scoring, signal block, two-page warnings and replay queue
        run: python -m unittest discover -s tests -p test_neutral_live_fallback.py -v
      - name: Karatsu 10R actual saved official data and display regressions
        run: python -m unittest discover -s tests -p test_karatsu10_signal_recovery.py -v
      - name: Normal AI scores must match the shared six-boat canonical bundle
        run: python -m unittest discover -s tests -p test_family_ai_score_display.py -v
      - name: Recovered Edogawa 8R and all archived live scores must reach race comparison
        run: python -m unittest discover -s tests -p test_completed_race_recovery_contract.py -v
      - name: Render both views from the same saved 2026-10-08 prediction bundle
        run: |
          python -u collectors/build_deadline_prediction_view.py --date 20261008
          python -u collectors/build_family_prediction_page.py \
            --input predictions/latest_by_deadline.json --output-dir _contract_test
          python -u collectors/build_family_race_compare_page.py \
            --date 20261008 --predictions-root predictions --output-dir _contract_test
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'collectors')
          from race_prediction_store import load_canonical, audit_canonical, audit_race
          data = load_canonical('20261008')
          summary = audit_canonical(data)
          assert summary['total'] > 0
          assert summary['active_signals'] > 0, summary
          for path in ('index.html', 'race_compare.html'):
              assert (Path('_contract_test') / path).stat().st_size > 1000
          print('CANONICAL_SMOKE', {k:v for k,v in summary.items() if k != 'details'})
          from build_family_race_compare_page import load_predictions, build_race_rows
          morning, live, formation = load_predictions('predictions', '20261008')
          finished = build_race_rows('20261008', morning, live, formation)
          completed = {r['race_code'] for r in finished}
          expected = {
              ''.join(c for c in row['race_id'] if c.isdigit())[:12]: row
              for row in data['races']
          }
          missing = [
              {'race_id': code, 'deadline': row.get('deadline'),
               'signal_key': (audit_canonical({
                   'target_date': '20261008', 'races': [row]
               })['details'][0]['signal_key'])}
              for code, row in expected.items() if code not in completed
          ]
          print('CANONICAL_VS_RESULTS', {
              'predictions': len(expected), 'results': len(completed),
              'missing_result_keys': missing,
              'signal_in_results': sum(
                  bool((r.get('up_signal') or {}).get('level') or
                       (r.get('down_signal') or {}).get('level'))
                  for r in finished),
              'missing_formation_for_results': [
                  r['race_code'] for r in finished if not r.get('formation_prediction')
              ],
          })
          assert not any(
              audit_race((r.get('formation_prediction') or {}).get('raw') or {})['signal_ai_status'] == 'missing_or_invalid_signal_24'
              for r in finished
          ), 'Completed race has an active signal but no 24 tickets'
          PY
      - name: Rebuild signal results and both remaining public pages
        run: |
          python -u collectors/evaluate_signal_ai_performance.py
          python -u collectors/evaluate_signal_pdca_cross.py
          python -u collectors/build_family_results_page.py \
            --evaluations-root evaluations --output-dir _contract_test
          python -u collectors/build_family_signal_analysis_page.py \
            --evaluations-root evaluations --output-dir _contract_test
          python - <<'PY'
          from pathlib import Path
          for name in ('index.html', 'race_compare.html', 'results.html', 'analysis.html'):
              p = Path('_contract_test') / name
              assert p.is_file() and p.stat().st_size > 1000, name
              print('FOUR_VIEW_PASS', name, p.stat().st_size)
          PY
      - name: Replay 2026-10-09 official beforeinfo recovery into canonical predictions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('predictions/2026/10/09/live/formation_predictions_final_20261009.json')
          rows=json.loads(p.read_text(encoding='utf-8'))['races']
          row=next(x for x in rows if x['race_id']=='20261009-14-01')
          Path('/tmp/normal_ai_before.json').write_text(json.dumps({
              'formation':row.get('formation'),
              'ai_score_prediction':row.get('ai_score_prediction')
          },sort_keys=True),encoding='utf-8')
          print('BEFORE_NARUTO1', (row.get('up_signal') or {}).get('level'), (row.get('down_signal') or {}).get('level'))
          PY
          python -u collectors/build_latest_prediction_view.py --date 20261009 --now 2026-10-09T14:30:00+09:00
          python -u collectors/build_deadline_prediction_view.py --date 20261009
          python -u collectors/build_family_prediction_page.py \
            --input predictions/latest_by_deadline.json --output-dir _recovery_test
          python -u collectors/build_family_race_compare_page.py \
            --date 20261009 --predictions-root predictions --output-dir _recovery_test
          python - <<'PY'
          from pathlib import Path
          import json, sys
          sys.path.insert(0, 'collectors')
          from race_prediction_store import load_canonical, audit_race
          from recovery_live_overlay import load_verified_recovered_live
          overlay=load_verified_recovered_live('20261009')
          assert '20261009-14-01' in overlay, list(overlay)
          data=load_canonical('20261009')
          row=next(x for x in data['races'] if x['race_id']=='20261009-14-01')
          audit=audit_race(row)
          assert audit['signal_key']=='F2R2', audit
          assert audit['signal_ai_status']=='ready', audit
          assert row.get('retrospective_signal_recovery') is True, row
          assert row.get('signal_detected_at_original_deadline') is False, row
          assert len(row['signal_ai_prediction']['combinations'])==24
          saved=json.loads(Path('/tmp/normal_ai_before.json').read_text())
          assert json.dumps({
              'formation': row.get('formation'),
              'ai_score_prediction': row.get('ai_score_prediction')
          }, sort_keys=True)==json.dumps(saved,sort_keys=True)
          rendered=Path('_recovery_test/race_compare.html').read_text(encoding='utf-8')
          start=rendered.index('鳴門')
          print('NARUTO_F2R2_RECOVERY_PASS', audit, 'saved original buying choices unchanged')
          print('RENDERED_REPAIRED', '風神雷神専用AI予想' in rendered)
          karatsu=next(x for x in data['races'] if x['race_id']=='20261009-23-10')
          kcheck=audit_race(karatsu)
          print('KARATSU10_REPLAY_AUDIT', {
              'race_id': karatsu['race_id'],
              'signal_key': kcheck['signal_key'],
              'status': kcheck['signal_ai_status'],
              'recovered_after_result': kcheck['recovered_after_result'],
              'realtime_detected': kcheck['signal_detected_at_original_deadline'],
          })
          assert kcheck['signal_key']=='F0R1', kcheck
          assert kcheck['signal_ai_status']=='ready', kcheck
          assert kcheck['recovered_after_result'] is True
          assert kcheck['signal_detected_at_original_deadline'] is False
          assert [x['boat'] for x in karatsu['up_signal']['candidates']]==[5, 6]
          assert len(karatsu['signal_ai_prediction']['combinations'])==24
          # Verify this ONE completed race card, not another race's badge.
          import re
          cards=re.findall(r'<article class="race-card">(.*?)</article>', rendered, flags=re.DOTALL)
          karatsu_card=next((card for card in cards if re.search(r'唐津\s*10R', card)), None)
          assert karatsu_card, 'Karatsu 10R race card not rendered'
          assert '5千円以上・事後捕捉' in karatsu_card, karatsu_card[:400]
          assert '風神雷神専用AI予想' in karatsu_card, karatsu_card[:800]
          assert '⚡' in karatsu_card, karatsu_card[:400]
          print('KARATSU10_REPLAY_PASS', 'F0R1 / 5,6号艇 / 24点 / 事後捕捉表示')
          # Official Tokoname8 starter 3 was scratched. Unlike an
          # unknown missing ST, official FIVE starters must still emit
          # Raijin and all 24 independently evaluated tickets.
          tokoname=next(x for x in data['races'] if x['race_id']=='20261009-08-08')
          tcheck=audit_race(tokoname)
          assert tokoname['prediction_quality']['verified_scratched_boats']==[3],tokoname['prediction_quality']
          assert len(tokoname['boats'])==5,tokoname
          assert tcheck['signal_key']=='F0R2',tcheck
          assert tcheck['signal_ai_status']=='ready',tcheck
          assert tokoname.get('retrospective_signal_recovery') is True
          assert tokoname.get('signal_detected_at_original_deadline') is False
          assert len(tokoname['signal_ai_prediction']['combinations'])==24
          assert tokoname['signal_ai_prediction']['valid_combination_count']==60
          assert len({x['combination'] for x in tokoname['signal_ai_prediction']['combinations']})==24
          assert all('3' not in x['combination'].split('-') for x in tokoname['signal_ai_prediction']['combinations'])
          card=next((x for x in cards if re.search(r'常滑\\s*8R', x)), None)
          assert card, 'Tokoname8 card is missing'
          assert ('雷神' in card or '⚡' in card), 'Tokoname8 signal missing in HTML'
          assert '直前予測なし' not in card, 'Tokoname8 official live missing in HTML'
          print('TOKONAME8_FIVE_BOAT_RAIJIN_LV2_24_POINTS_AND_HTML_PASS',tcheck)
          PY
      - name: Re-run after closing and preserve canonical signal and original ticket identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('predictions/2026/10/09/live/formation_predictions_final_20261009.json')
          rows=json.loads(p.read_text(encoding='utf-8'))['races']
          picked={x['race_id']: {
              'formation': x.get('formation'),
              'ai_score_prediction': x.get('ai_score_prediction'),
              'signal_ai_prediction': x.get('signal_ai_prediction'),
              'up_signal': x.get('up_signal'),
              'down_signal': x.get('down_signal'),
          } for x in rows if x.get('retrospective_signal_recovery') and x.get('race_id') in
          ('20261009-23-10','20261009-14-01')}
          assert len(picked)==2, picked
          Path('/tmp/repeat_recovery_sig.json').write_text(json.dumps(picked,sort_keys=True),encoding='utf-8')
          PY
          python -u collectors/build_latest_prediction_view.py --date 20261009 --now 2026-10-09T15:00:00+09:00
          python -u collectors/build_deadline_prediction_view.py --date 20261009
          python -u collectors/build_family_race_compare_page.py --date 20261009 --predictions-root predictions --output-dir _recovery_repeat
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'collectors')
          from race_prediction_store import audit_canonical,load_canonical
          p=Path('predictions/2026/10/09/live/formation_predictions_final_20261009.json')
          rows=json.loads(p.read_text(encoding='utf-8'))['races']
          expected=json.loads(Path('/tmp/repeat_recovery_sig.json').read_text(encoding='utf-8'))
          for x in rows:
              if x['race_id'] in expected:
                  saved={key:x.get(key) for key in expected[x['race_id']]}
                  assert saved==expected[x['race_id']], ('repeat mutated data',x['race_id'])
          report=audit_canonical(load_canonical('20261009'))
          assert report['missing_signal_24']==0, report
          html=Path('_recovery_repeat/race_compare.html').read_text(encoding='utf-8')
          assert '5千円以上・事後捕捉' in html
          print('REPEAT_RECOVERY_PRESERVES_SIGNAL_AND_PURCHASE_PASS', {
              'checked_races':list(expected), 'total':report['total'],
              'active_signals':report['active_signals'],
              'missing_signal_24':report['missing_signal_24'],
          })
          PY
