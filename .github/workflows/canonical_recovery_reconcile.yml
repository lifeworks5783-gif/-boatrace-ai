name: 公式直前復旧データを共通予測正本へ反映

on:
  push:
    branches: [main]
    paths:
      - "evaluations/**/recovery/merged_live_predictions_*.csv"
      - "evaluations/**/recovery/live_recovery_manifest_*.json"
      - ".github/workflows/canonical_recovery_reconcile.yml"
      - "config/run_reconcile_live_now.txt"
      - "tests/test_saved_late_live_recovery.py"
      - "collectors/audit_daily_completeness.py"
      - "collectors/research_audit_policy.py"
      - "config/research_audit_policy.json"
  workflow_dispatch:
    inputs:
      target_date:
        description: "対象日 YYYYMMDD（省略時はJST当日）"
        required: false
        type: string
      skip_family_publish:
        description: "ボタン一括更新で利用。家族ページは呼出元が結果確定後に公開する"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: boatrace-canonical-writer
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 予測計算依存を準備
        run: python -m pip install requests beautifulsoup4
      - name: 締切前公式データと事後計算の復旧契約を検証
        run: |
          python -m py_compile collectors/recovery_live_overlay.py collectors/build_latest_prediction_view.py
          python -m unittest discover -s tests -p 'test_saved_late_live_recovery.py' -v
          python -m unittest discover -s tests -p 'test_manual_research_audit.py' -v
          python -m unittest discover -s tests -p 'test_recovery_signals_publish_order.py' -v
      - name: 対象日・保存済み公式復旧記録を検証
        id: date
        env:
          INPUT_DATE: ${{ inputs.target_date }}
        run: |
          TARGET_DATE="$INPUT_DATE"
          if [ -z "$TARGET_DATE" ] && [ "${{ github.event_name }}" = "push" ]; then
            TARGET_DATE="$(grep -oE 'target_date=[0-9]{8}' config/run_reconcile_live_now.txt 2>/dev/null | tail -n 1 | cut -d= -f2 || true)"
          fi
          TARGET_DATE="${TARGET_DATE:-$(TZ=Asia/Tokyo date +%Y%m%d)}"
          if ! [[ "$TARGET_DATE" =~ ^[0-9]{8}$ ]]; then
            echo "Invalid TARGET_DATE" >&2
            exit 1
          fi
          DAY_PATH="evaluations/${TARGET_DATE:0:4}/${TARGET_DATE:4:2}/${TARGET_DATE:6:2}/recovery"
          if ! test -s "$DAY_PATH/live_recovery_manifest_${TARGET_DATE}.json"; then
            echo "当日復旧manifestは未作成。予測と買い目には変更しません。"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: 復旧スコアを共通予測正本へ統合して保存
        if: steps.date.outputs.run == 'true'
        env:
          TARGET_DATE: ${{ steps.date.outputs.date }}
        run: |
          set -euo pipefail
          # Canonical write can overlap real-time predictions. Always rebuild
          # using the newest committed main, never rebase generated JSON/CSV.
          rebuild_from_latest_main() {
          python -u collectors/build_latest_prediction_view.py --date "$TARGET_DATE"
          python -u collectors/build_deadline_prediction_view.py --date "$TARGET_DATE"
          python - <<'PY'
          import os,sys
          sys.path.insert(0,'collectors')
          from race_prediction_store import load_canonical, audit_canonical
          from recovery_live_overlay import load_verified_recovered_live
          d=os.environ['TARGET_DATE']
          recovered=load_verified_recovered_live(d)
          canonical=load_canonical(d)
          summary=audit_canonical(canonical)
          print('CANONICAL_RECOVERY_AUDIT', {k:v for k,v in summary.items() if k!='details'})
          by_id={row['race_id']:row for row in canonical['races']}
          for race_id in recovered:
              row=by_id.get(race_id)
              if row is None: raise SystemExit(f'Recovered race absent in canonical: {race_id}')
              quality=row.get('prediction_quality') or {}
              if quality.get('status')!='recovered_observation':
                  # A genuinely saved live prediction has higher precedence
                  # than retrospective recovery; never downgrade it.
                  if row.get('prediction_type')!='直前' or quality.get('status')=='fallback':
                      raise SystemExit(f'Recovered race unprocessed and no saved live: {race_id}')
              from race_prediction_store import audit_race
              state=audit_race(row)
              if state['signal_key'] and state['signal_ai_status']!='ready':
                  raise SystemExit(f'Active signal lacks 24 tickets: {race_id}, {state}')
          PY
          # Research version is manually refreshed; unfinished races are
          # excluded from failures, while genuinely missing finished data
          # remain distinguishable. This audit is persisted with the canonical.
          python -u collectors/audit_daily_completeness.py --date "$TARGET_DATE"
          python - <<'PY_AUDIT'
          import os,json,pathlib
          d=os.environ["TARGET_DATE"]
          path=pathlib.Path("evaluations")/d[:4]/d[4:6]/d[6:8]/"data_quality"/f"completeness_{d}.json"
          report=json.loads(path.read_text(encoding="utf-8"))
          research=report.get("research_audit") or {}
          if report.get("automatic_collection_enabled") is not False:
              raise SystemExit("Research manual mode lost")
          if report.get("status") == "INCOMPLETE" and not report.get("issues"):
              raise SystemExit("Uncollected results must not count as audit errors")
          for pending in report.get("pending_result_details") or []:
              if pending.get("status") != "AWAITING_MANUAL_RESULT_COLLECTION":
                  raise SystemExit(f"Incorrect automatic collection audit: {pending}")
          if research.get("research_status") not in ("PASS","MANUAL_RECONCILIATION_PENDING"):
              raise SystemExit(f"Research audit is invalid: {research}")
          print("MANUAL_RESEARCH_AUDIT", research.get("research_status"),
                research.get("valid_research_races"), research.get("requires_manual_completion"))
          PY_AUDIT
          # Canonical recovery just replaced provisional/archived V1 signals with
          # verified V2. The independent PDCA MUST be recomputed NOW from this
          # canonical before comparing per-race F/R levels. The intraday PDCA
          # runs earlier (on the last committed canonical) and can legitimately
          # contain stale V1 rank gates or omit recovered races.
          python -u collectors/evaluate_fujin_raijin_history.py --date "$TARGET_DATE"
          test -s "evaluations/${TARGET_DATE:0:4}/${TARGET_DATE:4:2}/${TARGET_DATE:6:2}/fujin_raijin_combo_${TARGET_DATE}.json"
          test -s evaluations/fujin_raijin/latest/backtest_details.csv
          # Prevent a genuine signal from becoming an old F0R0 placeholder.
          # Check all finished races: six-boat score recomputation, persisted
          # canonical levels and the independent cumulative PDCA source.
          # A different race's cumulative PDCA mismatch must not block
          # validated recovered signals/tickets from being persisted. Preserve
          # the failed audit report AND fail the job only after publication.
          if python -u collectors/audit_signal_consistency.py \
            --date "$TARGET_DATE" \
            --output "evaluations/${TARGET_DATE:0:4}/${TARGET_DATE:4:2}/${TARGET_DATE:6:2}/data_quality/signal_display_consistency_${TARGET_DATE}.json"; then
            echo "SIGNAL_RECOVERY_AUDIT=PASS" >> "$GITHUB_ENV"
          else
            echo "SIGNAL_RECOVERY_AUDIT=FAIL" >> "$GITHUB_ENV"
            echo "::warning::Signal parity anomalies remain; save verified per-race recovery with the failure report."
          fi
          git config user.name boatrace-recovery-bot
          git config user.email boatrace-recovery-bot@users.noreply.github.com
          git add "predictions/${TARGET_DATE:0:4}/${TARGET_DATE:4:2}/${TARGET_DATE:6:2}/live/formation_predictions_final_${TARGET_DATE}.json"
          git add "predictions/${TARGET_DATE:0:4}/${TARGET_DATE:4:2}/${TARGET_DATE:6:2}/live/formation_predictions_final_${TARGET_DATE}.csv"
          git add predictions/latest.md predictions/latest.json predictions/latest_by_deadline.md predictions/latest_by_deadline.json
          git add "evaluations/${TARGET_DATE:0:4}/${TARGET_DATE:4:2}/${TARGET_DATE:6:2}/data_quality"
          git add "evaluations/${TARGET_DATE:0:4}/${TARGET_DATE:4:2}/${TARGET_DATE:6:2}/fujin_raijin_combo_${TARGET_DATE}.json"
          git add evaluations/fujin_raijin/latest/backtest_details.csv
          git add evaluations/fujin_raijin/latest/backtest_summary.json
          git add evaluations/fujin_raijin/latest/combination_matrix.csv
          if git diff --cached --quiet; then
            echo "共通正本はすでに最新"
            return 0
          fi
          git commit -m "Sync verified official live recovery into canonical signal predictions for $TARGET_DATE"
          }
          for attempt in 1 2 3 4 5; do
            echo "最新mainから正本再生成 attempt=$attempt"
            git fetch origin main
            git reset --hard origin/main
            rebuild_from_latest_main
            if git push origin HEAD:main; then
              echo "公式直前復旧の共通正本保存: PASS"
              exit 0
            fi
            echo "並行更新を検出。生成ファイルのrebaseは禁止し最新mainから再計算"
            sleep "$((attempt * 2))"
          done
          echo "並行更新が継続しているため安全停止。次回再生成対象を維持" >&2
          exit 1

      - name: 共通正本同期の成功後に家族4画面を明示更新
        if: steps.date.outputs.run == 'true' && !inputs.skip_family_publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bot-pushed commits do not fire ordinary push workflows. This explicit
          # dispatch follows verified canonical save and also covers no-op reruns.
          # Comparison page can land while full-day PDCA/audit runs separately.
          gh workflow run race_compare_fast.yml --repo "${GITHUB_REPOSITORY}" \
            --ref main -f target_date="${{ steps.date.outputs.date }}"
          gh workflow run family_prediction_page.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "公式復旧の保存後に家族4画面の公開を予約: PASS"

      - name: 復旧後の全体監査異常を通知（復旧正本と公開は維持）
        if: steps.date.outputs.run == 'true' && env.SIGNAL_RECOVERY_AUDIT == 'FAIL'
        run: |
          echo "::error::Other races have unresolved parity exceptions. Saved validated recoveries and triggered publication; inspect daily signal_display_consistency JSON."
          exit 1

