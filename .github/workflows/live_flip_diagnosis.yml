name: 直前ロジック反転診断
on:
  push:
    branches: [main]
    paths: ["collectors/evaluate_live_flip_diagnosis.py",".github/workflows/live_flip_diagnosis.yml"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python collectors/evaluate_live_flip_diagnosis.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/live_flip_diagnosis_20260930_20261003/
          git diff --cached --quiet || git commit -m "Save live flip diagnosis"
          git pull --rebase origin main
          git push origin main
