name: 毎日・高速予測結果評価

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "評価対象日 YYYYMMDD（空欄は昨日）"
        required: false
        type: string

concurrency:
  group: boatrace-fast-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 最新のmainを読み込む
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリを準備
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas scipy

      - name: 前日の日付を設定
        run: |
          INPUT_DATE="${{ github.event.inputs.target_date }}"
          if [ -n "${INPUT_DATE}" ]; then
            TARGET_DATE="${INPUT_DATE}"
          else
            TARGET_DATE=$(TZ=Asia/Tokyo date -d "yesterday" +%Y%m%d)
          fi

          YEAR=${TARGET_DATE:0:4}
          MONTH=${TARGET_DATE:4:2}
          DAY=${TARGET_DATE:6:2}

          BASE_CACHE_DIR="daily_inputs/${YEAR}/${MONTH}/${DAY}/base"
          ARCHIVE_BASE_DIR="archive/${YEAR}/${MONTH}/${DAY}/pre_race/base"
          EVAL_DIR="evaluations/${YEAR}/${MONTH}/${DAY}"
          PREDICTION_DIR="predictions/${YEAR}/${MONTH}/${DAY}"

          echo "TARGET_DATE=${TARGET_DATE}" >> "$GITHUB_ENV"
          echo "YEAR=${YEAR}" >> "$GITHUB_ENV"
          echo "MONTH=${MONTH}" >> "$GITHUB_ENV"
          echo "DAY=${DAY}" >> "$GITHUB_ENV"
          echo "BASE_CACHE_DIR=${BASE_CACHE_DIR}" >> "$GITHUB_ENV"
          echo "ARCHIVE_BASE_DIR=${ARCHIVE_BASE_DIR}" >> "$GITHUB_ENV"
          echo "EVAL_DIR=${EVAL_DIR}" >> "$GITHUB_ENV"
          echo "PREDICTION_DIR=${PREDICTION_DIR}" >> "$GITHUB_ENV"
          echo "REPO_CHANGED=false" >> "$GITHUB_ENV"

          echo "========================================"
          echo "毎日・高速予測結果評価＋PDCA"
          echo "対象日: ${TARGET_DATE}"
          echo "========================================"

      - name: 前日の番組データを復元
        run: |
          mkdir -p data

          RACES_FILE="data/program_races_${TARGET_DATE}.csv"
          ENTRIES_FILE="data/program_entries_${TARGET_DATE}.csv"

          CACHE_RACES="${BASE_CACHE_DIR}/program_races_${TARGET_DATE}.csv"
          CACHE_ENTRIES="${BASE_CACHE_DIR}/program_entries_${TARGET_DATE}.csv"

          ARCHIVE_RACES="${ARCHIVE_BASE_DIR}/program_races_${TARGET_DATE}.csv"
          ARCHIVE_ENTRIES="${ARCHIVE_BASE_DIR}/program_entries_${TARGET_DATE}.csv"

          if [ -s "${RACES_FILE}" ] && [ -s "${ENTRIES_FILE}" ]; then
            echo "data内の番組データを使用します"

          elif [ -s "${CACHE_RACES}" ] && [ -s "${CACHE_ENTRIES}" ]; then
            cp "${CACHE_RACES}" "${RACES_FILE}"
            cp "${CACHE_ENTRIES}" "${ENTRIES_FILE}"

            echo "daily_inputsの基本データをdataへ復元しました"

          elif [ -s "${ARCHIVE_RACES}" ] && [ -s "${ARCHIVE_ENTRIES}" ]; then
            cp "${ARCHIVE_RACES}" "${RACES_FILE}"
            cp "${ARCHIVE_ENTRIES}" "${ENTRIES_FILE}"

            echo "archiveの基本データをdataへ復元しました"

          else
            echo "ERROR: 高速結果取得に必要な番組データがありません"
            echo ""
            echo "必要:"
            echo "program_races_${TARGET_DATE}.csv"
            echo "program_entries_${TARGET_DATE}.csv"
            echo ""
            echo "確認場所:"
            echo "data/"
            echo "${BASE_CACHE_DIR}/"
            echo "${ARCHIVE_BASE_DIR}/"

            exit 1
          fi

          test -s "${RACES_FILE}"
          test -s "${ENTRIES_FILE}"

          echo "前日番組データ復元: PASS"

      - name: 高速で公式結果を取得
        run: |
          echo "========================================"
          echo "高速公式結果取得"
          echo "対象日: ${TARGET_DATE}"
          echo "========================================"

          python -u collectors/fast_results.py \
            --date "${TARGET_DATE}"

      - name: 高速結果取得を確認
        run: |
          FILE="data/fast_results_validation_${TARGET_DATE}.json"

          test -s "${FILE}"

          cat "${FILE}"

          if grep -q '"status": "PASS"' "${FILE}"; then
            echo "高速結果取得: PASS"
          else
            echo "高速結果取得: FAIL"
            exit 1
          fi

      - name: 結果CSVを確認
        run: |
          python - <<'PY'
          import os
          import pandas as pd

          date = os.environ["TARGET_DATE"]

          results = pd.read_csv(
              f"data/results_{date}_all.csv"
          )

          boats = pd.read_csv(
              f"data/boat_results_{date}_all.csv"
          )

          print(
              "results:",
              len(results),
              "races"
          )

          print(
              "boat_results:",
              len(boats),
              "rows"
          )

          if len(results) <= 0:
              raise SystemExit(
                  "結果レースが0件です"
              )

          if len(boats) <= 0:
              raise SystemExit(
                  "艇別結果が0件です"
              )

          print(
              "結果CSV確認: PASS"
          )
          PY

      - name: 予測ファイルを確認
        run: |
          MORNING_FILE="${PREDICTION_DIR}/morning_predictions_${TARGET_DATE}.json"
          FORMATION_FILE="${PREDICTION_DIR}/live/formation_predictions_final_${TARGET_DATE}.json"

          if [ ! -s "${MORNING_FILE}" ]; then
            echo "ERROR: 朝予測がありません"
            echo "${MORNING_FILE}"
            exit 1
          fi

          if [ ! -s "${FORMATION_FILE}" ]; then
            echo "ERROR: フォーメーション予測がありません"
            echo "${FORMATION_FILE}"
            exit 1
          fi

          echo "予測ファイル確認: PASS"

      - name: 前日の総合評価を実行
        run: |
          echo "========================================"
          echo "予測総合評価開始"
          echo "朝予測・直前予測"
          echo "フォーメーション・上位3艇BOX"
          echo "========================================"

          python -u collectors/evaluate_predictions.py \
            --date "${TARGET_DATE}"

      - name: AIスコア予測を答え合わせ
        run: |
          echo "========================================"
          echo "AIスコア予測・着順別120通りの答え合わせ"
          echo "========================================"
          python -u collectors/evaluate_ai_score_prediction.py \
            --date "${TARGET_DATE}"
          test -s "${EVAL_DIR}/ai_score_simulation_${TARGET_DATE}.json"
          test -s "${EVAL_DIR}/ai_score_simulation_${TARGET_DATE}.csv"
          echo "AIスコア予測評価: PASS"

      - name: スコア構成要素を答え合わせ
        run: |
          echo "========================================"
          echo "スコア配分・実結果の答え合わせ"
          echo "========================================"

          python -u collectors/analyze_score_components.py \
            --date "${TARGET_DATE}"

          test -s "${EVAL_DIR}/score_component_analysis_${TARGET_DATE}.json"
          test -s "${EVAL_DIR}/score_feature_stats_${TARGET_DATE}.csv"

          echo "スコア構成要素分析: PASS"

      - name: 直前要素を答え合わせ
        run: |
          echo "========================================"
          echo "展示・ST・進入・風波の答え合わせ"
          echo "========================================"

          python -u collectors/analyze_live_factors.py \
            --date "${TARGET_DATE}"

          test -s "${EVAL_DIR}/live_factor_analysis_${TARGET_DATE}.json"
          test -s "${EVAL_DIR}/live_factor_answer_check_${TARGET_DATE}.csv"

          echo "直前要素分析: PASS"

      - name: 直近7日PDCAを生成
        run: |
          echo "========================================"
          echo "直近7日PDCAレポート"
          echo "========================================"

          python -u collectors/build_pdca_report.py \
            --date "${TARGET_DATE}" \
            --days 7

          test -s evaluations/latest_pdca.json
          test -s evaluations/latest_pdca.md

          echo ""
          echo "========================================"
          echo "7日PDCAレポート"
          echo "========================================"

          cat evaluations/latest_pdca.md

          echo ""
          echo "7日PDCA: PASS"

      - name: 評価ファイルを確認
        run: |
          REQUIRED_FILES=(
            "${EVAL_DIR}/prediction_evaluation_${TARGET_DATE}.json"
            "${EVAL_DIR}/formation_simulation_${TARGET_DATE}.json"
            "${EVAL_DIR}/top3_box_simulation_${TARGET_DATE}.json"
            "${EVAL_DIR}/ai_score_simulation_${TARGET_DATE}.json"
            "${EVAL_DIR}/score_component_analysis_${TARGET_DATE}.json"
            "${EVAL_DIR}/live_factor_analysis_${TARGET_DATE}.json"
            "evaluations/latest_pdca.json"
            "evaluations/latest_pdca.md"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [ ! -s "${FILE}" ]; then
              echo "ERROR: 評価ファイルがありません"
              echo "${FILE}"

              exit 1
            fi

          done

          echo "評価ファイル確認: PASS"

      - name: 見やすい総合結果を生成
        run: |
          python -u collectors/build_evaluation_summary.py \
            --date "${TARGET_DATE}"

          test -s evaluations/latest_summary.md

          echo ""
          echo "========================================"
          echo "総合結果サマリー"
          echo "========================================"

          cat evaluations/latest_summary.md

      - name: 評価結果をArtifactへ保存
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-daily-fast-evaluation-${{ github.run_number }}
          path: |
            data/fast_results_validation_*.json
            data/results_*_all.csv
            data/boat_results_*_all.csv
            evaluations/**/*.json
            evaluations/**/*.csv
            evaluations/**/*.md
          if-no-files-found: error
          retention-days: 30

      - name: 結果と評価をGitHubへ保存
        run: |
          git config \
            user.name \
            "boatrace-data-bot"

          git config \
            user.email \
            "boatrace-data-bot@users.noreply.github.com"

          git add \
            "archive/${YEAR}/${MONTH}/${DAY}"

          git add \
            "evaluations/${YEAR}/${MONTH}/${DAY}"

          git add \
            "evaluations/latest_summary.md"

          git add \
            "evaluations/latest_score_analysis.md"

          git add \
            "evaluations/latest_pdca.json"

          git add \
            "evaluations/latest_pdca.md"

          if git diff --cached --quiet; then
            echo "REPO_CHANGED=false" >> "$GITHUB_ENV"
            echo "新しい変更はありません"

            exit 0
          fi

          RUN_STAMP=$(TZ=Asia/Tokyo date '+%Y%m%d_%H%M%S')

          git commit \
            -m "Daily evaluate and PDCA ${TARGET_DATE} ${RUN_STAMP}"

          for ATTEMPT in 1 2 3; do

            echo "push attempt: ${ATTEMPT}"

            git pull \
              --rebase \
              origin \
              main

            if git push \
              origin \
              HEAD:main
            then
              echo "REPO_CHANGED=true" >> "$GITHUB_ENV"
              echo "GitHub保存: PASS"

              exit 0
            fi

            if [ "${ATTEMPT}" -lt 3 ]; then
              sleep 5
            fi

          done

          echo "ERROR: GitHub保存に3回失敗しました"

          exit 1

      - name: 家族共有ページ更新を開始
        if: env.REPO_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          gh workflow run \
            family_prediction_page.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main

          echo "家族共有ページ更新開始: PASS"

      - name: 最終確認
        run: |
          echo ""
          echo "========================================"
          echo "毎日・高速予測結果評価＋PDCA 完了"
          echo "========================================"
          echo ""
          echo "対象日: ${TARGET_DATE}"
          echo ""
          echo "高速公式結果取得: PASS"
          echo "予測総合評価: PASS"
          echo "フォーメーション評価: PASS"
          echo "上位3艇BOX評価: PASS"
          echo "AIスコア予測評価: PASS"
          echo "スコア構成要素分析: PASS"
          echo "直前要素分析: PASS"
          echo "直近7日PDCA: PASS"
          echo "総合結果サマリー: PASS"
          echo "GitHub更新: ${REPO_CHANGED}"
          echo ""
          echo "========================================"