name: 9月30日・高速予測結果評価

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: boatrace-fast-evaluation-0930
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TARGET_DATE: "20260930"
      YEAR: "2026"
      MONTH: "09"
      DAY: "30"

    steps:
      - name: 最新のmainを読み込む
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリを準備
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: 高速で公式結果を取得
        run: |
          echo "========================================"
          echo "9月30日 高速結果取得"
          echo "========================================"

          python -u collectors/fast_results.py \
            --date "${TARGET_DATE}"

      - name: 高速結果取得を確認
        run: |
          FILE="data/fast_results_validation_${TARGET_DATE}.json"

          test -s "${FILE}"

          cat "${FILE}"

          if grep -q '"status": "PASS"' "${FILE}"; then
            echo "高速結果取得: PASS"
          else
            echo "高速結果取得: FAIL"
            exit 1
          fi

      - name: 結果CSVを確認
        run: |
          echo ""
          echo "========================================"
          echo "結果CSV確認"
          echo "========================================"

          test -s "data/results_${TARGET_DATE}_all.csv"
          test -s "data/boat_results_${TARGET_DATE}_all.csv"
          test -s "data/venues_${TARGET_DATE}.csv"

          echo ""
          echo "払戻・結果レース数:"

          python - <<'PY'
          import pandas as pd

          date = "20260930"

          results = pd.read_csv(
              f"data/results_{date}_all.csv"
          )

          boats = pd.read_csv(
              f"data/boat_results_{date}_all.csv"
          )

          print(
              "results:",
              len(results),
              "races"
          )

          print(
              "boat_results:",
              len(boats),
              "rows"
          )

          if len(results) != 144:
              raise SystemExit(
                  "144レース揃っていません"
              )

          print(
              "144レース確認: PASS"
          )
          PY

      - name: 9月30日の総合評価を実行
        run: |
          echo ""
          echo "========================================"
          echo "予測総合評価開始"
          echo "========================================"

          python -u collectors/evaluate_predictions.py \
            --date "${TARGET_DATE}"

      - name: 評価結果を表示
        run: |
          EVAL_DIR="evaluations/${YEAR}/${MONTH}/${DAY}"

          echo ""
          echo "========================================"
          echo "評価結果"
          echo "========================================"

          test -d "${EVAL_DIR}"

          find "${EVAL_DIR}" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          echo ""
          echo "========================================"
          echo "JSON評価内容"
          echo "========================================"

          FOUND=0

          for FILE in "${EVAL_DIR}"/*.json
          do
            if [ -f "${FILE}" ]; then
              FOUND=1

              echo ""
              echo "----------------------------------------"
              echo "${FILE}"
              echo "----------------------------------------"

              cat "${FILE}"
            fi
          done

          if [ "${FOUND}" -eq 0 ]; then
            echo "評価JSONがありません"
            exit 1
          fi

      - name: 評価結果をArtifactへ保存
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-fast-evaluation-20260930-${{ github.run_number }}
          path: |
            data/fast_results_validation_20260930.json
            data/results_20260930_all.csv
            data/boat_results_20260930_all.csv
            evaluations/2026/09/30/
          if-no-files-found: error
          retention-days: 30

      - name: 結果と評価をGitHubへ保存
        run: |
          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"

          git add "archive/${YEAR}/${MONTH}/${DAY}"
          git add "evaluations/${YEAR}/${MONTH}/${DAY}"

          if git diff --cached --quiet; then
            echo "新しい変更はありません"
            exit 0
          fi

          RUN_STAMP=$(TZ=Asia/Tokyo date '+%Y%m%d_%H%M%S')

          git commit -m \
            "Fast evaluate predictions ${TARGET_DATE} ${RUN_STAMP}"

          git push origin HEAD:main

          echo "GitHub保存: PASS"

      - name: 最終確認
        run: |
          echo ""
          echo "========================================"
          echo "9月30日 高速総合評価 完了"
          echo "========================================"
          echo ""
          echo "公式結果取得: PASS"
          echo "144レース確認: PASS"
          echo "予測評価: PASS"
          echo "GitHub保存: PASS"