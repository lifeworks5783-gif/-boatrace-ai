name: Personal ST delta current
on:
  workflow_dispatch:
  push:
    paths:
      - "collectors/evaluate_personal_st_delta_current.py"
      - "features/racer_features.csv"
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python collectors/evaluate_personal_st_delta_current.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/personal_st_delta/summary.json
          git diff --cached --quiet && exit 0
          git commit -m "data: evaluate personal ST delta"
          git push
