name: Manual button publication route regression
on:
  push:
    branches: ["fix/manual-button-fast-publication-20261013"]
  pull_request:
    paths: [".github/workflows/live_prediction_0930.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q pyyaml
      - name: Assert manual raw-ready publish route without formula edits
        run: |
          python - <<'PY'
          import yaml
          p='.github/workflows/live_prediction_0930.yml'
          with open(p,encoding='utf-8') as f: spec=yaml.safe_load(f)
          steps=spec['jobs']['live_prediction']['steps']
          match=[s for s in steps if s.get('name')=='ボタン予測保存後に最新情報だけ優先公開']
          assert len(match)==1
          step=match[0]
          assert "env.PRIVATE_CHANGED == 'true'" in step['if']
          assert "env.RAW_READY == 'true'" in step['if']
          assert "fast_family_prediction_page.yml" in step['run']
          assert "-f target_date=" in step['run']
          assert all('collectors/build_live_prediction.py' not in s.get('run','') for s in match)
          print('BUTTON_PUBLICATION_GATED_TEST_PASS')
          PY
