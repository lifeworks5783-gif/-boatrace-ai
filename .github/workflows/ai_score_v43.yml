name: AI score V4.3 dynamic budget sandbox
on:
  push:
    branches: [main]
    paths: ["config/run_ai_score_v43.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile collectors/evaluate_ai_score_freeform_v43.py
      - run: python collectors/evaluate_ai_score_freeform_v43.py
      - run: |
          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"
          git add evaluations/ai_score_freeform_v43
          git diff --cached --quiet && exit 0
          git commit -m "Update AI score V4.3 dynamic-budget results"
          git pull --rebase origin main
          git push origin main
