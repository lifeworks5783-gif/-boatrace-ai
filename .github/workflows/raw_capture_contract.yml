name: Raw official HTTP capture contract tests
on:
  pull_request:
    paths:
      - "raw_collector/**"
      - "tests/test_raw_archiving_contract.py"
      - ".github/workflows/raw_capture_contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm archive module compiles
        run: python -m py_compile raw_collector/archive.py
      - name: Validate raw preservation and parser independence
        run: python -m unittest discover -s tests -p test_raw_archiving_contract.py -v
      - name: Install research parser dependencies for one-race live smoke
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: One official race — raw, parse, historical features, normal score and F/R
        run: python -m raw_collector.one_race_probe

# Only two controlled read-only official requests for one real-race smoke test.
# Deliberately NO cron and NO public HTML archive upload.
# Raw data needs an access-controlled destination before recurring collection.
