name: 10月2日・固定整合率検証

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/alignment_20261002.yml"
      - "collectors/evaluate_backfill_alignment_20261002.py"

concurrency:
  group: boatrace-main-writer
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 整合率を計算
        run: python -u collectors/evaluate_backfill_alignment_20261002.py
      - name: 定義と件数を再検証
        run: |
          python - <<'PY'
          import json
          p="evaluations/2026/10/02/backfill_alignment/alignment_summary_20261002.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["overall"]["races"]==168
          assert "順不同で完全一致" in d["definition"]
          print("固定整合率ルール・168R: PASS")
          PY
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/2026/10/02/backfill_alignment
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evaluation: calculate fixed top3 alignment for 20261002"
          git stash push --include-untracked -m temp || true
          git pull --rebase origin main
          git push origin HEAD:main
