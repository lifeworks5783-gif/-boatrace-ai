name: 暫定朝・直前4日検証
on:
  push:
    branches: [main]
    paths:
      - "collectors/evaluate_provisional_morning_live_4day.py"
      - ".github/workflows/provisional_morning_live_4day.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collectors/evaluate_provisional_morning_live_4day.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/provisional_morning_live_4day/
          git diff --cached --quiet || git commit -m "Save provisional morning live validation"
          git pull --rebase origin main
          git push origin main
