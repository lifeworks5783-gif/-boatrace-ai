name: Saved-data PDCA refresh

on:
  push:
    branches: [main]
    paths:
      - "config/run_saved_pdca_*.txt"
  workflow_dispatch:
    inputs:
      target_date:
        description: "PDCA対象日 YYYYMMDD"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: pdca-incremental-main
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 最新mainを読み込む
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PDCA分析用ライブラリをインストール
        run: python -m pip install requests beautifulsoup4 lhafile pandas numpy scipy

      - name: 対象日を設定
        run: |
          INPUT_DATE="${{ github.event.inputs.target_date }}"
          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE="$INPUT_DATE"
          else
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" | grep -E '^config/run_saved_pdca_[0-9]{8}\.txt$' | head -1 || true)
            test -n "$CHANGED"
            TARGET_DATE=$(basename "$CHANGED" | sed -E 's/run_saved_pdca_([0-9]{8})\.txt/\1/')
          fi
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          echo "YEAR=${TARGET_DATE:0:4}" >> "$GITHUB_ENV"
          echo "MONTH=${TARGET_DATE:4:2}" >> "$GITHUB_ENV"
          echo "DAY=${TARGET_DATE:6:2}" >> "$GITHUB_ENV"

      - name: AI分析前に公式結果と不足直前情報を再収集して完全性を再監査
        run: |
          set -euo pipefail
          BASE="daily_inputs/${YEAR}/${MONTH}/${DAY}/base"
          test -s "$BASE/program_races_${TARGET_DATE}.csv"
          test -s "$BASE/program_entries_${TARGET_DATE}.csv"
          mkdir -p data
          cp "$BASE/program_races_${TARGET_DATE}.csv" data/
          cp "$BASE/program_entries_${TARGET_DATE}.csv" data/
          # Do not spend minutes downloading the same all-day official results
          # again when stored results + six-boat entries + independent audit
          # already prove FULL coverage. Failure falls through to source retry.
          if python - <<'PY'
          import csv,json,os,re,sys
          from collections import Counter
          from pathlib import Path
          d=os.environ["TARGET_DATE"]
          day=Path(d[:4])/d[4:6]/d[6:8]
          base=Path("daily_inputs")/day/"base"
          arc=Path("archive")/day
          audit_file=Path("evaluations")/day/"data_quality"/f"completeness_{d}.json"
          def fail(message):
              print("PDCA_CACHE_RECHECK_REQUIRED",message,flush=True)
              sys.exit(1)
          def read_csv(path):
              if not path.is_file(): fail(str(path))
              with path.open(encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          def race_id(value):
              digits="".join(c for c in str(value or "") if c.isdigit())
              return digits[:12] if len(digits)>=12 else ""
          if not audit_file.is_file(): fail("audit_missing")
          q=json.loads(audit_file.read_text(encoding="utf-8"))
          plan={race_id(v.get("race_id")) for v in read_csv(base/f"program_races_{d}.csv")}
          actual={race_id(v.get("race_id")) for v in read_csv(arc/f"results_{d}_all.csv")}
          counts=Counter(race_id(v.get("race_id")) for v in read_csv(arc/f"boat_results_{d}_all.csv"))
          if not (q.get("date")==d and q.get("status")=="PASS" and
              q.get("research_audit",{}).get("research_status")=="PASS" and
              q.get("expected_races")==len(plan) and len(plan)>0 and
              q.get("result_races")==q.get("complete_races")==len(plan) and
              q.get("pending_races")==q.get("incomplete_races")==0 and
              q.get("needs_recollection") is False and actual==plan and
              all(counts.get(r)==6 for r in plan)):
              fail("result_identity_or_integrity_mismatch")
          print("PDCA_VERIFIED_SAVED_FULL_DAY",d,len(actual),"official result races and six-boat rows",flush=True)
          PY
          then
            echo "Independently verified all saved official inputs; skip duplicate HTTP collection"
            exit 0
          fi
          python -u collectors/daily_results_fast.py --date "$TARGET_DATE"
          python -u collectors/validate_daily.py --date "$TARGET_DATE"
          python -u collectors/audit_daily_completeness.py --date "$TARGET_DATE"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=os.environ["TARGET_DATE"]
          p=Path("evaluations")/d[:4]/d[4:6]/d[6:8]/"data_quality"/f"completeness_{d}.json"
          x=json.loads(p.read_text(encoding="utf8"))
          if x.get("needs_recollection") or x.get("incomplete_races",0):
              raise SystemExit("missing original data detected: official live recollection required before PDCA")
          PY
          python -u collectors/today_beforeinfo.py --date "$TARGET_DATE" --mode missing
          python -u collectors/audit_daily_completeness.py --date "$TARGET_DATE"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=os.environ["TARGET_DATE"]
          p=Path("evaluations")/d[:4]/d[4:6]/d[6:8]/"data_quality"/f"completeness_{d}.json"
          x=json.loads(p.read_text(encoding="utf8"))
          if not (x.get("status")=="PASS" and x.get("expected_races",0)>0
                  and x.get("result_races")==x.get("expected_races")
                  and x.get("complete_races")==x.get("expected_races")
                  and x.get("pending_races")==0 and x.get("incomplete_races")==0):
              raise SystemExit("official source recovery incomplete: refuse partial full-day PDCA")
          PY

      - name: 保存済みデータの完全性を確認
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=os.environ["TARGET_DATE"]
          p=Path("evaluations")/d[:4]/d[4:6]/d[6:8]/"data_quality"/f"completeness_{d}.json"
          q=json.loads(p.read_text(encoding="utf-8"))
          print({"status":q.get("status"),"audited":q.get("audited_races"),"complete":q.get("complete_races"),"incomplete":q.get("incomplete_races")})
          expected=int(q.get("expected_races") or 0)
          result=int(q.get("result_races") or 0)
          complete=int(q.get("complete_races") or 0)
          audited=int(q.get("audited_races") or 0)
          incomplete=int(q.get("incomplete_races") or 0)
          research=(q.get("research_audit") or {})
          # 10/10 has 156 races; days have different official schedules.
          # During a live day, pending races are NOT data defects.
          if not (q.get("status")=="PASS" and research.get("research_status")=="PASS"
                  and 0 < result <= expected <= audited and complete == result
                  and incomplete == 0):
              raise SystemExit("saved-data PDCA requires all finished races verified PASS")
          PY

      - name: 風神雷神の日次シグナルを再評価
        run: python -u collectors/evaluate_down_signal.py --date "$TARGET_DATE"

      - name: 風神雷神の組み合わせ・累積を再評価
        run: python -u collectors/evaluate_fujin_raijin_history.py --date "$TARGET_DATE"

      - name: 風神の詳細PDCAを日次・累積更新
        run: python -u collectors/evaluate_fujin_deep_metrics.py --date "$TARGET_DATE"

      - name: バフ・デバフ候補を再探索
        run: python -u collectors/evaluate_fujin_raijin_buff_debuff_search.py --date "$TARGET_DATE"

      - name: 強度別6〜24点を再探索
        run: python -u collectors/evaluate_fujin_raijin_strength_points.py --date "$TARGET_DATE"

      - name: 現行シグナルAI補正の累積成績を更新
        run: |
          python -u collectors/evaluate_signal_ai_performance.py
          test -s evaluations/signal_ai/latest/summary.json
          test -s evaluations/signal_ai/latest/details.csv

      - name: 雷神の順位制限なし新版を過去全件で別集計
        run: |
          python -u collectors/evaluate_raijin_all_rank_replay.py --output-dir evaluations/raijin_all_rank_v2_replay
          test -s evaluations/raijin_all_rank_v2_replay/summary.json
          test -s evaluations/raijin_all_rank_v2_replay/details.csv

      - name: 120通りの実着順位を朝・直前・シグナル補正で分解し研究データを更新
        run: |
          python -u collectors/evaluate_signal_rank_research.py
          test -s evaluations/signal_rank_research/v1/summary.json
          test -s evaluations/signal_rank_research/v1/race_diagnostics.csv
          test -s evaluations/signal_rank_research/v1/daily/${TARGET_DATE}/summary.json

      - name: 全16分類×4買い方の旧保存シグナルと新雷神V2を別々に集計
        run: |
          python -u collectors/evaluate_signal_pdca_cross.py
          python -u collectors/evaluate_signal_pdca_cross.py --raijin-v2
          test -s evaluations/signal_pdca_cross/latest/summary.json
          test -s evaluations/raijin_v2_signal_pdca_cross/latest/summary.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=os.environ["TARGET_DATE"]
          audit_file=Path("evaluations")/d[:4]/d[4:6]/d[6:8]/"data_quality"/f"completeness_{d}.json"
          audit=json.loads(audit_file.read_text(encoding="utf-8"))
          expected=int(audit["complete_races"])
          for folder in ("signal_pdca_cross","raijin_v2_signal_pdca_cross"):
              p=Path("evaluations")/folder/"latest/summary.json"
              j=json.loads(p.read_text(encoding="utf-8"))
              day=j["per_date"].get(d)
              if not day:
                  raise SystemExit(f"{folder}: no date {d}")
              combos=day["combination_methods"]
              total=sum(x["races"] for x in combos.values())
              if len(combos)!=16 or total!=expected:
                  raise SystemExit(f"{folder}: expected 16 combinations with {expected} races, got {len(combos)}, {total}")
              for k,x in combos.items():
                  if set(x["methods"])!={"formation","top3_box","normal_ai","signal_ai24"}:
                      raise SystemExit(f"{folder}: incomplete method list for {k}")
              print("CROSS_PDCA_READY",folder,d,total,"16 classifications")
          PY

      - name: 買い方1・2・3の累積と最新日ホールドアウトを再集計
        run: |
          python -u collectors/evaluate_buying_strategy_pdca.py
          test -s evaluations/pdca_buying_strategy/latest/summary.json

      - name: 単体要素と直前要素の分析を日別保存
        run: |
          python -u collectors/prepare_live_analysis_input.py --date "$TARGET_DATE"
          python -u collectors/analyze_score_components.py --date "$TARGET_DATE"
          python -u collectors/analyze_live_factors.py --date "$TARGET_DATE"
          EVAL_DIR="evaluations/$YEAR/$MONTH/$DAY"
          test -s "$EVAL_DIR/score_component_analysis_${TARGET_DATE}.json"
          test -s "$EVAL_DIR/live_factor_analysis_${TARGET_DATE}.json"

      - name: 4日累積PDCAを再計算
        run: python -u collectors/evaluate_pdca_incremental_4day.py

      - name: 評価結果だけ保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/
          if git diff --cached --quiet; then
            echo "PDCA結果に変更なし"
            exit 0
          fi
          git commit -m "Refresh saved-data PDCA ${TARGET_DATE}"
          git restore .
          git clean -fd
          git pull --rebase origin main
          git push origin main

      - name: 家族共有AI分析ページを再公開
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run family_prediction_page.yml --ref main
          echo "家族共有ページ更新を開始しました。"
