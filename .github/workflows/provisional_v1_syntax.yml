name: 暫定V1構文確認
on:
  push:
    branches: [main]
    paths: ["collectors/build_morning_prediction.py","collectors/build_live_prediction.py",".github/workflows/provisional_v1_syntax.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile collectors/build_morning_prediction.py collectors/build_live_prediction.py
      - run: |
          # Model versions are now intentionally loaded from the independent
          # logic registry, not hardcoded into either calculator. Check the
          # actual production contract instead of stale source text.
          python - <<'PY'
          import sys
          sys.path.insert(0, "collectors")
          from logic_registry import load_logic, logic_identity
          import build_morning_prediction as morning
          import build_live_prediction as live
          assert morning.MODEL_VERSION == load_logic("morning")["model_version"]
          assert live.MODEL_VERSION == load_logic("live")["model_version"]
          assert morning.MODEL_VERSION and live.MODEL_VERSION
          assert morning.MORNING_WEIGHTS == load_logic("morning")["weights"]
          assert live.LIVE_WEIGHTS == load_logic("live")["weights"]
          assert sum(live.LIVE_WEIGHTS.values()) == 100, live.LIVE_WEIGHTS
          print("LOGIC_REGISTRY_SOURCE_OF_TRUTH_PASS",
                morning.MODEL_VERSION,live.MODEL_VERSION)
          PY
          python -m py_compile collectors/build_prediction_input.py collectors/enrich_prediction_input.py collectors/audit_daily_completeness.py collectors/evaluate_all_candidate_single_factors.py collectors/evaluate_live_extra_factors.py collectors/evaluate_environment_course_interactions.py collectors/evaluate_f_hold_inventory.py
          echo "PROVISIONAL_LIVE_READY"
