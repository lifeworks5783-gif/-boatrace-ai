name: Exhibition ST F Safety Simulation
on:
  push:
    branches: [main]
    paths:
      - "collectors/evaluate_st_f_safety_sim.py"
      - ".github/workflows/st_f_safety_sim.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collectors/evaluate_st_f_safety_sim.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/st_f_safety_sim_20260930_20261003/summary.json
          git diff --cached --quiet || git commit -m "Update exhibition ST F safety simulation"
          git push
