name: 当日データ＋履歴特徴量結合テスト

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: prediction-enrichment-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enrich_prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ファイルを読み込む
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリを準備
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lhafile

      - name: dataフォルダを準備
        run: |
          mkdir -p data

      - name: 当日基本データを収集
        run: |
          echo "========================================"
          echo "当日基本データ収集"
          echo "========================================"

          python -u collectors/today_basic.py

      - name: 朝版prediction_inputを生成
        run: |
          echo "========================================"
          echo "朝版prediction_input生成"
          echo "========================================"

          python -u collectors/build_prediction_input.py \
            --stage morning

      - name: 結合前ファイルを確認
        run: |
          echo "========================================"
          echo "結合前ファイル確認"
          echo "========================================"

          MISSING=0

          check_file () {
            FILE="$1"
            LABEL="$2"

            if [ -s "$FILE" ]; then
              echo "OK : ${LABEL}"
              echo "     ${FILE}"
            else
              echo "NG : ${LABEL}"
              echo "     ${FILE}"
              MISSING=$((MISSING + 1))
            fi
          }

          check_file \
            "data/prediction_input_morning_20260930.json" \
            "当日朝予測入力"

          check_file \
            "features/racer_features.csv" \
            "選手特徴量"

          check_file \
            "features/racer_course_features.csv" \
            "選手×コース特徴量"

          check_file \
            "features/racer_venue_features.csv" \
            "選手×場特徴量"

          check_file \
            "features/motor_features.csv" \
            "モーター特徴量"

          check_file \
            "features/boat_features.csv" \
            "ボート特徴量"

          check_file \
            "features/history_features_manifest.json" \
            "特徴量manifest"

          check_file \
            "collectors/enrich_prediction_input.py" \
            "結合プログラム"

          echo ""
          echo "不足ファイル数: ${MISSING}"

          if [ "${MISSING}" -ne 0 ]; then
            echo "ERROR: 必要ファイルが不足しています"
            exit 1
          fi

          echo ""
          echo "必要ファイル確認: PASS"

      - name: 当日864艇へ履歴特徴量を結合
        run: |
          echo "========================================"
          echo "9月30日 朝予測入力＋履歴特徴量"
          echo "========================================"

          python -u collectors/enrich_prediction_input.py \
            --date 20260930 \
            --stage morning

      - name: 結合検証結果を表示
        run: |
          echo "========================================"
          echo "結合検証結果"
          echo "========================================"

          test -s \
            data/prediction_input_enriched_morning_20260930.json

          test -s \
            data/prediction_input_enriched_validation_morning_20260930.json

          cat \
            data/prediction_input_enriched_validation_morning_20260930.json

      - name: JSON構文を確認
        run: |
          python -m json.tool \
            data/prediction_input_enriched_morning_20260930.json \
            > /dev/null

          python -m json.tool \
            data/prediction_input_enriched_validation_morning_20260930.json \
            > /dev/null

          echo "JSON構文: PASS"

      - name: 結合済み予測入力をGitHubへ保存
        run: |
          echo "========================================"
          echo "結合済みprediction_inputを保存"
          echo "========================================"

          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"

          git add \
            data/program_entries_20260930.csv \
            data/program_races_20260930.csv \
            data/program_manifest_20260930.json \
            data/program_validation_20260930.json \
            data/prediction_input_morning_20260930.json \
            data/prediction_input_validation_morning_20260930.json \
            data/prediction_input_enriched_morning_20260930.json \
            data/prediction_input_enriched_validation_morning_20260930.json

          if git diff --cached --quiet; then
            echo "変更はありません"
            exit 0
          fi

          git commit -m \
            "Build enriched morning prediction input 20260930"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin HEAD:"${GITHUB_REF_NAME}"

          echo ""
          echo "当日予測入力 GitHub保存完了"

      - name: 成果物を短期保存
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-enriched-prediction-${{ github.run_number }}
          path: |
            data/program_entries_20260930.csv
            data/program_races_20260930.csv
            data/program_manifest_20260930.json
            data/program_validation_20260930.json
            data/prediction_input_morning_20260930.json
            data/prediction_input_validation_morning_20260930.json
            data/prediction_input_enriched_morning_20260930.json
            data/prediction_input_enriched_validation_morning_20260930.json
          if-no-files-found: error
          retention-days: 7

      - name: 最終確認
        run: |