name: 毎日直前予測・本番

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [main]
    paths:
      - config/run_live_now.txt
  workflow_dispatch:
    inputs:
      raw_ready:
        description: "高速収集済みrawを再利用する"
        required: false
        default: false
        type: boolean

concurrency:
  group: boatrace-live-writer
  cancel-in-progress: true

jobs:
  live_prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BASE_CACHE_HIT: "false"
      BASE_CREATED: "false"
      HAS_CANDIDATES: "false"
      HAS_LIVE_PREDICTION: "false"
      PRIVATE_CHANGED: "false"
      RAW_READY: ${{ github.event_name == 'workflow_dispatch' && inputs.raw_ready && 'true' || 'false' }}

    steps:
      - name: 最新のmainを読み込む
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリを準備
        run: |
          pip install -q requests beautifulsoup4 lhafile

      - name: 日本時間を設定
        run: |
          TARGET_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          RUN_STAMP=$(TZ=Asia/Tokyo date +%Y%m%d_%H%M%S)
          NOW_ISO=$(TZ=Asia/Tokyo date +%Y-%m-%dT%H:%M:%S%:z)

          YEAR=${TARGET_DATE:0:4}
          MONTH=${TARGET_DATE:4:2}
          DAY=${TARGET_DATE:6:2}

          BASE_CACHE_DIR="daily_inputs/${YEAR}/${MONTH}/${DAY}/base"

          echo "TARGET_DATE=${TARGET_DATE}" >> "$GITHUB_ENV"
          echo "RUN_STAMP=${RUN_STAMP}" >> "$GITHUB_ENV"
          echo "NOW_ISO=${NOW_ISO}" >> "$GITHUB_ENV"
          echo "YEAR=${YEAR}" >> "$GITHUB_ENV"
          echo "MONTH=${MONTH}" >> "$GITHUB_ENV"
          echo "DAY=${DAY}" >> "$GITHUB_ENV"
          echo "BASE_CACHE_DIR=${BASE_CACHE_DIR}" >> "$GITHUB_ENV"

          echo "対象日: ${TARGET_DATE}"
          echo "実行時刻: ${NOW_ISO}"
          echo "基本データ保存先: ${BASE_CACHE_DIR}"

      - name: 保存済み当日基本データを確認
        run: |
          RACES_CACHE="${BASE_CACHE_DIR}/program_races_${TARGET_DATE}.csv"
          ENTRIES_CACHE="${BASE_CACHE_DIR}/program_entries_${TARGET_DATE}.csv"

          if [ -s "${RACES_CACHE}" ] && [ -s "${ENTRIES_CACHE}" ]; then
            echo "BASE_CACHE_HIT=true" >> "$GITHUB_ENV"

            echo "========================================"
            echo "当日基本データ: キャッシュあり"
            echo "today_basic.py は実行しません"
            echo "========================================"

            mkdir -p data

            find "${BASE_CACHE_DIR}" \
              -maxdepth 1 \
              -type f \
              -exec cp {} data/ \;

            echo "保存済み基本データ復元: PASS"
          else
            echo "BASE_CACHE_HIT=false" >> "$GITHUB_ENV"

            echo "========================================"
            echo "当日基本データ: キャッシュなし"
            echo "本日初回のため取得します"
            echo "========================================"
          fi

      - name: 本日初回のみ当日基本データを取得
        if: env.BASE_CACHE_HIT != 'true'
        run: |
          mkdir -p data
          mkdir -p "${BASE_CACHE_DIR}"

          python -u collectors/today_basic.py

          echo ""
          echo "生成された当日ファイル:"
          find data \
            -maxdepth 1 \
            -type f \
            -name "*${TARGET_DATE}*" \
            -print \
            | sort

          echo "BASE_CREATED=true" >> "$GITHUB_ENV"

          echo "当日基本データ取得: PASS"

      - name: 本日初回のみ基本データを長期保存
        if: env.BASE_CACHE_HIT != 'true'
        run: |
          mkdir -p "${BASE_CACHE_DIR}"

          find data \
            -maxdepth 1 \
            -type f \
            -name "*${TARGET_DATE}*" \
            -exec cp {} "${BASE_CACHE_DIR}/" \;

          echo ""
          echo "保存した基本データ:"
          find "${BASE_CACHE_DIR}" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo "当日基本データキャッシュ作成: PASS"

      - name: 当日基本データを確認
        run: |
          RACES_FILE="data/program_races_${TARGET_DATE}.csv"
          ENTRIES_FILE="data/program_entries_${TARGET_DATE}.csv"

          if [ ! -s "${RACES_FILE}" ]; then
            echo "ERROR: ${RACES_FILE} がありません"
            exit 1
          fi

          if [ ! -s "${ENTRIES_FILE}" ]; then
            echo "ERROR: ${ENTRIES_FILE} がありません"
            exit 1
          fi

          RACE_LINES=$(wc -l < "${RACES_FILE}")
          ENTRY_LINES=$(wc -l < "${ENTRIES_FILE}")

          RACE_COUNT=$((RACE_LINES - 1))
          ENTRY_COUNT=$((ENTRY_LINES - 1))

          echo "当日レース数: ${RACE_COUNT}"
          echo "当日出走艇数: ${ENTRY_COUNT}"

          if [ "${RACE_COUNT}" -le 0 ]; then
            echo "ERROR: 当日レースが0件です"
            exit 1
          fi

          if [ "${ENTRY_COUNT}" -le 0 ]; then
            echo "ERROR: 当日出走艇が0件です"
            exit 1
          fi

          echo "当日基本データ確認: PASS"

      - name: 高速収集済みrawを復元
        if: env.RAW_READY == 'true'
        shell: bash
        run: |
          RAW_ROOT="daily_inputs/${YEAR}/${MONTH}/${DAY}/live/raw"
          LATEST_RAW=$(find "${RAW_ROOT}" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -n 1)
          if [ -z "${LATEST_RAW}" ]; then
            echo "ERROR: 高速収集済みrawが見つかりません"
            exit 1
          fi
          cp "${LATEST_RAW}"/beforeinfo_*"${TARGET_DATE}"* data/ 2>/dev/null || true
          test -s "data/beforeinfo_races_${TARGET_DATE}.csv"
          test -s "data/beforeinfo_entries_${TARGET_DATE}.csv"
          echo "高速収集raw再利用: ${LATEST_RAW}"

      - name: 直前情報を収集
        if: env.RAW_READY != 'true'
        run: |
          python -u collectors/today_beforeinfo.py

      - name: 直前収集データを計算前に保存
        if: always()
        run: |
          RAW_DEST="daily_inputs/${YEAR}/${MONTH}/${DAY}/live/raw/${RUN_STAMP}"
          mkdir -p "${RAW_DEST}"
          find data -maxdepth 1 -type f -name "beforeinfo_*${TARGET_DATE}*" -exec cp {} "${RAW_DEST}/" \; || true
          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"
          git add "${BASE_CACHE_DIR}" "${RAW_DEST}"
          if ! git diff --cached --quiet; then
            git commit -m "Save live source data ${TARGET_DATE} ${RUN_STAMP}"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main
              git rebase origin/main
              sleep 3
            done
          fi

      - name: 直前候補レース数を確認
        run: |
          FILE="data/beforeinfo_races_${TARGET_DATE}.csv"

          if [ ! -f "${FILE}" ]; then
            echo "HAS_CANDIDATES=false" >> "$GITHUB_ENV"
            echo "直前候補: 0R"
            exit 0
          fi

          LINES=$(wc -l < "${FILE}")
          COUNT=$((LINES - 1))

          if [ "${COUNT}" -le 0 ]; then
            echo "HAS_CANDIDATES=false" >> "$GITHUB_ENV"
            echo "直前候補: 0R"
          else
            echo "HAS_CANDIDATES=true" >> "$GITHUB_ENV"
            echo "直前候補: ${COUNT}R"
          fi

      - name: 公式F/L保有情報はキャッシュがあれば利用
        if: env.HAS_CANDIDATES == 'true'
        run: |
          FL_CACHE="${BASE_CACHE_DIR}/program_entries_fl_${TARGET_DATE}.csv"
          if [ -s "${FL_CACHE}" ]; then
            cp "${FL_CACHE}" "data/program_entries_fl_${TARGET_DATE}.csv"
            echo "公式F/L保有情報: キャッシュ利用"
          else
            echo "公式F/L保有情報: 未取得。予測を止めずF/L補正なしで続行"
          fi

      - name: 直前情報・部分取得を監査（不足艇を落とさない）
        if: env.HAS_CANDIDATES == 'true'
        run: |
          python - <<'PY'
          import csv, os
          d=os.environ["TARGET_DATE"]
          path=f"data/beforeinfo_entries_{d}.csv"
          rows=list(csv.DictReader(open(path,encoding="utf-8-sig",newline="")))
          by_race={}
          for row in rows:
              rid=str(row.get("race_id","")).strip()
              boat=str(row.get("boat","")).strip()
              if not rid or boat not in {"1","2","3","4","5","6"}:
                  raise SystemExit(f"ERROR: 不正なレースID・艇番: {rid} {boat}")
              by_race.setdefault(rid,[]).append(row)
          incomplete=[]
          required=("exhibition_course","exhibition_time","exhibition_st_raw")
          for rid, rr in by_race.items():
              boats=[str(x.get("boat","")).strip() for x in rr]
              if len(boats)!=len(set(boats)):
                  raise SystemExit(f"ERROR: 公式艇データの重複 {rid}")
              for item in rr:
                  if str(item.get("is_miss","")).lower() in ("true","1","yes"):
                      continue
                  missing=[key for key in required if not str(item.get(key,"")).strip()]
                  if missing:
                      incomplete.append({"race_id":rid,"boat":item["boat"],"missing":missing})
          # A stored morning score supports neutral 0.0 movement for the
          # affected competitors. Never drop an entire race for missing ST.
          print("OFFICIAL_BEFOREINFO", {"races":len(by_race),"rows":len(rows),
                "partial_competitors":incomplete[:30]})
          PY

      - name: live prediction_inputを生成
        if: env.HAS_CANDIDATES == 'true'
        run: |
          python -u collectors/build_prediction_input.py \
            --stage live

      - name: 当日用30日90日履歴特徴量を準備
        if: env.HAS_CANDIDATES == 'true'
        run: |
          python -u collectors/build_history_features.py \
            --as-of "${TARGET_DATE}"

          test -s features/history_features_manifest.json
          grep -q "\"as_of_date\": \"${TARGET_DATE}\"" \
            features/history_features_manifest.json

          echo "当日用履歴特徴量: PASS"

      - name: 30日90日履歴を直前データへ結合
        if: env.HAS_CANDIDATES == 'true'
        run: |
          python -u collectors/enrich_prediction_input.py \
            --date "${TARGET_DATE}" \
            --stage live

      - name: 直前最終予測を生成
        if: env.HAS_CANDIDATES == 'true'
        run: |
          python -u collectors/build_live_prediction.py \
            --date "${TARGET_DATE}" \
            --now "${NOW_ISO}"

      - name: 直前計算と艇別中立補完を監査
        if: env.HAS_CANDIDATES == 'true'
        run: |
          python - <<'PY'
          import json, os, math
          d=os.environ["TARGET_DATE"]
          p=f'data/live_predictions_current_{d}.json'
          from pathlib import Path
          if not Path(p).is_file():
              print("NO_DATA: 今回の正式/部分直前計算対象なし")
              raise SystemExit(0)
          data=json.load(open(p,encoding='utf-8'))
          races=data.get('races') or data.get('predictions') or []
          for race in races:
              rid=race.get('race_id')
              boats=race.get('boats') or []
              if len(boats)<3 or len(boats)>6: raise SystemExit(f'ERROR {rid}: invalid active boats')
              neutral=[b for b in boats if b.get("score_fallback")]
              for b in boats:
                  score=float(b['score'])
                  if not math.isfinite(score): raise SystemExit(f'ERROR {rid}: non-finite score')
                  if b.get("score_fallback"):
                      if not b.get("score_fallback_reasons"):
                          raise SystemExit(f'ERROR {rid}: fallback with no reason')
                      if abs(score-float(b['morning_score_reference']))>0.00001:
                          raise SystemExit(f'ERROR {rid}: neutral must equal saved morning')
                      continue
                  missing=[k for k in ('exhibition_course','exhibition_time','exhibition_st')
                           if b.get(k) is None or b.get(k)=='']
                  if missing: raise SystemExit(f"ERROR {rid} boat{b.get('boat')}: missing {missing} without fallback")
                  comps=b.get('components') or {}
                  for k in ('racer_course','grade','motor','boat','national_top2','structural','exTime','exST'):
                      if k not in comps: raise SystemExit(f"ERROR {rid} boat{b.get('boat')}: component {k} missing")
              quality=race.get("prediction_quality") or {}
              if bool(neutral) != bool(quality.get("signal_blocked")):
                  raise SystemExit(f'ERROR {rid}: signal guard does not match fallback boats')
          print(f'live calculation audit PASS: {len(races)} races, neutral fallback allowed')
          PY

      - name: 直前予測状態を確認
        if: env.HAS_CANDIDATES == 'true'
        run: |
          FILE="data/live_predictions_validation_current_${TARGET_DATE}.json"

          test -s "${FILE}"

          cat "${FILE}"

          if grep -q '"status": "PASS"' "${FILE}"; then
            echo "HAS_LIVE_PREDICTION=true" >> "$GITHUB_ENV"
            echo "直前予測: PASS"

          elif grep -q '"status": "NO_DATA"' "${FILE}"; then
            echo "HAS_LIVE_PREDICTION=false" >> "$GITHUB_ENV"
            echo "今回は保存対象の直前予測なし"

          else
            echo "直前予測検証: FAIL"
            exit 1
          fi

      - name: 直前予測保存フォルダを作成
        if: env.HAS_LIVE_PREDICTION == 'true'
        run: |
          LIVE_DEST="predictions/${YEAR}/${MONTH}/${DAY}/live"
          SNAPSHOT_DEST="${LIVE_DEST}/snapshots/${RUN_STAMP}"
          INPUT_DEST="daily_inputs/${YEAR}/${MONTH}/${DAY}/live/snapshots/${RUN_STAMP}"

          echo "LIVE_DEST=${LIVE_DEST}" >> "$GITHUB_ENV"
          echo "SNAPSHOT_DEST=${SNAPSHOT_DEST}" >> "$GITHUB_ENV"
          echo "INPUT_DEST=${INPUT_DEST}" >> "$GITHUB_ENV"

          mkdir -p "${LIVE_DEST}"
          mkdir -p "${SNAPSHOT_DEST}"
          mkdir -p "${INPUT_DEST}"

      - name: 直前予測を保存フォルダへコピー
        if: env.HAS_LIVE_PREDICTION == 'true'
        run: |
          cp \
            "data/live_predictions_current_${TARGET_DATE}.json" \
            "${SNAPSHOT_DEST}/"

          cp \
            "data/live_predictions_current_${TARGET_DATE}.csv" \
            "${SNAPSHOT_DEST}/"

          cp \
            "data/live_predictions_validation_current_${TARGET_DATE}.json" \
            "${SNAPSHOT_DEST}/"

          cp \
            "data/live_predictions_final_${TARGET_DATE}.json" \
            "${LIVE_DEST}/"

          cp \
            "data/live_predictions_final_${TARGET_DATE}.csv" \
            "${LIVE_DEST}/"

      - name: 直前入力元も保存
        if: env.HAS_LIVE_PREDICTION == 'true'
        run: |
          cp \
            "data/beforeinfo_races_${TARGET_DATE}.csv" \
            "${INPUT_DEST}/"

          cp \
            "data/beforeinfo_entries_${TARGET_DATE}.csv" \
            "${INPUT_DEST}/"

          cp \
            "data/beforeinfo_validation_${TARGET_DATE}.json" \
            "${INPUT_DEST}/"

          cp \
            "data/prediction_input_validation_live_${TARGET_DATE}.json" \
            "${INPUT_DEST}/"

          cp \
            "data/prediction_input_enriched_validation_live_${TARGET_DATE}.json" \
            "${INPUT_DEST}/"

      - name: スマホ用最新予想一覧を生成
        run: |
          python -u collectors/build_latest_prediction_view.py \
            --date "${TARGET_DATE}" \
            --now "${NOW_ISO}"

      - name: 締切順最新予想一覧を生成
        run: |
          python -u collectors/build_deadline_prediction_view.py \
            --date "${TARGET_DATE}"

          cat predictions/latest_by_deadline.md

      - name: 補完マークの永続化を検証
        if: env.HAS_LIVE_PREDICTION == 'true'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          d=os.environ["TARGET_DATE"]
          base=Path("predictions")/d[:4]/d[4:6]/d[6:8]/"live"
          live=json.loads((base/f"live_predictions_final_{d}.json").read_text(encoding="utf-8"))
          formation=json.loads((base/f"formation_predictions_final_{d}.json").read_text(encoding="utf-8"))
          deadline=json.loads(Path("predictions/latest_by_deadline.json").read_text(encoding="utf-8"))

          def flagged(payload):
              out={}
              for race in payload.get("races") or []:
                  rid=str(race.get("race_id") or "")
                  q=race.get("prediction_quality") or {}
                  if q.get("recovery_needed") or q.get("status")=="fallback":
                      out[rid]=q
              return out

          live_flags=flagged(live)
          formation_flags=flagged(formation)
          deadline_flags=flagged(deadline)

          for rid,q in live_flags.items():
              if q.get("mark")!="⚠" or q.get("label")!="補完あり":
                  raise SystemExit(f"ERROR: {rid} 補完マーク定義不正: {q}")
              if rid not in formation_flags:
                  raise SystemExit(f"ERROR: {rid} 補完マークがformationで消失")
              if rid not in deadline_flags:
                  raise SystemExit(f"ERROR: {rid} 補完マークがlatest_by_deadlineで消失")
              if q.get("signal_blocked"):
                  for name,payload in (("live",live),("formation",formation),("deadline",deadline)):
                      record=next((r for r in payload.get("races") or [] if r.get("race_id")==rid),None)
                      if record is None:
                          raise SystemExit(f"ERROR: {rid} {name} に予測が無い")
                      if not any(b.get("score_fallback") for b in record.get("boats") or []):
                          raise SystemExit(f"ERROR: {rid} {name} の艇別▲が消失")
                      if (record.get("up_signal") or {}).get("active") or (record.get("down_signal") or {}).get("active"):
                          raise SystemExit(f"ERROR: {rid} {name} で仮データからシグナル誤発動")

          print(f"補完マーク永続化 PASS: {len(live_flags)}R")
          PY

      - name: GitHubへ保存
        run: |
          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"

          # 本日の基本データキャッシュ
          git add "${BASE_CACHE_DIR}"

          # スマホ用最新表示
          git add predictions/latest.md
          git add predictions/latest.json
          git add predictions/latest_by_deadline.md
          git add predictions/latest_by_deadline.json

          # 直前予測がある場合のみ追加
          if [ "${HAS_LIVE_PREDICTION}" = "true" ]; then
            git add "${LIVE_DEST}"
            git add "${INPUT_DEST}"
          fi

          if git diff --cached --quiet; then
            echo "PRIVATE_CHANGED=false" >> "$GITHUB_ENV"
            echo "GitHub保存対象の変更なし"
            exit 0
          fi

          git commit -m \
            "Update live predictions ${TARGET_DATE} ${RUN_STAMP}"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "ERROR: 3回試してもGitHub保存できませんでした"
              exit 1
            fi
            echo "main更新競合。最新mainを取得して再試行"
            # 収集処理が生成した未追跡/未ステージファイルも一時退避し、
            # rebase後に戻す。並行Workflowによるmain更新で停止しないようにする。
            git stash push -u -m "live-retry-${RUN_STAMP}" || true
            git fetch origin main
            git rebase origin/main
            if git stash list | grep -q "live-retry-${RUN_STAMP}"; then
              git stash pop || true
            fi
            sleep 3
          done

          echo "PRIVATE_CHANGED=true" >> "$GITHUB_ENV"
          echo "GitHub保存: PASS"

      - name: 家族共有ページ更新を開始
        if: env.PRIVATE_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run \
            family_prediction_page.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main

          echo "家族共有ページ更新開始: PASS"

      - name: 直前予測をArtifactへ短期保存
        if: env.HAS_LIVE_PREDICTION == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-live-${{ github.run_number }}
          path: |
            data/live_predictions_current_*.json
            data/live_predictions_current_*.csv
            data/live_predictions_final_*.json
            data/live_predictions_final_*.csv
          if-no-files-found: error
          retention-days: 7

      - name: 最終確認
        run: |
          echo "========================================"
          echo "毎日直前予測・本番 完了"
          echo "========================================"

          echo "対象日: ${TARGET_DATE}"

          if [ "${BASE_CACHE_HIT}" = "true" ]; then
            echo "当日基本データ: 保存済みを再利用"
            echo "today_basic.py: SKIP"
          else
            echo "当日基本データ: 本日初回取得"
            echo "today_basic.py: RUN"
          fi

          echo "直前候補あり: ${HAS_CANDIDATES}"
          echo "直前予測あり: ${HAS_LIVE_PREDICTION}"
          echo "Private更新: ${PRIVATE_CHANGED}"
          echo "通常最新一覧: PASS"
          echo "締切順一覧: PASS"

          echo "========================================"