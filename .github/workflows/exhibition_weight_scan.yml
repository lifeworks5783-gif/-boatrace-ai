name: 展示3要素配分検証
on:
  push:
    branches: [main]
    paths:
      - "collectors/evaluate_exhibition_weight_scan.py"
      - ".github/workflows/exhibition_weight_scan.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collectors/evaluate_exhibition_weight_scan.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/exhibition_weight_scan_20260930_20261003/
          git diff --cached --quiet || git commit -m "Save exhibition weight scan"
          git pull --rebase origin main
          git push origin main
