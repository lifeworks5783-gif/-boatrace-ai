name: 当日予測用基本データ収集

permissions:
  contents: write

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Tokyo"

  workflow_dispatch:

concurrency:
  group: today-basic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect_today_basic:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ファイルを読み込む
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリを準備
        run: |
          python -m pip install --upgrade pip
          pip install lhafile

      - name: dataフォルダを準備
        run: mkdir -p data

      - name: 当日の全国番組表・選手・モーター情報を収集
        run: |
          python -u collectors/today_basic.py

      - name: 朝版prediction_inputを生成
        run: |
          python -u collectors/build_prediction_input.py --stage morning

      - name: 作成ファイルを確認
        run: |
          echo "========================================"
          echo "当日朝データ"
          echo "========================================"

          find data -type f \
            \( \
              -name "program_*.csv" \
              -o -name "program_*.json" \
              -o -name "prediction_input_morning_*.json" \
              -o -name "prediction_input_validation_morning_*.json" \
            \) \
            -print | sort

      - name: 朝版データをArtifactへ保存
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-morning-${{ github.run_number }}
          path: |
            data/program_races_*.csv
            data/program_entries_*.csv
            data/program_validation_*.json
            data/program_manifest_*.json
            data/prediction_input_morning_*.json
            data/prediction_input_validation_morning_*.json
          if-no-files-found: error
          retention-days: 14

      - name: 朝版データをGitHubへ長期保存
        run: |
          VALIDATION_FILE=$(find data -maxdepth 1 \
            -type f \
            -name "program_validation_*.json" \
            | head -n 1)

          if [ -z "${VALIDATION_FILE}" ]; then
            echo "program_validationファイルがありません"
            exit 1
          fi

          TARGET_DATE=$(basename "${VALIDATION_FILE}" \
            | sed -E 's/program_validation_([0-9]{8})\.json/\1/')

          YEAR=${TARGET_DATE:0:4}
          MONTH=${TARGET_DATE:4:2}
          DAY=${TARGET_DATE:6:2}

          BASE_DEST="archive/${YEAR}/${MONTH}/${DAY}/pre_race/base"
          PRED_DEST="archive/${YEAR}/${MONTH}/${DAY}/prediction/morning"

          mkdir -p "${BASE_DEST}"
          mkdir -p "${PRED_DEST}"

          cp "data/program_races_${TARGET_DATE}.csv" "${BASE_DEST}/"
          cp "data/program_entries_${TARGET_DATE}.csv" "${BASE_DEST}/"
          cp "data/program_validation_${TARGET_DATE}.json" "${BASE_DEST}/"
          cp "data/program_manifest_${TARGET_DATE}.json" "${BASE_DEST}/"

          cp "data/prediction_input_morning_${TARGET_DATE}.json" "${PRED_DEST}/"
          cp "data/prediction_input_validation_morning_${TARGET_DATE}.json" "${PRED_DEST}/"

          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"

          git add "${BASE_DEST}" "${PRED_DEST}"

          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi

          git commit -m "Archive morning prediction data ${TARGET_DATE}"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

          echo "========================================"
          echo "朝版prediction_input保存完了"
          echo "========================================"