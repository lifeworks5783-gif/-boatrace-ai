# Publish again against saved same-day morning canonical; heavy tabs were previously built before it existed.
# Research public-page refresh after verified 2026-10-11 official 156/156 results.
name: 家族共有・予想結果分析ページ自動更新

on:
  # 外部の結果CSV更新だけでは本リポジトリにイベントが発生しないため、
  # レース開催時間帯は5分ごとに再生成して終了済みレースを照合へ反映する。
  # 外部CSVは5分境界の20〜50秒後に更新されることがあるため、
  # 同時刻ちょうどではなく1分後（01,06,11...）に取得して取りこぼしを防ぐ。
  # UTC 22:00-14:59 = JST 07:00-23:59
  workflow_run:
    workflows:
      - "毎日直前予測・本番"
      - "毎日朝予測・本番"
      - "9月30日・高速予測結果評価"
      - "9月30日・スコア配分答え合わせ"
      - "毎日予測結果評価・本番"
      # Canonical recovery explicitly dispatches this publisher after saving.
    types:
      - completed

  push:
    branches: [main]
    paths:
      - "collectors/build_family_prediction_page.py"
      - "predictions/**"
      - "collectors/build_latest_prediction_view.py"
      - "collectors/build_deadline_prediction_view.py"
      - "collectors/build_family_race_compare_page.py"
      - "collectors/build_family_results_page.py"
      - "collectors/build_family_analysis_page.py"
      - "collectors/build_family_signal_analysis_page.py"
      - "collectors/signal_high_payout_display.py"
      - "evaluations/fujin_raijin/**"
      - "evaluations/raijin_all_rank_v2_replay/**"
      - "evaluations/signal_rank_research/**"
      - "collectors/evaluate_signal_rank_research.py"
      - "collectors/evaluate_signal_payout_rank_distribution.py"
      - "collectors/evaluate_signal_24_temporal_holdout.py"
      - "collectors/evaluate_signal_buy_skip_holdout.py"
      - "evaluations/signal_buy_skip_holdout/**"
      - "evaluations/signal_24_temporal_holdout/**"
      - "evaluations/signal_payout_rank_distribution/**"
      - "evaluations/signal_ai/**"
      - "evaluations/signal_pdca_cross/**"
      - "collectors/evaluate_signal_pdca_cross.py"
      - "evaluations/2026/10/02/backfill_alignment/**"
      - "evaluations/all_candidate_single_factors/**"
      - "evaluations/pdca_incremental_20260930_20261003/**"
      - "evaluations/pdca_incremental_latest/**"
      - "archive/2026/10/03/**"
      - "evaluations/2026/10/03/**"
      - ".github/workflows/family_prediction_page.yml"

  # Hourly independent publication retry (JST 07:27–23:27). The V4
  # calculator still explicitly dispatches this publisher after each save.
  # A failed integrity audit must not leave all pages frozen for hours.
  schedule:
    - cron: '27 22-23,0-14 * * *'

  workflow_dispatch:
    inputs:
      manual_refresh:
        description: "一括更新ボタンの最終公開（公開完了マーカーも更新）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: family-prediction-publish
  # Button clicks and model updates may overlap; finish the current run.
  # GitHub keeps at most one pending run per group, so the latest request follows.
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ボートレースAI本体を読み込む
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 共通AI分析の依存パッケージ
        run: python -m pip install requests beautifulsoup4

      - name: 家族共有フォルダを準備
        run: |
          rm -rf _family_site
          mkdir -p _family_site

      - name: 最新予想ページを生成
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y%m%d)
          FORMATION_PATH="predictions/${TODAY_JST:0:4}/${TODAY_JST:4:2}/${TODAY_JST:6:2}/live/formation_predictions_final_${TODAY_JST}.json"

          # 最新情報は保存済みformationを正本に、毎回締切順JSONを再生成する。
          # これにより up_signal/down_signal を含む最新フィールドが表示側へ必ず同期される。
          # 日付切替後、当日朝予測の取得前だけ直近の保存済み正本を使う。
          # 当日朝予測が存在するのに共通正本が無い場合は、旧日へ代替せず失敗させる。
          TARGET_DATE="$TODAY_JST"
          MORNING_PATH="predictions/${TODAY_JST:0:4}/${TODAY_JST:4:2}/${TODAY_JST:6:2}/morning_predictions_${TODAY_JST}.json"
          if ! test -s "$FORMATION_PATH"; then
            if test -s "$MORNING_PATH"; then
              echo "当日朝予測はあるが共通予測正本が未生成: $FORMATION_PATH"
              exit 1
            fi
            FORMATION_PATH=$(find predictions -type f -name 'formation_predictions_final_????????.json' | sort | tail -1)
            test -s "$FORMATION_PATH" || { echo "過去日を含め共通予測正本が未生成"; exit 1; }
            TARGET_DATE=$(basename "$FORMATION_PATH")
            TARGET_DATE="${TARGET_DATE#formation_predictions_final_}"
            TARGET_DATE="${TARGET_DATE%.json}"
            echo "当日朝予測の取得前につき直近の保存済み予測を表示: $TARGET_DATE"
          fi

          python -u collectors/build_deadline_prediction_view.py \
            --date "$TARGET_DATE"

          export TARGET_DATE
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "collectors")
          from race_prediction_store import load_canonical, audit_canonical
          date = os.environ["TARGET_DATE"]
          report = audit_canonical(load_canonical(date))
          print("共通予測監査", {k:v for k,v in report.items() if k != "details"})
          if report["missing_signal_24"]:
              print("警告: 専用AI24点の未保存レースは通常AI8点に代替せず、照合画面で修復対象として表示します")
          PY

          test -s predictions/latest_by_deadline.json

          python -u collectors/build_family_prediction_page.py \
            --input predictions/latest_by_deadline.json \
            --output-dir _family_site

          test -s _family_site/index.html

          echo "予想ページ生成: PASS"

      - name: 風神雷神PDCAと購入24点成績を保存済み予測から更新
        run: |
          python -u collectors/evaluate_fujin_raijin_history.py
          python -u collectors/evaluate_signal_ai_performance.py
          python -u collectors/evaluate_signal_pdca_cross.py
          # Revised Raijin is a new research PDCA ledger. Keep old canonical
          # purchase/observed signal records and their historical ROI untouched.
          python -u collectors/evaluate_raijin_all_rank_replay.py
          test -s evaluations/raijin_all_rank_v2_replay/summary.json
          test -s evaluations/raijin_all_rank_v2_replay/details.csv
          # Public page consumes a read-only temporary research recomputation;
          # daily full-120 CSV records are persisted by saved-data/replay PDCA.
          python -u collectors/evaluate_signal_rank_research.py --no-combination-details
          test -s evaluations/signal_rank_research/v1/summary.json
          # Independent research read-model: all available historical outcomes + last seven days.
          # Never modify production scoring/predictions or live collection.
          python -u collectors/evaluate_signal_payout_rank_distribution.py
          test -s evaluations/signal_payout_rank_distribution/latest/summary.json
          test -s evaluations/signal_payout_rank_distribution/latest/rank_distribution.csv
          python -u collectors/evaluate_signal_24_temporal_holdout.py
          test -s evaluations/signal_24_temporal_holdout/latest/summary.json
          python -u collectors/evaluate_signal_buy_skip_holdout.py
          test -s evaluations/signal_buy_skip_holdout/latest/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("evaluations/raijin_all_rank_v2_replay")
          x = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          assert x["ruleset"] == "fujin_raijin_pipeline_v2_20261011", x
          assert x["result_as_input_to_signals"] is False
          assert x["new_by_signal"] and len(x["new_by_signal"]) == 16
          assert x["by_date"]
          date = x["last_completed_date"]
          assert date and (root / "daily" / date / "summary.json").is_file()
          print("RAIJIN_V2_PDCA_CONSISTENT", date, x["valid_races"], x["changed_raijin_levels"])
          PY
          test -s evaluations/signal_ai/latest/details.csv
          test -s evaluations/signal_pdca_cross/latest/summary.json
          echo "シグナルAI24点と高配当・16x4分析: PASS"

      - name: 風神雷神16組の累計高配当実績を最新シグナル横へ反映
        run: |
          # Re-render after latest saved outcome research aggregation, preventing
          # first-stage index.html from carrying an older historical percentage.
          python -u collectors/build_family_prediction_page.py \
            --input predictions/latest_by_deadline.json \
            --output-dir _family_site
          test -s _family_site/index.html
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "collectors")
          from signal_high_payout_display import load_cumulative
          rates = load_cumulative()
          assert rates is not None and len(rates["groups"]) == 16
          assert rates["n"] == sum(x["n"] for x in rates["groups"].values())
          html = Path("_family_site/index.html").read_text(encoding="utf-8")
          assert "5千円以上実績" in html
          assert "今回のレースの確定確率" in html
          print("PAIRED_SIGNAL_CUMULATIVE_BADGE_VERIFIED", rates["dates"], rates["n"])
          PY

      - name: 結果・成績ページを生成
        run: |
          python -u collectors/build_family_results_page.py \
            --evaluations-root evaluations \
            --output-dir _family_site

          test -s _family_site/results.html
          grep -q '雷神・修正版（順位制限なし）専用AI24点' _family_site/results.html

          echo "結果ページ生成: PASS"

      - name: 風神雷神専用AI分析ページを生成
        run: |
          python -u collectors/build_family_signal_analysis_page.py \
            --evaluations-root evaluations \
            --output-dir _family_site

          test -s _family_site/analysis.html
          grep -q '風神雷神 AI分析' _family_site/analysis.html
          grep -q '24点／2,400円' _family_site/analysis.html
          grep -q '旧保存版の5,000円以上・万舟捕捉' _family_site/analysis.html
          grep -q '旧保存版の風神雷神16通り' _family_site/analysis.html
          grep -q '3連単120通り' _family_site/analysis.html
          grep -q '120通り・実着順位の原因研究' _family_site/analysis.html
          grep -q 'シグナル別・全120順位の高配当分布' _family_site/analysis.html
          grep -q 'シグナル別24点配分・時系列ホールドアウト比較' _family_site/analysis.html
          grep -q '買い・見送りの時系列検証' _family_site/analysis.html
          grep -q '風神×雷神16組・5,000円以上発生実績（累計）' _family_site/analysis.html
          grep -q 'data-signal="F0R0"' _family_site/analysis.html
          grep -q 'data-signal="F3R3"' _family_site/analysis.html
          grep -q 'dist-rank-payload' _family_site/analysis.html
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('evaluations/signal_payout_rank_distribution/latest/summary.json').read_text(encoding='utf-8'))
          assert data['model_version']=='fujin_raijin_pipeline_v2_20261011'
          assert set(data['periods'])=={'last7','all'}
          for part in data['periods'].values():
              assert len(part['by_signal'])==16
              assert all(len(entry['ranks']['high5'])==120 and len(entry['ranks']['manshu'])==120 for entry in part['by_signal'].values())
              assert sum(x['races'] for x in part['by_signal'].values())==part['races']
          print('SIGNAL_120_HIGH_PAYOUT_PDCA_PAGE_VERIFIED')
          PY

          echo "風神雷神専用AI分析ページ生成: PASS"

      - name: レース照合ページを生成
        run: |
          # 当日の朝予測が取得済みなら、その時点でレース照合を当日へ切り替える。
          # まだ結果が0Rでも前日の照合結果は残さない。
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y%m%d)
          TODAY_PATH="predictions/${TODAY_JST:0:4}/${TODAY_JST:4:2}/${TODAY_JST:6:2}/morning_predictions_${TODAY_JST}.json"

          if test -s "${TODAY_PATH}"; then
            TARGET_DATE="${TODAY_JST}"
            echo "当日朝予測取得済み: ${TODAY_PATH}"
          else
            # 朝予測取得前だけ、結果・評価が完成している最新日を表示する。
            TARGET_DATE=$(find evaluations -mindepth 3 -maxdepth 3 -type d 2>/dev/null \
              | sed -n 's#^evaluations/\([0-9]\{4\}\)/\([0-9]\{2\}\)/\([0-9]\{2\}\)$#\1\2\3#p' \
              | while read d; do
                  test -s "evaluations/${d:0:4}/${d:4:2}/${d:6:2}/prediction_evaluation_${d}.json" && echo "$d"
                done \
              | sort \
              | tail -1)
          fi

          test -n "${TARGET_DATE}"

          echo "レース照合対象日: ${TARGET_DATE}"
          echo "COMPARE_DATE=${TARGET_DATE}" >> "$GITHUB_ENV"

          python -u collectors/build_family_race_compare_page.py \
            --date "${TARGET_DATE}" \
            --predictions-root predictions \
            --output-dir _family_site

          test -s _family_site/race_compare.html

          # シグナル専用AI24点と通常AIが独立したまま集計されることを確認。
          grep -q 'purchase_points = 24 if is_signal' collectors/build_family_race_compare_page.py
          grep -q 'investment = purchase_points \* 100 if is_signal' collectors/build_family_race_compare_page.py
          grep -q 'シグナル発動：専用AI24点' collectors/build_family_race_compare_page.py

          echo "レース照合ページ生成: PASS"

      - name: 4ページ共通メニューを設定
        run: |
          python -u collectors/add_family_navigation.py

          test -s _family_site/index.html
          test -s _family_site/results.html
          test -s _family_site/analysis.html
          test -s _family_site/race_compare.html

          echo "4タブメニュー: PASS"

      - name: 研究用・保存データ品質ページを生成
        run: |
          # Original HTML and Google Drive evidence are not represented by decoded CSV.
          # Build a separate read-only page; do not alter predictions or four main tabs.
          python -m raw_collector.stage_saved_quality_page \
            --date "${COMPARE_DATE}" \
            --site-dir _family_site
          if test -f _family_site/raw_diagnostics.html; then
            test -s _family_site/raw_diagnostics_summary.json
            echo "研究用保存品質ページ: PASS"
          else
            echo "当日番組の保存がないため、研究品質ページは生成しません"
          fi

      - name: 直前スコア・風神雷神判定・PDCA・レース照合表示を全終了レースで一致監査
        id: signal_audit
        continue-on-error: true
        run: |
          RESULT_FILE="archive/${COMPARE_DATE:0:4}/${COMPARE_DATE:4:2}/${COMPARE_DATE:6:2}/results_${COMPARE_DATE}_all.csv"
          if ! test -s "$RESULT_FILE"; then
            echo "公式結果がまだ0R、照合シグナル監査は実結果取得後に実行"
            exit 0
          fi
          python -u collectors/audit_signal_consistency.py \
            --date "$COMPARE_DATE" \
            --html _family_site/race_compare.html \
            --output _family_site/internal_signal_integrity_report.json
          echo "6艇再計算＝共通正本＝風神雷神PDCA＝公開表示: PASS"

      - name: 公開用リポジトリを読み込む
        uses: actions/checkout@v4
        with:
          repository: lifeworks5783-gif/boatrace-family-view
          ref: main
          token: ${{ secrets.FAMILY_VIEW_TOKEN }}
          path: family_public
          fetch-depth: 0

      - name: 公開ページをコピー
        env:
          MANUAL_REFRESH: ${{ inputs.manual_refresh }}
        run: |
          # Latest index is owned by the fast publisher; never overwrite it
          # with an older canonical snapshot produced by slow PDCA processing.
          # Keep legacy initialization/manual full refresh behavior.
          if test -s family_public/index.html && [ "$MANUAL_REFRESH" != "true" ]; then
            echo "最新予測index.htmlは軽量優先公開が担当。通常の重い公開は他の3画面だけ更新。"
          else
            cp _family_site/index.html family_public/index.html
          fi

          cp \
            _family_site/results.html \
            family_public/results.html

          cp \
            _family_site/analysis.html \
            family_public/analysis.html

          cp \
            _family_site/race_compare.html \
            family_public/race_compare.html

          if test -s _family_site/raw_diagnostics.html; then
            cp _family_site/raw_diagnostics.html family_public/raw_diagnostics.html
            cp _family_site/raw_diagnostics_summary.json family_public/raw_diagnostics_summary.json
          else
            rm -f family_public/raw_diagnostics.html family_public/raw_diagnostics_summary.json
          fi

          touch family_public/.nojekyll

          echo "公開ページ準備: PASS"

      - name: 手動ボタン一括更新の公開完了マーカーを付与
        if: inputs.manual_refresh
        run: |
          # Created ONLY after finished-result comparison, canonical save,
          # signal PDCA and all four public pages have been generated.
          # The public site serves this file only after GitHub Pages deploys.
          python - <<'PY'
          import csv,json,os
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          now=datetime.now(timezone(timedelta(hours=9)))
          day=now.strftime("%Y%m%d")
          source=Path("archive")/day[:4]/day[4:6]/day[6:8]/f"results_{day}_all.csv"
          count=0
          if source.is_file():
              with source.open(encoding="utf-8-sig", newline="") as stream:
                  count=sum(1 for x in csv.DictReader(stream) if x.get("race_id"))
          report=Path("evaluations")/day[:4]/day[4:6]/day[6:8]/"data_quality"/f"completeness_{day}.json"
          audit={}
          if report.is_file():
              audit=json.loads(report.read_text(encoding="utf-8"))
          marker={
              "schema_version": 1,
              "date": day,
              "published_at_jst": now.isoformat(),
              "manual_refresh_completed": True,
              "research_mode": "manual_research",
              "automatic_collection_enabled": False,
              "result_races_saved": count,
              "research_audit_status": (audit.get("research_audit") or {}).get("research_status"),
              "publisher_run_id": os.environ["GITHUB_RUN_ID"],
              "source_commit": os.environ["GITHUB_SHA"],
          }
          Path("family_public/manual_refresh_status.json").write_text(
              json.dumps(marker,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Manual site refresh status:", marker)
          PY

      - name: 公開リポジトリへ保存
        run: |
          cd family_public

          git config \
            user.name \
            "boatrace-family-view-bot"

          git config \
            user.email \
            "boatrace-family-view-bot@users.noreply.github.com"

          git add \
            index.html \
            results.html \
            analysis.html \
            race_compare.html \
            .nojekyll
          # Optional new/removed research diagnostic files; no error on first publish.
          for file in raw_diagnostics.html raw_diagnostics_summary.json; do
            if test -e "$file" || git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              git add -A -- "$file"
            fi
          done
          if test -f manual_refresh_status.json; then
            git add manual_refresh_status.json
          fi

          if git diff --cached --quiet; then
            echo "公開内容に変更なし"
            exit 0
          fi

          git commit \
            -m "Update prediction results analysis and race comparison pages"

          # Fast index writes may advance the public repo while this slow
          # analysis completes. Rebase only the other-page changes safely.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "家族共有ページ更新: PASS"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo "::error::Public file conflict; do not overwrite fast index"
              exit 1
            }
            sleep "$((attempt * 2))"
          done
          echo "::error::Slow analysis publication push failed after retries"
          exit 1

      # Publishing known data is independent from perfect full-day coverage.
      # Report a failed consistency audit AS A FAILURE after public content is
      # saved. Never silently mark incomplete signals as verified.
      - name: 公開後に監査異常を明示（公開データは巻き戻さない）
        if: steps.signal_audit.outcome == 'failure'
        run: |
          echo "::error::Signal parity audit failed. Published latest visible data with pending/unverified race labels; investigate _family_site/internal_signal_integrity_report.json in the audit step."
          exit 1

      - name: 最終確認
        run: |
          echo ""
          echo "========================================"
          echo "家族共有サイト更新 完了"
          echo "========================================"
          echo ""
          echo "最新予想:"
          echo "https://lifeworks5783-gif.github.io/boatrace-family-view/"
          echo ""
          echo "結果・成績:"
          echo "https://lifeworks5783-gif.github.io/boatrace-family-view/results.html"
          echo ""
          echo "AI分析:"
          echo "https://lifeworks5783-gif.github.io/boatrace-family-view/analysis.html"
          echo ""
          echo "レース照合:"
          echo "https://lifeworks5783-gif.github.io/boatrace-family-view/race_compare.html"
# refresh family PDCA analysis
# dynamic PDCA publish trigger

# refresh-after-recovered-evaluation: 20261007-final
# publish verified 20261010 morning 156-race canonical after forecast commit c5836729
