name: 家族共有・予想結果分析ページ自動更新

on:
  workflow_run:
    workflows:
      - "毎日直前予測・本番"
      - "毎日朝予測・本番"
      - "9月30日・高速予測結果評価"
      - "9月30日・スコア配分答え合わせ"
      - "毎日予測結果評価・本番"
    types:
      - completed

  push:
    branches: [main]
    paths:
      - "collectors/build_family_race_compare_page.py"
      - "collectors/build_family_results_page.py"
      - ".github/workflows/family_prediction_page.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-prediction-publish
  cancel-in-progress: true

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ボートレースAI本体を読み込む
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 家族共有フォルダを準備
        run: |
          rm -rf _family_site
          mkdir -p _family_site

      - name: 最新予想ページを生成
        run: |
          test -s predictions/latest_by_deadline.json

          python -u collectors/build_family_prediction_page.py \
            --input predictions/latest_by_deadline.json \
            --output-dir _family_site

          test -s _family_site/index.html

          echo "予想ページ生成: PASS"

      - name: 結果・成績ページを生成
        run: |
          python -u collectors/build_family_results_page.py \
            --evaluations-root evaluations \
            --output-dir _family_site

          test -s _family_site/results.html

          echo "結果ページ生成: PASS"

      - name: AI分析ページを生成
        run: |
          python -u collectors/build_family_analysis_page.py \
            --evaluations-root evaluations \
            --output-dir _family_site

          test -s _family_site/analysis.html

          echo "AI分析ページ生成: PASS"

      - name: レース照合ページを生成
        run: |
          TARGET_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)

          python -u collectors/build_family_race_compare_page.py \
            --date "${TARGET_DATE}" \
            --predictions-root predictions \
            --output-dir _family_site

          test -s _family_site/race_compare.html

          echo "レース照合ページ生成: PASS"

      - name: 4ページ共通メニューを設定
        run: |
          python -u collectors/add_family_navigation.py

          test -s _family_site/index.html
          test -s _family_site/results.html
          test -s _family_site/analysis.html
          test -s _family_site/race_compare.html

          echo "4タブメニュー: PASS"

      - name: 公開用リポジトリを読み込む
        uses: actions/checkout@v4
        with:
          repository: lifeworks5783-gif/boatrace-family-view
          ref: main
          token: ${{ secrets.FAMILY_VIEW_TOKEN }}
          path: family_public
          fetch-depth: 0

      - name: 公開ページをコピー
        run: |
          cp \
            _family_site/index.html \
            family_public/index.html

          cp \
            _family_site/results.html \
            family_public/results.html

          cp \
            _family_site/analysis.html \
            family_public/analysis.html

          cp \
            _family_site/race_compare.html \
            family_public/race_compare.html

          touch family_public/.nojekyll

          echo "公開ページ準備: PASS"

      - name: 公開リポジトリへ保存
        run: |
          cd family_public

          git config \
            user.name \
            "boatrace-family-view-bot"

          git config \
            user.email \
            "boatrace-family-view-bot@users.noreply.github.com"

          git add \
            index.html \
            results.html \
            analysis.html \
            race_compare.html \
            .nojekyll

          if git diff --cached --quiet; then
            echo "公開内容に変更なし"
            exit 0
          fi

          git commit \
            -m "Update prediction results analysis and race comparison pages"

          git push origin HEAD:main

          echo "家族共有ページ更新: PASS"

      - name: 最終確認
        run: |
          echo ""
          echo "========================================"
          echo "家族共有サイト更新 完了"
          echo "========================================"
          echo ""
          echo "最新予想:"
          echo "https://lifeworks5783-gif.github.io/boatrace-family-view/"
          echo ""
          echo "結果・成績:"
          echo "https://lifeworks5783-gif.github.io/boatrace-family-view/results.html"
          echo ""
          echo "AI分析:"
          echo "https://lifeworks5783-gif.github.io/boatrace-family-view/analysis.html"
          echo ""
          echo "レース照合:"
          echo "https://lifeworks5783-gif.github.io/boatrace-family-view/race_compare.html"