name: 家族共有・予想結果分析ページ自動更新

on:
  # 外部の結果CSV更新だけでは本リポジトリにイベントが発生しないため、
  # レース開催時間帯は5分ごとに再生成して終了済みレースを照合へ反映する。
  # 外部CSVは5分境界の20〜50秒後に更新されることがあるため、
  # 同時刻ちょうどではなく1分後（01,06,11...）に取得して取りこぼしを防ぐ。
  # UTC 22:00-14:59 = JST 07:00-23:59
  workflow_run:
    workflows:
      - "毎日直前予測・本番"
      - "毎日朝予測・本番"
      - "9月30日・高速予測結果評価"
      - "9月30日・スコア配分答え合わせ"
      - "毎日予測結果評価・本番"
    types:
      - completed

  push:
    branches: [main]
    paths:
      - "collectors/build_family_prediction_page.py"
      - "predictions/**"
      - "collectors/build_latest_prediction_view.py"
      - "collectors/build_deadline_prediction_view.py"
      - "collectors/build_family_race_compare_page.py"
      - "collectors/build_family_results_page.py"
      - "collectors/build_family_analysis_page.py"
      - "collectors/build_family_signal_analysis_page.py"
      - "evaluations/fujin_raijin/**"
      - "evaluations/2026/10/02/backfill_alignment/**"
      - "evaluations/all_candidate_single_factors/**"
      - "evaluations/pdca_incremental_20260930_20261003/**"
      - "evaluations/pdca_incremental_latest/**"
      - "archive/2026/10/03/**"
      - "evaluations/2026/10/03/**"
      - ".github/workflows/family_prediction_page.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-prediction-publish
  cancel-in-progress: true

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ボートレースAI本体を読み込む
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 家族共有フォルダを準備
        run: |
          rm -rf _family_site
          mkdir -p _family_site

      - name: 最新予想ページを生成
        run: |
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y%m%d)
          FORMATION_PATH="predictions/${TODAY_JST:0:4}/${TODAY_JST:4:2}/${TODAY_JST:6:2}/live/formation_predictions_final_${TODAY_JST}.json"

          # 最新情報は保存済みformationを正本に、毎回締切順JSONを再生成する。
          # これにより up_signal/down_signal を含む最新フィールドが表示側へ必ず同期される。
          if test -s "$FORMATION_PATH"; then
            python -u collectors/build_deadline_prediction_view.py \
              --date "$TODAY_JST"
          fi

          test -s predictions/latest_by_deadline.json

          python -u collectors/build_family_prediction_page.py \
            --input predictions/latest_by_deadline.json \
            --output-dir _family_site

          test -s _family_site/index.html

          echo "予想ページ生成: PASS"

      - name: 結果・成績ページを生成
        run: |
          python -u collectors/build_family_results_page.py \
            --evaluations-root evaluations \
            --output-dir _family_site

          test -s _family_site/results.html

          echo "結果ページ生成: PASS"

      - name: 風神雷神専用AI分析ページを生成
        run: |
          python -u collectors/build_family_signal_analysis_page.py \
            --evaluations-root evaluations \
            --output-dir _family_site

          test -s _family_site/analysis.html
          grep -q '風神雷神 AI分析' _family_site/analysis.html
          grep -q '買わない（0点）' _family_site/analysis.html
          grep -q '3連単120通り' _family_site/analysis.html

          echo "風神雷神専用AI分析ページ生成: PASS"

      - name: レース照合ページを生成
        run: |
          # 当日の朝予測が取得済みなら、その時点でレース照合を当日へ切り替える。
          # まだ結果が0Rでも前日の照合結果は残さない。
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y%m%d)
          TODAY_PATH="predictions/${TODAY_JST:0:4}/${TODAY_JST:4:2}/${TODAY_JST:6:2}/morning_predictions_${TODAY_JST}.json"

          if test -s "${TODAY_PATH}"; then
            TARGET_DATE="${TODAY_JST}"
            echo "当日朝予測取得済み: ${TODAY_PATH}"
          else
            # 朝予測取得前だけ、結果・評価が完成している最新日を表示する。
            TARGET_DATE=$(find evaluations -mindepth 3 -maxdepth 3 -type d 2>/dev/null \
              | sed -n 's#^evaluations/\([0-9]\{4\}\)/\([0-9]\{2\}\)/\([0-9]\{2\}\)$#\1\2\3#p' \
              | while read d; do
                  test -s "evaluations/${d:0:4}/${d:4:2}/${d:6:2}/prediction_evaluation_${d}.json" && echo "$d"
                done \
              | sort \
              | tail -1)
          fi

          test -n "${TARGET_DATE}"

          echo "レース照合対象日: ${TARGET_DATE}"

          python -u collectors/build_family_race_compare_page.py \
            --date "${TARGET_DATE}" \
            --predictions-root predictions \
            --output-dir _family_site

          test -s _family_site/race_compare.html

          # AI予測は風神雷神シグナル非依存。表示側の購入点数・投資額参照が生きていることを確認。
          grep -q 'purchase_points = safe_int(ai.get("points")) or 8' collectors/build_family_race_compare_page.py
          grep -q 'investment = safe_int(ai.get("investment_100yen"))' collectors/build_family_race_compare_page.py

          echo "レース照合ページ生成: PASS"

      - name: 4ページ共通メニューを設定
        run: |
          python -u collectors/add_family_navigation.py

          test -s _family_site/index.html
          test -s _family_site/results.html
          test -s _family_site/analysis.html
          test -s _family_site/race_compare.html

          echo "4タブメニュー: PASS"

      - name: 公開用リポジトリを読み込む
        uses: actions/checkout@v4
        with:
          repository: lifeworks5783-gif/boatrace-family-view
          ref: main
          token: ${{ secrets.FAMILY_VIEW_TOKEN }}
          path: family_public
          fetch-depth: 0

      - name: 公開ページをコピー
        run: |
          cp \
            _family_site/index.html \
            family_public/index.html

          cp \
            _family_site/results.html \
            family_public/results.html

          cp \
            _family_site/analysis.html \
            family_public/analysis.html

          cp \
            _family_site/race_compare.html \
            family_public/race_compare.html

          touch family_public/.nojekyll

          echo "公開ページ準備: PASS"

      - name: 公開リポジトリへ保存
        run: |
          cd family_public

          git config \
            user.name \
            "boatrace-family-view-bot"

          git config \
            user.email \
            "boatrace-family-view-bot@users.noreply.github.com"

          git add \
            index.html \
            results.html \
            analysis.html \
            race_compare.html \
            .nojekyll

          if git diff --cached --quiet; then
            echo "公開内容に変更なし"
            exit 0
          fi

          git commit \
            -m "Update prediction results analysis and race comparison pages"

          git push origin HEAD:main

          echo "家族共有ページ更新: PASS"

      - name: 最終確認
        run: |
          echo ""
          echo "========================================"
          echo "家族共有サイト更新 完了"
          echo "========================================"
          echo ""
          echo "最新予想:"
          echo "https://lifeworks5783-gif.github.io/boatrace-family-view/"
          echo ""
          echo "結果・成績:"
          echo "https://lifeworks5783-gif.github.io/boatrace-family-view/results.html"
          echo ""
          echo "AI分析:"
          echo "https://lifeworks5783-gif.github.io/boatrace-family-view/analysis.html"
          echo ""
          echo "レース照合:"
          echo "https://lifeworks5783-gif.github.io/boatrace-family-view/race_compare.html"
# refresh family PDCA analysis
# dynamic PDCA publish trigger

# refresh-after-recovered-evaluation: 20261007-final
