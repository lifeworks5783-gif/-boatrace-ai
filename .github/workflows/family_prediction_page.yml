name: 家族共有・予想ページ自動更新

on:
  workflow_run:
    workflows:
      - "9月30日・直前予測自動テスト"
      - "毎日朝予測・本番"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-prediction-publish
  cancel-in-progress: true

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ボートレースAI本体を読み込む
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 最新予想データを確認
        run: |
          test -s predictions/latest_by_deadline.json

          echo "最新予想データ: PASS"

      - name: 家族共有ページを生成
        run: |
          rm -rf _family_site

          python -u collectors/build_family_prediction_page.py \
            --input predictions/latest_by_deadline.json \
            --output-dir _family_site

          test -s _family_site/index.html

          echo "家族共有ページ生成: PASS"

      - name: 公開用リポジトリを読み込む
        uses: actions/checkout@v4
        with:
          repository: lifeworks5783-gif/boatrace-family-view
          ref: main
          token: ${{ secrets.FAMILY_VIEW_TOKEN }}
          path: family_public
          fetch-depth: 0

      - name: 公開ページだけをコピー
        run: |
          cp \
            _family_site/index.html \
            family_public/index.html

          touch family_public/.nojekyll

          echo "公開用index.html準備: PASS"

      - name: 家族共有ページを公開リポジトリへ保存
        run: |
          cd family_public

          git config user.name "boatrace-family-view-bot"
          git config user.email "boatrace-family-view-bot@users.noreply.github.com"

          git add index.html
          git add .nojekyll

          if git diff --cached --quiet; then
            echo "公開ページに変更はありません"
            exit 0
          fi

          git commit -m "Update family prediction page"

          git push origin HEAD:main

          echo "家族共有ページ更新: PASS"

      - name: 最終確認
        run: |
          echo "========================================"
          echo "家族共有ページ更新 完了"
          echo "========================================"
          echo ""
          echo "公開先:"
          echo "https://lifeworks5783-gif.github.io/boatrace-family-view/"