name: Four day three-base validation
on:
  push:
    branches: [main]
    paths:
      - "collectors/evaluate_base3_combined_4day.py"
      - ".github/workflows/base3_combined_4day.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collectors/evaluate_base3_combined_4day.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/base3_combined_20260930_20261003/
          git diff --cached --quiet || git commit -m "Save four-day three-base validation"
          git pull --rebase origin main
          git push origin main

# rerun all-racer base validation
