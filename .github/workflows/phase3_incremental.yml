name: Phase3 incremental evaluation
on:
  push:
    branches: [main]
    paths:
      - collectors/evaluate_phase3_incremental.py
      - .github/workflows/phase3_incremental.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python collectors/evaluate_phase3_incremental.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/phase3_incremental/
          git diff --cached --quiet || git commit -m "Add phase 3 incremental evaluation results"
          git push
