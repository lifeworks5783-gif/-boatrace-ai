name: Morning Prediction Production
permissions:
  contents: write
'on':
  push:
    branches: [main]
    paths:
      - config/run_morning_now.txt
  schedule:
    - cron: '0 18 * * *'
    - cron: '30 19 * * *'
  workflow_dispatch:
concurrency:
  group: boatrace-main-writer
  cancel-in-progress: false
jobs:
  morning_prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lhafile
      - run: |
          TARGET_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          NOW_ISO=$(TZ=Asia/Tokyo date +%Y-%m-%dT%H:%M:%S%:z)
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          echo "NOW_ISO=$NOW_ISO" >> "$GITHUB_ENV"
          echo "YEAR=${TARGET_DATE:0:4}" >> "$GITHUB_ENV"
          echo "MONTH=${TARGET_DATE:4:2}" >> "$GITHUB_ENV"
          echo "DAY=${TARGET_DATE:6:2}" >> "$GITHUB_ENV"
      - name: 朝の当日基本データを収集
        run: |
          mkdir -p data features
          python -u collectors/today_basic.py

      - name: 収集データを計算前に保存
        run: |
          INPUT_DEST="daily_inputs/${YEAR}/${MONTH}/${DAY}/base"
          mkdir -p "$INPUT_DEST"
          find data -maxdepth 1 -type f -name "*${TARGET_DATE}*" -exec cp {} "$INPUT_DEST/" \;
          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"
          git add "$INPUT_DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Save morning source data ${TARGET_DATE}"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main
              git rebase origin/main
              sleep 3
            done
          fi

      - name: 履歴特徴量と朝予測入力を生成
        run: |
          python -u collectors/build_history_features.py --as-of "$TARGET_DATE"
          test -s features/history_features_manifest.json
          python -u collectors/build_prediction_input.py --stage morning
          python -u collectors/enrich_prediction_input.py --date "$TARGET_DATE" --stage morning
          grep -q '"status": "PASS"' "data/prediction_input_enriched_validation_morning_${TARGET_DATE}.json"

      - name: 朝スコアを計算
        run: |
          python -u collectors/build_morning_prediction.py --date "$TARGET_DATE"
          grep -q '"status": "PASS"' "data/morning_predictions_validation_${TARGET_DATE}.json"
      - run: |
          PREDICTION_DEST="predictions/${YEAR}/${MONTH}/${DAY}"
          INPUT_DEST="daily_inputs/${YEAR}/${MONTH}/${DAY}"
          mkdir -p "$PREDICTION_DEST" "$INPUT_DEST"
          cp "data/morning_predictions_${TARGET_DATE}.json" "$PREDICTION_DEST/"
          cp "data/morning_predictions_${TARGET_DATE}.csv" "$PREDICTION_DEST/"
          cp "data/morning_predictions_validation_${TARGET_DATE}.json" "$PREDICTION_DEST/"
          find data -maxdepth 1 -type f -name "*${TARGET_DATE}*" -exec cp {} "$INPUT_DEST/" \;
          python -u collectors/build_latest_prediction_view.py --date "$TARGET_DATE" --now "$NOW_ISO"
          python -u collectors/build_deadline_prediction_view.py --date "$TARGET_DATE"
          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"
          git add features "$PREDICTION_DEST" "$INPUT_DEST" predictions/latest.md predictions/latest.json predictions/latest_by_deadline.md predictions/latest_by_deadline.json
          if ! git diff --cached --quiet; then
            git commit -m "Morning prediction ${TARGET_DATE}"
            git pull --rebase origin main
            git push origin main
          fi
