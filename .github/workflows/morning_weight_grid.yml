name: 朝配分最適化検証
on:
  push:
    branches: [main]
    paths: ["collectors/evaluate_morning_weight_grid.py",".github/workflows/morning_weight_grid.yml"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python collectors/evaluate_morning_weight_grid.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/morning_weight_grid_20260930_20261003/
          git diff --cached --quiet || git commit -m "Save morning weight grid"
          git pull --rebase origin main
          git push origin main
