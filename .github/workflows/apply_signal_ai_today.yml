name: Rebuild Fujin Raijin signal AI today

on:
  push:
    branches: [main]
    paths:
      - "config/run_signal_ai_today.txt"
  workflow_dispatch:
    inputs:
      target_date:
        description: "対象日 YYYYMMDD（空欄なら当日）"
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prediction dependencies
        run: pip install requests beautifulsoup4
      - name: Rebuild today's saved predictions with Fujin Raijin signal AI
        run: |
          D="${{ inputs.target_date }}"
          [ -n "$D" ] || D=$(TZ=Asia/Tokyo date +%Y%m%d)
          export TARGET_DATE="$D"
          python -u collectors/build_latest_prediction_view.py --date "$D"
          test -s predictions/latest.json
          test -s predictions/latest_by_deadline.json
          test -s "predictions/${D:0:4}/${D:4:2}/${D:6:2}/live/formation_predictions_final_${D}.json"
          python - <<'PY'
          import json,pathlib,os
          d=os.environ["TARGET_DATE"]
          p=pathlib.Path("predictions")/d[:4]/d[4:6]/d[6:8]/"live"/f"formation_predictions_final_{d}.json"
          x=json.loads(p.read_text())
          races=x.get("races",[])
          bad_points=[]
          bad_normal_signal_effect=[]
          bad_signal_ai=[]
          signal_ai=[]
          raijin=[]
          fujin=[]
          for r in races:
              ai=r.get("ai_score_prediction") or {}
              if ai.get("points") != 8:
                  bad_points.append(r.get("race_id"))
              if ai.get("signal_mode") or (ai.get("signal_boats") or {}):
                  bad_normal_signal_effect.append(r.get("race_id"))
              up=r.get("up_signal") or {}
              down=r.get("down_signal") or {}
              active=int(up.get("level") or 0)>0 or int(down.get("level") or 0)>0
              sai=r.get("signal_ai_prediction")
              if active:
                  if not isinstance(sai,dict) or int(sai.get("points") or 0)!=24 or len(sai.get("combinations") or [])!=24:
                      bad_signal_ai.append(r.get("race_id"))
                  else:
                      signal_ai.append({"race_id":r.get("race_id"),"signal_key":sai.get("signal_key"),"points":sai.get("points")})
              elif sai:
                  bad_signal_ai.append(r.get("race_id"))
              if int(up.get("level") or 0)>0:
                  raijin.append({"race_id":r.get("race_id"),"level":up.get("level"),"max_rise":up.get("max_rise")})
              if int(down.get("level") or 0)>0:
                  fujin.append({"race_id":r.get("race_id"),"level":down.get("level")})
          print("races",len(races),"raijin",len(raijin),"fujin",len(fujin),"signal_ai",len(signal_ai),"bad_points",bad_points,"bad_normal_signal_effect",bad_normal_signal_effect,"bad_signal_ai",bad_signal_ai)
          assert not bad_points
          assert not bad_normal_signal_effect
          assert not bad_signal_ai
          out=pathlib.Path("evaluations")/d[:4]/d[4:6]/d[6:8]/"fujin_raijin_rebuild_summary.json"
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({
              "date":d,
              "system_name":"風神雷神シグナル",
              "normal_prediction_effect":False,
              "signal_ai_effect":True,
              "signal_ai_model":"signal_ai_revalue_v1_20261008",
              "race_count":len(races),
              "signal_ai":signal_ai,
              "raijin":raijin,
              "fujin":fujin,
          },ensure_ascii=False,indent=2))
          PY
      - name: Commit rebuilt outputs
        run: |
          git config user.name "boatrace-ai-bot"
          git config user.email "boatrace-ai-bot@users.noreply.github.com"
          git add predictions/ evaluations/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild Fujin Raijin signal AI outputs"
          git pull --rebase origin main
          git push origin HEAD:main


      - name: Publish family pages after rebuilt outputs are pushed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "風神雷神シグナルAI再生成・保存完了後に家族共有ページを更新します。"
          gh workflow run family_prediction_page.yml --ref main
          echo "家族共有ページ更新を起動: PASS"
