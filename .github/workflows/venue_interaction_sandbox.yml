name: Venue interaction sandbox
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/run_venue_interaction_sandbox.txt"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile collectors/evaluate_venue_interaction_sandbox.py
      - run: python collectors/evaluate_venue_interaction_sandbox.py
      - name: Commit sandbox output
        run: |
          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"
          git add evaluations/venue_interaction_sandbox
          git diff --cached --quiet && exit 0
          git commit -m "Update venue interaction sandbox"
          git pull --rebase origin main
          git push origin main
