name: 環境コース交互作用検証
on:
  push:
    branches: [main]
    paths: ["collectors/evaluate_environment_course_interactions.py",".github/workflows/environment_course_interactions.yml"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python collectors/evaluate_environment_course_interactions.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/environment_course_interactions_20260930_20261003/
          git diff --cached --quiet || git commit -m "Save environment course interactions"
          git pull --rebase origin main
          git push origin main
