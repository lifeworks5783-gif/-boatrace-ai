name: 新朝モデル直前検証
on:
  push:
    branches: [main]
    paths: ["collectors/evaluate_new_morning_live_scan.py",".github/workflows/new_morning_live_scan.yml"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python collectors/evaluate_new_morning_live_scan.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/new_morning_live_scan_20260930_20261003/
          git diff --cached --quiet || git commit -m "Save optimized morning live scan"
          git pull --rebase origin main
          git push origin main
