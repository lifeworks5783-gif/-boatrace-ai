name: 朝ロジック過去ホールドアウト検証
on:
  push:
    branches: [main]
    paths: ["collectors/evaluate_morning_holdout.py",".github/workflows/morning_holdout.yml"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python collectors/evaluate_morning_holdout.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/morning_holdout_20260928_20260929/
          git diff --cached --quiet || git commit -m "Save morning holdout validation"
          git pull --rebase origin main
          git push origin main
