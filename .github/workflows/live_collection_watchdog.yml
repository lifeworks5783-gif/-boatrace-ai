name: Live Collection Watchdog

permissions:
  contents: write

on:
  schedule:
    # JST 08:07-22:57: 10分間隔。高速収集とは4分ずらして監視する。
    - cron: "7,17,27,37,47,57 23,0-13 * * *"
  workflow_dispatch:

concurrency:
  group: boatrace-live-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check latest live raw snapshot
        id: check
        shell: bash
        run: |
          TARGET_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          YEAR=${TARGET_DATE:0:4}
          MONTH=${TARGET_DATE:4:2}
          DAY=${TARGET_DATE:6:2}
          ROOT="daily_inputs/${YEAR}/${MONTH}/${DAY}/live/raw"
          NOW=$(date +%s)
          LATEST=0
          if [ -d "$ROOT" ]; then
            while IFS= read -r d; do
              b=$(basename "$d")
              ts=$(TZ=Asia/Tokyo date -d "${b:0:8} ${b:9:2}:${b:11:2}:${b:13:2}" +%s 2>/dev/null || echo 0)
              if [ "$ts" -gt "$LATEST" ]; then LATEST="$ts"; fi
            done < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | sort)
          fi
          AGE=999999
          if [ "$LATEST" -gt 0 ]; then AGE=$((NOW-LATEST)); fi
          echo "snapshot_age_seconds=$AGE"
          if [ "$AGE" -gt 1200 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover stalled fast live collection
        if: steps.check.outputs.stale == 'true'
        shell: bash
        run: |
          git config user.name "boatrace-watchdog"
          git config user.email "boatrace-watchdog@users.noreply.github.com"
          STAMP=$(TZ=Asia/Tokyo date +%Y%m%d_%H%M%S)
          printf 'requested=%s\nreason=watchdog_stale_fast_live_over_20min\n' "$STAMP" > config/run_fast_live_now.txt
          git add config/run_fast_live_now.txt
          git commit -m "Watchdog recover stalled fast live collection ${STAMP}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
