name: F holder x ST delta
on:
  push:
    paths:
      - 'collectors/evaluate_fholder_stdelta_interaction.py'
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python collectors/evaluate_fholder_stdelta_interaction.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/fholder_stdelta_interaction/
          git diff --cached --quiet || git commit -m "Save F holder x ST delta interaction"
          git pull --rebase origin main
          git push origin main
