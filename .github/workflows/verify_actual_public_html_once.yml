name: One-shot actual public HTML GET diagnostics
on:
  push:
    branches: [main]
    paths:
      - "config/run_public_once_now.txt"
permissions:
  contents: read
jobs:
  one-shot-public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read exact homepage and race comparison from public HTTPS
        run: |
          python - <<'PY'
          import urllib.request as U, hashlib, json, re, sys, time
          base="https://lifeworks5783-gif.github.io/boatrace-family-view"
          repo="lifeworks5783-gif/boatrace-family-view"
          errors=[]
          for page in ("index.html","race_compare.html","analysis.html"):
              try:
                  with U.urlopen(f"https://raw.githubusercontent.com/{repo}/main/{page}",timeout=15) as r:
                      raw=r.read()
                  for attempt in range(1,17):
                      with U.urlopen(U.Request(
                          f"{base}/{page}?verified_red_pr14={int(time.time())}_{attempt}",
                          headers={"User-Agent":"FamilySiteValidator/1.0","Cache-Control":"no-cache"}
                      ),timeout=15) as r:
                          content=r.read()
                          status=r.status
                      text=content.decode("utf-8","replace")
                      html_matches=hashlib.sha256(content).digest()==hashlib.sha256(raw).digest()
                      red_ready=(page!="race_compare.html" or
                          bool(re.search(r'\.signal-rank-hit\s*\{[^}]*color:#dc2626;',text)))
                      if html_matches and red_ready:
                          break
                      print("WAIT_PAGES_DEPLOYMENT",page,attempt,
                            "sha_match",html_matches,"red_ready",red_ready,flush=True)
                      time.sleep(8)
                  cards=re.findall(r'<article class="race-card">(.*?)</article>',text,re.S)
                  toki=next((x for x in cards if re.search(r"常滑\s*8R",x)),None)
                  report={"page":page,"http":status,"bytes":len(content),
                          "matches_main":hashlib.sha256(content).digest()==hashlib.sha256(raw).digest(),
                          "has_ai_title":"ボートレースAI" in text,
                          "has_neutral_pdca":"直前中立補完・公式復旧の監査" in text,
                          "tokoname_card_present":bool(toki),
                          "tokoname_signal":bool(toki and ("雷神" in toki or "⚡" in toki)),
                          "tokoname_24":bool(toki and ("24点" in toki or "専用AI" in toki)),
                          "tokoname_card_preview":re.sub("<[^>]*>"," ",toki or "")[:700]}
                  if page=="race_compare.html":
                      headlines=re.findall(r'<summary class="ai-result-summary">(.*?)</summary>',text,re.S)
                      ranked=[(int(n),int(size)) for h in headlines
                              for n,size in re.findall(r'実着(\d+)位／(120|60)通り',h)]
                      mean=re.search(r'当日実着の平均AI順位：\s*<b>([0-9.]+)位</b>\s*（(\d+)R',text)
                      got_mean=sum(n for n,_ in ranked)/len(ranked) if ranked else None
                      shown_mean=float(mean.group(1)) if mean else None
                      declared_count=int(mean.group(2)) if mean else None
                      hit_titles=sum('signal-rank-hit' in h for h in headlines)
                      miss_titles=sum('signal-rank-miss' in h for h in headlines)
                      raw_css=re.search(r'\.signal-rank-hit\s*\{([^}]+)\}',text,re.S)
                      css=raw_css.group(1) if raw_css else ""
                      red_plain=bool(
                          'color:#dc2626;' in css
                          and 'background:' not in css
                          and 'border:' not in css
                          and 'padding:' not in css
                          and not any(re.search(r'✓\s*的中',h) for h in headlines if 'signal-rank-hit' in h)
                      )
                      report.update({
                        "signal_hit_plain_red_without_background":red_plain,
                        "signal_hit_style":css.strip().replace("\\n"," ")[:180],
                        "ranked_signal_races_in_collapsed_summaries":len(ranked),
                        "winning_signal_headers_colored":hit_titles,
                        "losing_signal_headers_with_rank":miss_titles,
                        "daily_mean_rank_shown":shown_mean,
                        "daily_rank_sample_count":declared_count,
                        "daily_mean_recomputed_from_html":round(got_mean,1) if got_mean is not None else None,
                        "rank_sample":ranked[:10],
                      })
                      rank_ok=bool(
                          ranked and hit_titles>0 and miss_titles>0 and mean
                          and declared_count==len(ranked)
                          and round(got_mean,1)==shown_mean
                          and red_plain
                      )
                      report["signal_rank_public_acceptance"]=rank_ok
                      if not rank_ok:errors.append("signal_rank_public_html")
                  print("REAL_PUBLIC_HTML_DIAGNOSTIC",json.dumps(report,ensure_ascii=False),flush=True)
                  if status!=200 or len(content)<1000 or not report["matches_main"]:errors.append(page)
              except Exception as ex:
                  print("PUBLIC_HTTP_ERROR",page,repr(ex),flush=True)
                  errors.append(page)
          if errors:
              print("REAL_PUBLIC_HTML_MISMATCH",errors,flush=True)
              sys.exit(1)
          print("REAL_PUBLIC_HTML_BYTE_MATCH_ALL_3",flush=True)
          PY
