name: Four day incremental PDCA
on:
  push:
    branches: [main]
    paths:
      - config/run_ai_analysis_now.txt
      - collectors/evaluate_pdca_incremental_4day.py
      - .github/workflows/pdca_incremental_4day.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python collectors/evaluate_pdca_incremental_4day.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/pdca_incremental_20260930_20261003/
          git diff --cached --quiet || git commit -m "Save four-day incremental PDCA results"
          git pull --rebase origin main
          git push origin main

      - name: 結果・成績とAI分析ページを更新
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run family_prediction_page.yml --ref main
          echo "家族共有の結果・成績 / AI分析ページ更新を開始しました。"
