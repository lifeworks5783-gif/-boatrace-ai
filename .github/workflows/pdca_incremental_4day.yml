name: Four day incremental PDCA
on:
  push:
    branches: [main]
    paths:
      - config/run_ai_analysis_now.txt
      - collectors/evaluate_pdca_incremental_4day.py
      - .github/workflows/pdca_incremental_4day.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install result collector dependencies
        run: pip install lhafile requests beautifulsoup4

      - name: Set today JST
        run: |
          TARGET_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          echo "YEAR=${TARGET_DATE:0:4}" >> "$GITHUB_ENV"
          echo "MONTH=${TARGET_DATE:4:2}" >> "$GITHUB_ENV"
          echo "DAY=${TARGET_DATE:6:2}" >> "$GITHUB_ENV"

      - name: Restore today's base data
        run: |
          BASE="daily_inputs/$YEAR/$MONTH/$DAY/base"
          test -s "$BASE/program_races_$TARGET_DATE.csv"
          test -s "$BASE/program_entries_$TARGET_DATE.csv"
          mkdir -p data
          cp "$BASE/program_races_$TARGET_DATE.csv" data/
          cp "$BASE/program_entries_$TARGET_DATE.csv" data/

      - name: Collect missing beforeinfo only
        run: python -u collectors/today_beforeinfo.py --date "$TARGET_DATE" --mode missing

      - name: Verify complete beforeinfo before PDCA
        run: |
          python - <<'PY'
          import csv, os, sys
          d=os.environ["TARGET_DATE"]
          with open(f"data/program_races_{d}.csv",encoding="utf-8-sig",newline="") as f: expected={r["race_id"] for r in csv.DictReader(f)}
          with open(f"data/beforeinfo_races_{d}.csv",encoding="utf-8-sig",newline="") as f: got={r["race_id"] for r in csv.DictReader(f)}
          with open(f"data/beforeinfo_entries_{d}.csv",encoding="utf-8-sig",newline="") as f: rows=list(csv.DictReader(f))
          boats={}
          for r in rows: boats.setdefault(r["race_id"],set()).add(r.get("boat",""))
          missing=expected-got
          incomplete={r for r in expected if len(boats.get(r,set()))<6}
          print(f"beforeinfo: {len(expected-missing)}/{len(expected)} races, {sum(len(boats.get(r,set())) for r in expected)}/{len(expected)*6} boats")
          if missing or incomplete: sys.exit("Beforeinfo incomplete: PDCA stopped")
          PY

      - name: Save complete beforeinfo snapshot
        run: |
          OUT="daily_inputs/$YEAR/$MONTH/$DAY/live/backfill"
          mkdir -p "$OUT"
          find data -maxdepth 1 -type f -name "beforeinfo_*$TARGET_DATE*" -exec cp {} "$OUT/" \;

      - name: Collect today's official results
        run: python -u collectors/daily_results_fast.py --date "$TARGET_DATE"

      - name: Validate today's results
        run: python -u collectors/validate_daily.py --date "$TARGET_DATE"

      - name: Archive today's results
        run: |
          mkdir -p "archive/$YEAR/$MONTH/$DAY"
          cp "data/venues_${TARGET_DATE}.csv" "archive/$YEAR/$MONTH/$DAY/"
          cp "data/results_${TARGET_DATE}_all.csv" "archive/$YEAR/$MONTH/$DAY/"
          cp "data/boat_results_${TARGET_DATE}_all.csv" "archive/$YEAR/$MONTH/$DAY/"
          cp "data/validation_${TARGET_DATE}.json" "archive/$YEAR/$MONTH/$DAY/"
          cp "data/manifest_${TARGET_DATE}.json" "archive/$YEAR/$MONTH/$DAY/"
          if [ -f "data/excluded_races_${TARGET_DATE}.csv" ]; then cp "data/excluded_races_${TARGET_DATE}.csv" "archive/$YEAR/$MONTH/$DAY/"; fi

      - name: Evaluate today's predictions and betting
        run: python -u collectors/evaluate_predictions.py --date "$TARGET_DATE"

      - name: Run expanding PDCA
        run: python collectors/evaluate_pdca_incremental_4day.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "daily_inputs/$YEAR/$MONTH/$DAY/live/backfill" "archive/$YEAR/$MONTH/$DAY" "evaluations/$YEAR/$MONTH/$DAY" evaluations/pdca_incremental_latest/
          git diff --cached --quiet || git commit -m "Save daily results and expanding PDCA $TARGET_DATE"
          git pull --rebase origin main
          git push origin main

      - name: 結果・成績とAI分析ページを更新
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run family_prediction_page.yml --ref main
          echo "家族共有の結果・成績 / AI分析ページ更新を開始しました。"
