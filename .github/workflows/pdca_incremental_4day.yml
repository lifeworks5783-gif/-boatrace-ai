name: Four day incremental PDCA
on:
  push:
    branches: [main]
    paths:
      - config/run_ai_analysis_now.txt
      - collectors/evaluate_pdca_incremental_4day.py
      - .github/workflows/pdca_incremental_4day.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install result collector dependencies
        run: pip install lhafile requests beautifulsoup4

      - name: Select latest analyzable date
        run: |
          TARGET_DATE=$(find daily_inputs -type f -name 'program_races_????????.csv' -path '*/base/*' -print \
            | sed -n 's/.*program_races_\([0-9]\{8\}\)\.csv/\1/p' \
            | sort -r \
            | while read d; do
                y="${d:0:4}"; m="${d:4:2}"; day="${d:6:2}"
                base="daily_inputs/$y/$m/$day/base"
                if [ -s "$base/program_entries_$d.csv" ]; then
                  echo "$d"
                  break
                fi
              done)
          test -n "$TARGET_DATE" || { echo "No analyzable base date found"; exit 1; }
          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          echo "YEAR=${TARGET_DATE:0:4}" >> "$GITHUB_ENV"
          echo "MONTH=${TARGET_DATE:4:2}" >> "$GITHUB_ENV"
          echo "DAY=${TARGET_DATE:6:2}" >> "$GITHUB_ENV"
          echo "Selected latest analyzable date: $TARGET_DATE"

      - name: Restore selected base data
        run: |
          BASE="daily_inputs/$YEAR/$MONTH/$DAY/base"
          test -s "$BASE/program_races_$TARGET_DATE.csv"
          test -s "$BASE/program_entries_$TARGET_DATE.csv"
          mkdir -p data
          cp "$BASE/program_races_$TARGET_DATE.csv" data/
          cp "$BASE/program_entries_$TARGET_DATE.csv" data/

      - name: Restore saved beforeinfo for analysis
        run: |
          BACKFILL="daily_inputs/$YEAR/$MONTH/$DAY/live/backfill"
          if [ -s "$BACKFILL/beforeinfo_races_$TARGET_DATE.csv" ]; then
            cp "$BACKFILL/beforeinfo_races_$TARGET_DATE.csv" data/
          fi
          if [ -s "$BACKFILL/beforeinfo_entries_$TARGET_DATE.csv" ]; then
            cp "$BACKFILL/beforeinfo_entries_$TARGET_DATE.csv" data/
          fi
          echo "AI分析では保存済み直前情報のみ使用します。欠損直前情報の復元は別処理です。"

      - name: Collect selected date official results
        run: python -u collectors/daily_results_fast.py --date "$TARGET_DATE"

      - name: Validate selected date results
        run: python -u collectors/validate_daily.py --date "$TARGET_DATE"

      - name: Archive selected date results
        run: |
          mkdir -p "archive/$YEAR/$MONTH/$DAY"
          cp "data/venues_${TARGET_DATE}.csv" "archive/$YEAR/$MONTH/$DAY/"
          cp "data/results_${TARGET_DATE}_all.csv" "archive/$YEAR/$MONTH/$DAY/"
          cp "data/boat_results_${TARGET_DATE}_all.csv" "archive/$YEAR/$MONTH/$DAY/"
          cp "data/validation_${TARGET_DATE}.json" "archive/$YEAR/$MONTH/$DAY/"
          cp "data/manifest_${TARGET_DATE}.json" "archive/$YEAR/$MONTH/$DAY/"
          if [ -f "data/excluded_races_${TARGET_DATE}.csv" ]; then cp "data/excluded_races_${TARGET_DATE}.csv" "archive/$YEAR/$MONTH/$DAY/"; fi

      - name: Evaluate selected date predictions and betting
        run: python -u collectors/evaluate_predictions.py --date "$TARGET_DATE"

      - name: Evaluate AI score prediction
        run: |
          # AIスコア予測は結果を見ずに保存済みの予測データから復元し、
          # その後に公式結果と答え合わせする。毎日のAI分析で必ず実行する。
          python -u collectors/backfill_ai_score_prediction.py --date "$TARGET_DATE"
          python -u collectors/evaluate_ai_score_prediction.py --date "$TARGET_DATE"
          test -s "evaluations/$YEAR/$MONTH/$DAY/ai_score_simulation_${TARGET_DATE}.json"
          test -s "evaluations/$YEAR/$MONTH/$DAY/ai_score_simulation_${TARGET_DATE}.csv"

      - name: Run expanding PDCA
        run: python -u collectors/evaluate_pdca_incremental_4day.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/ archive/ predictions/
          git diff --cached --quiet || git commit -m "Save complete evaluation outputs $TARGET_DATE"
          git restore .
          git clean -fd
          git pull --rebase origin main
          git push origin main

      - name: 結果・成績とAI分析ページを更新
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run family_prediction_page.yml --ref main
          echo "家族共有の結果・成績 / AI分析ページ更新を開始しました。"
