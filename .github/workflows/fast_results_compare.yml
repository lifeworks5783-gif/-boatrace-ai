name: 軽量版前日結果・比較テスト

on:
  workflow_dispatch:

jobs:
  compare_fast_results:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ファイルを読み込む
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリを準備
        run: |
          python -m pip install --upgrade pip
          pip install lhafile

      - name: dataフォルダを準備
        run: mkdir -p data

      - name: 9月28日を軽量版で収集
        run: |
          echo "========================================"
          echo "軽量版Kファイル収集テスト"
          echo "対象日: 20260928"
          echo "========================================"

          python -u collectors/daily_results_fast.py \
            --date 20260928

      - name: 既存validatorで品質検証
        run: |
          echo "========================================"
          echo "既存の日次validatorで検証"
          echo "========================================"

          python -u collectors/validate_daily.py \
            --date 20260928

      - name: 保存済み9月28日データと比較
        run: |
          python - <<'PY'
          import csv
          import re
          import sys
          from pathlib import Path

          TARGET = "20260928"

          NEW_DIR = Path("data")
          OLD_DIR = Path("archive/2026/09/28")


          def read_csv(path):
              if not path.exists():
                  raise RuntimeError(
                      f"ファイルがありません: {path}"
                  )

              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as f:
                  return list(csv.DictReader(f))


          def txt(value):
              if value is None:
                  return ""

              return str(value).strip()


          def compact(value):
              return re.sub(
                  r"[\s　]+",
                  "",
                  txt(value),
              )


          def integer(value):
              value = (
                  txt(value)
                  .replace(",", "")
              )

              if not value:
                  return None

              try:
                  return int(float(value))

              except ValueError:
                  return value


          def race_id(value):
              value = txt(value)

              parts = re.split(
                  r"[-_]",
                  value,
              )

              if len(parts) == 3:
                  return (
                      f"{parts[0]}-"
                      f"{parts[1].zfill(2)}-"
                      f"{parts[2].zfill(2)}"
                  )

              return value


          def normalize_st(value):
              value = (
                  compact(value)
                  .upper()
              )

              if not value:
                  return ("", None)

              if value.startswith("F"):
                  raw = (
                      value[1:]
                      .lstrip(".")
                  )

                  try:
                      return (
                          "F",
                          -float(
                              "0." + raw
                          ),
                      )

                  except ValueError:
                      return (
                          "F",
                          value,
                      )

              if value.startswith("L"):
                  raw = (
                      value[1:]
                      .lstrip(".")
                  )

                  if not raw:
                      return (
                          "L",
                          None,
                      )

                  try:
                      return (
                          "L",
                          float(
                              "0." + raw
                          ),
                      )

                  except ValueError:
                      return (
                          "L",
                          value,
                      )

              if value.startswith("."):
                  value = (
                      "0" + value
                  )

              try:
                  return (
                      "",
                      round(
                          float(value),
                          4,
                      ),
                  )

              except ValueError:
                  return (
                      "RAW",
                      value,
                  )


          def normalize_time(value):
              value = compact(value)

              if not value:
                  return None

              if not any(
                  char.isdigit()
                  for char in value
              ):
                  return None

              match = re.match(
                  r"^(\d+)\.(\d{1,2})\.(\d)$",
                  value,
              )

              if match:
                  return (
                      int(match.group(1)) * 60
                      + int(match.group(2))
                      + int(match.group(3)) / 10
                  )

              return value


          def normalize_finish(value):
              value = (
                  compact(value)
                  .upper()
              )

              if value.isdigit():
                  number = int(value)

                  if 1 <= number <= 6:
                      return (
                          "NORMAL",
                          number,
                      )

              if value.startswith("F"):
                  return (
                      "F",
                      value,
                  )

              if value.startswith("L"):
                  return (
                      "L",
                      value,
                  )

              if not value:
                  return (
                      "EMPTY",
                      "",
                  )

              return (
                  "SPECIAL",
                  value,
              )


          def venue_tuple(row):
              return (
                  txt(row.get("date")),
                  txt(
                      row.get(
                          "venue_code"
                      )
                  ).zfill(2),
                  txt(
                      row.get(
                          "venue_name"
                      )
                  ),
              )


          def result_tuple(row):
              return (
                  txt(row.get("date")),

                  txt(
                      row.get(
                          "venue_code"
                      )
                  ).zfill(2),

                  txt(
                      row.get(
                          "venue_name"
                      )
                  ),

                  integer(
                      row.get(
                          "race"
                      )
                  ),

                  race_id(
                      row.get(
                          "race_id"
                      )
                  ),

                  txt(
                      row.get(
                          "trifecta"
                      )
                  ),

                  integer(
                      row.get(
                          "trifecta_pay"
                      )
                  ),

                  txt(
                      row.get(
                          "exacta"
                      )
                  ),

                  integer(
                      row.get(
                          "exacta_pay"
                      )
                  ),
              )


          def boat_key(row):
              return (
                  race_id(
                      row.get(
                          "race_id"
                      )
                  ),

                  integer(
                      row.get(
                          "boat"
                      )
                  ),
              )


          def boat_core(row):
              return (
                  txt(
                      row.get(
                          "date"
                      )
                  ),

                  txt(
                      row.get(
                          "venue_code"
                      )
                  ).zfill(2),

                  txt(
                      row.get(
                          "venue_name"
                      )
                  ),

                  integer(
                      row.get(
                          "race"
                      )
                  ),

                  race_id(
                      row.get(
                          "race_id"
                      )
                  ),

                  integer(
                      row.get(
                          "boat"
                      )
                  ),

                  integer(
                      row.get(
                          "course"
                      )
                  ),

                  txt(
                      row.get(
                          "registration_no"
                      )
                  ),

                  compact(
                      row.get(
                          "racer_name"
                      )
                  ),

                  normalize_st(
                      row.get(
                          "st"
                      )
                  ),

                  normalize_time(
                      row.get(
                          "race_time"
                      )
                  ),
              )


          print(
              "========================================"
          )

          print(
              "旧方式 vs 軽量版 比較"
          )

          print(
              "========================================"
          )


          failed = False


          old_venues = read_csv(
              OLD_DIR
              / f"venues_{TARGET}.csv"
          )

          new_venues = read_csv(
              NEW_DIR
              / f"venues_{TARGET}.csv"
          )


          if sorted(
              venue_tuple(row)
              for row in old_venues
          ) == sorted(
              venue_tuple(row)
              for row in new_venues
          ):

              print(
                  "開催場: PASS"
              )

          else:
              print(
                  "開催場: FAIL"
              )

              failed = True


          old_results = read_csv(
              OLD_DIR
              / f"results_{TARGET}_all.csv"
          )

          new_results = read_csv(
              NEW_DIR
              / f"results_{TARGET}_all.csv"
          )


          if sorted(
              result_tuple(row)
              for row in old_results
          ) == sorted(
              result_tuple(row)
              for row in new_results
          ):

              print(
                  "レース結果: PASS"
              )

          else:
              print(
                  "レース結果: FAIL"
              )

              failed = True


          old_boats = {
              boat_key(row): row
              for row in read_csv(
                  OLD_DIR
                  / (
                      f"boat_results_"
                      f"{TARGET}_all.csv"
                  )
              )
          }

          new_boats = {
              boat_key(row): row
              for row in read_csv(
                  NEW_DIR
                  / (
                      f"boat_results_"
                      f"{TARGET}_all.csv"
                  )
              )
          }


          print(
              f"旧方式艇数: {len(old_boats)}"
          )

          print(
              f"軽量版艇数: {len(new_boats)}"
          )


          if set(
              old_boats
          ) != set(
              new_boats
          ):
              print(
                  "艇キー: FAIL"
              )

              failed = True

          else:
              print(
                  "艇キー: PASS"
              )


          core_errors = []

          finish_errors = []

          special_notation = []


          for key in sorted(
              set(old_boats)
              & set(new_boats)
          ):

              old = old_boats[
                  key
              ]

              new = new_boats[
                  key
              ]


              if boat_core(
                  old
              ) != boat_core(
                  new
              ):
                  core_errors.append(
                      key
                  )

                  continue


              old_finish = (
                  normalize_finish(
                      old.get(
                          "finish"
                      )
                  )
              )

              new_finish = (
                  normalize_finish(
                      new.get(
                          "finish"
                      )
                  )
              )


              old_type = (
                  old_finish[0]
              )

              new_type = (
                  new_finish[0]
              )


              if (
                  old_type == "NORMAL"
                  or new_type == "NORMAL"
              ):
                  if (
                      old_finish
                      != new_finish
                  ):
                      finish_errors.append(
                          (
                              key,
                              old.get(
                                  "finish"
                              ),
                              new.get(
                                  "finish"
                              ),
                          )
                      )

                  continue


              if (
                  old_type == "F"
                  or new_type == "F"
              ):
                  if not (
                      old_type == "F"
                      and new_type == "F"
                  ):
                      finish_errors.append(
                          (
                              key,
                              old.get(
                                  "finish"
                              ),
                              new.get(
                                  "finish"
                              ),
                          )
                      )

                  continue


              if (
                  old_type == "L"
                  or new_type == "L"
              ):
                  if not (
                      old_type == "L"
                      and new_type == "L"
                  ):
                      finish_errors.append(
                          (
                              key,
                              old.get(
                                  "finish"
                              ),
                              new.get(
                                  "finish"
                              ),
                          )
                      )

                  continue


              if (
                  old_type
                  in {
                      "SPECIAL",
                      "EMPTY",
                  }
                  and
                  new_type
                  in {
                      "SPECIAL",
                      "EMPTY",
                  }
              ):
                  if (
                      old_finish
                      != new_finish
                  ):
                      special_notation.append(
                          (
                              key,
                              old.get(
                                  "finish"
                              ),
                              new.get(
                                  "finish"
                              ),
                          )
                      )

                  continue


              if (
                  old_finish
                  != new_finish
              ):
                  finish_errors.append(
                      (
                          key,
                          old.get(
                              "finish"
                          ),
                          new.get(
                              "finish"
                          ),
                      )
                  )


          print(
              f"艇別主要項目不一致: "
              f"{len(core_errors)}件"
          )

          print(
              f"着順実質不一致: "
              f"{len(finish_errors)}件"
          )

          print(
              "特殊着順の表記差: "
              f"{len(special_notation)}件"
          )


          if special_notation:
              print("")
              print(
                  "特殊着順の表記差・先頭10件:"
              )

              for item in (
                  special_notation[:10]
              ):
                  print(
                      item
                  )


          if core_errors:
              print("")
              print(
                  "主要項目不一致・先頭10件:"
              )

              for item in (
                  core_errors[:10]
              ):
                  print(
                      item
                  )


          if finish_errors:
              print("")
              print(
                  "着順実質不一致・先頭10件:"
              )

              for item in (
                  finish_errors[:10]
              ):
                  print(
                      item
                  )


          if (
              core_errors
              or finish_errors
          ):
              failed = True


          print("")
          print(
              "========================================"
          )


          if failed:
              print(
                  "比較結果: FAIL"
              )

              print(
                  "旧方式はまだ停止しません"
              )

              sys.exit(1)


          print(
              "比較結果: PASS"
          )

          print(
              "通常データは旧方式と一致"
          )

          print(
              "特殊着順はKファイル公式コードを保持"
          )

          print(
              "旧方式置換可能"
          )

          print(
              "========================================"
          )
          PY

      - name: 完了
        run: |
          echo "========================================"
          echo "軽量版結果収集 比較テスト PASS"
          echo "旧方式置換の準備完了"
          echo "========================================"