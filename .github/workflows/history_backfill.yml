name: 過去100日履歴・拡張データ再構築

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: history-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild_history:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: ファイルを読み込む
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリを準備
        run: |
          python -m pip install --upgrade pip
          pip install lhafile

      - name: data・historyフォルダを準備
        run: |
          mkdir -p data
          mkdir -p history

      - name: 過去100日を拡張データ付きで再取得
        run: |
          echo "========================================"
          echo "過去100日 履歴データ再構築"
          echo "対象: 20260621 ～ 20260928"
          echo "motor_no / boat_no / exhibition_time"
          echo "========================================"

          python -u collectors/backfill_history.py \
            --start 20260621 \
            --end 20260928 \
            --force \
            --sleep 0.7

      - name: バックフィル結果を確認
        run: |
          REPORT="history/backfill_report_20260621_20260928.json"

          if [ ! -f "${REPORT}" ]; then
            echo "バックフィルレポートがありません"
            exit 1
          fi

          python - "${REPORT}" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(
              path,
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          print(
              "========================================"
          )
          print(
              "バックフィル結果"
          )
          print(
              "========================================"
          )

          print(
              "開始日:",
              data.get("start_date")
          )

          print(
              "終了日:",
              data.get("end_date")
          )

          print(
              "新規取得成功:",
              data.get(
                  "success_days",
                  0
              ),
              "日"
          )

          print(
              "既存スキップ:",
              data.get(
                  "skipped_days",
                  0
              ),
              "日"
          )

          print(
              "取得失敗:",
              data.get(
                  "failed_days",
                  0
              ),
              "日"
          )

          failed = data.get(
              "failed",
              []
          )

          if failed:
              print("")
              print(
                  "取得失敗日:"
              )

              for item in failed:
                  print(
                      item.get("date"),
                      item.get("error")
                  )

              raise SystemExit(1)

          print("")
          print(
              "バックフィル取得 PASS"
          )
          PY

      - name: 100日分の拡張3項目を検証
        run: |
          python - <<'PY'
          import csv
          import re
          from pathlib import Path

          START = 20260621
          END = 20260928

          REQUIRED = {
              "motor_no",
              "boat_no",
              "exhibition_time",
          }

          files = []

          for path in Path(
              "archive"
          ).glob(
              "*/*/*/boat_results_*_all.csv"
          ):
              match = re.search(
                  r"boat_results_(\d{8})_all\.csv$",
                  path.name,
              )

              if not match:
                  continue

              date = int(
                  match.group(1)
              )

              if START <= date <= END:
                  files.append(
                      path
                  )

          files.sort()

          total_rows = 0

          motor_rows = 0
          boat_rows = 0
          exhibition_rows = 0

          bad_motor = 0
          bad_boat = 0
          bad_exhibition = 0

          missing_columns = []

          for path in files:

              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as f:

                  reader = csv.DictReader(
                      f
                  )

                  fields = set(
                      reader.fieldnames
                      or []
                  )

                  if not REQUIRED.issubset(
                      fields
                  ):
                      missing_columns.append(
                          str(path)
                      )

                      continue

                  for row in reader:

                      total_rows += 1

                      motor = str(
                          row.get(
                              "motor_no",
                              ""
                          )
                      ).strip()

                      boat = str(
                          row.get(
                              "boat_no",
                              ""
                          )
                      ).strip()

                      exhibition = str(
                          row.get(
                              "exhibition_time",
                              ""
                          )
                      ).strip()

                      if motor:

                          motor_rows += 1

                          try:
                              value = int(
                                  float(motor)
                              )

                              if not (
                                  1 <= value <= 99
                              ):
                                  bad_motor += 1

                          except ValueError:
                              bad_motor += 1

                      if boat:

                          boat_rows += 1

                          try:
                              value = int(
                                  float(boat)
                              )

                              if not (
                                  1 <= value <= 99
                              ):
                                  bad_boat += 1

                          except ValueError:
                              bad_boat += 1

                      if exhibition:

                          exhibition_rows += 1

                          try:
                              value = float(
                                  exhibition
                              )

                              if not (
                                  5.0
                                  <= value
                                  <= 10.0
                              ):
                                  bad_exhibition += 1

                          except ValueError:
                              bad_exhibition += 1

          print(
              "========================================"
          )
          print(
              "100日履歴 拡張項目検証"
          )
          print(
              "========================================"
          )

          print(
              "対象履歴ファイル:",
              len(files)
          )

          print(
              "総艇データ:",
              total_rows
          )

          print(
              "motor_no取得:",
              motor_rows
          )

          print(
              "boat_no取得:",
              boat_rows
          )

          print(
              "exhibition_time取得:",
              exhibition_rows
          )

          print(
              "motor_no値異常:",
              bad_motor
          )

          print(
              "boat_no値異常:",
              bad_boat
          )

          print(
              "exhibition_time値異常:",
              bad_exhibition
          )

          print(
              "拡張項目不足ファイル:",
              len(
                  missing_columns
              )
          )

          if len(files) != 100:
              raise SystemExit(
                  "100日分の履歴ファイルが揃っていません"
              )

          if missing_columns:

              print("")
              print(
                  "不足ファイル:"
              )

              for item in (
                  missing_columns[:10]
              ):
                  print(item)

              raise SystemExit(1)

          if total_rows == 0:
              raise SystemExit(
                  "艇データが0件です"
              )

          if motor_rows == 0:
              raise SystemExit(
                  "motor_noが全件欠損です"
              )

          if boat_rows == 0:
              raise SystemExit(
                  "boat_noが全件欠損です"
              )

          if exhibition_rows == 0:
              raise SystemExit(
                  "exhibition_timeが全件欠損です"
              )

          if bad_motor:
              raise SystemExit(
                  "motor_noに異常値があります"
              )

          if bad_boat:
              raise SystemExit(
                  "boat_noに異常値があります"
              )

          if bad_exhibition:
              raise SystemExit(
                  "exhibition_timeに異常値があります"
              )

          print("")
          print(
              "100日履歴 拡張項目検証 PASS"
          )
          PY

      - name: 拡張100日履歴を先にGitHubへ保存
        run: |
          echo "========================================"
          echo "検証済み100日履歴を保存"
          echo "========================================"

          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"

          git add archive history

          if git diff --cached --quiet; then
            echo "履歴データに変更はありません"

          else
            git commit -m "Rebuild enriched BOAT RACE history"

            git pull --rebase origin "${GITHUB_REF_NAME}"

            git push origin HEAD:"${GITHUB_REF_NAME}"

            echo ""
            echo "100日拡張履歴 保存完了"
          fi

      - name: 既存validation・manifestを更新
        run: |
          echo "========================================"
          echo "既存validation・manifest更新"
          echo "========================================"

          UPDATED=0

          while IFS= read -r VALIDATION_FILE
          do
            DIR=$(dirname "${VALIDATION_FILE}")

            TARGET_DATE=$(basename "${VALIDATION_FILE}" \
              | sed -E 's/validation_([0-9]{8})\.json/\1/')

            if [ "${TARGET_DATE}" -lt "20260621" ] || \
               [ "${TARGET_DATE}" -gt "20260928" ]; then
              continue
            fi

            VENUES="${DIR}/venues_${TARGET_DATE}.csv"
            RESULTS="${DIR}/results_${TARGET_DATE}_all.csv"
            BOATS="${DIR}/boat_results_${TARGET_DATE}_all.csv"

            if [ ! -f "${VENUES}" ] || \
               [ ! -f "${RESULTS}" ] || \
               [ ! -f "${BOATS}" ]; then
              continue
            fi

            rm -f data/*.csv data/*.json

            cp "${VENUES}" data/
            cp "${RESULTS}" data/
            cp "${BOATS}" data/

            echo ""
            echo "再検証: ${TARGET_DATE}"

            python -u collectors/validate_daily.py \
              --date "${TARGET_DATE}"

            cp \
              "data/validation_${TARGET_DATE}.json" \
              "${DIR}/"

            cp \
              "data/manifest_${TARGET_DATE}.json" \
              "${DIR}/"

            UPDATED=$((UPDATED + 1))

          done < <(
            find archive \
              -type f \
              -name "validation_*.json" \
              | sort
          )

          echo ""
          echo "再生成した検証日数: ${UPDATED}"

      - name: 更新した検証情報をGitHubへ保存
        run: |
          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"

          git add archive

          if git diff --cached --quiet; then
            echo "validation・manifestに変更なし"
            exit 0
          fi

          git commit -m "Refresh validation after history rebuild"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin HEAD:"${GITHUB_REF_NAME}"

          echo ""
          echo "validation・manifest保存完了"

      - name: 最終確認
        run: |
          echo "========================================"
          echo "100日拡張履歴 再構築完了"
          echo "========================================"

          echo "選手30日・90日集計: 準備OK"
          echo "モーター30日・90日集計: 準備OK"