name: 過去100日履歴・拡張データ再構築

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: history-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild_history:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: ファイルを読み込む
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリを準備
        run: |
          python -m pip install --upgrade pip
          pip install lhafile

      - name: data・historyフォルダを準備
        run: |
          mkdir -p data
          mkdir -p history

      - name: 過去100日を拡張データ付きで再取得
        run: |
          echo "========================================"
          echo "過去100日 履歴データ再構築"
          echo "motor_no / boat_no / exhibition_time"
          echo "========================================"

          python -u collectors/backfill_history.py \
            --days 100 \
            --force \
            --sleep 0.7

      - name: バックフィル結果を確認
        id: report
        run: |
          REPORT=$(find history \
            -maxdepth 1 \
            -type f \
            -name "backfill_report_*.json" \
            | sort \
            | tail -n 1)

          if [ -z "${REPORT}" ]; then
            echo "バックフィルレポートがありません"
            exit 1
          fi

          python - "${REPORT}" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          with open(
              sys.argv[1],
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          start = data["start_date"]
          end = data["end_date"]
          failed = data.get(
              "failed_days",
              0,
          )

          print(
              f"start_date={start}"
          )

          print(
              f"end_date={end}"
          )

          print("")
          print(
              "========================================"
          )
          print(
              "バックフィル結果"
          )
          print(
              "========================================"
          )
          print(
              "開始日:",
              start,
          )
          print(
              "終了日:",
              end,
          )
          print(
              "新規取得成功:",
              data.get(
                  "success_days",
                  0,
              ),
              "日",
          )
          print(
              "既存スキップ:",
              data.get(
                  "skipped_days",
                  0,
              ),
              "日",
          )
          print(
              "取得失敗:",
              failed,
              "日",
          )

          if failed:
              for item in data.get(
                  "failed",
                  [],
              ):
                  print(
                      item.get("date"),
                      item.get("error"),
                  )

              raise SystemExit(1)

          print(
              "バックフィル取得 PASS"
          )
          PY

      - name: 今回の100日だけ拡張3項目を検証
        env:
          START_DATE: ${{ steps.report.outputs.start_date }}
          END_DATE: ${{ steps.report.outputs.end_date }}
        run: |
          python - <<'PY'
          import csv
          import os
          import re
          from pathlib import Path

          start = int(
              os.environ["START_DATE"]
          )

          end = int(
              os.environ["END_DATE"]
          )

          required = {
              "motor_no",
              "boat_no",
              "exhibition_time",
          }

          files = []

          for path in Path(
              "archive"
          ).glob(
              "*/*/*/boat_results_*_all.csv"
          ):
              m = re.search(
                  r"boat_results_(\d{8})_all\.csv$",
                  path.name,
              )

              if not m:
                  continue

              date = int(
                  m.group(1)
              )

              if (
                  start
                  <= date
                  <= end
              ):
                  files.append(
                      path
                  )

          files.sort()

          missing_columns = []

          total_rows = 0
          motor_rows = 0
          boat_rows = 0
          exhibition_rows = 0

          bad_motor = 0
          bad_boat = 0
          bad_exhibition = 0

          for path in files:
              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as f:

                  reader = csv.DictReader(
                      f
                  )

                  fields = set(
                      reader.fieldnames
                      or []
                  )

                  if not required.issubset(
                      fields
                  ):
                      missing_columns.append(
                          str(path)
                      )

                      continue

                  for row in reader:
                      total_rows += 1

                      motor = str(
                          row.get(
                              "motor_no",
                              "",
                          )
                      ).strip()

                      boat = str(
                          row.get(
                              "boat_no",
                              "",
                          )
                      ).strip()

                      exhibition = str(
                          row.get(
                              "exhibition_time",
                              "",
                          )
                      ).strip()

                      if motor:
                          motor_rows += 1

                          try:
                              value = int(
                                  float(motor)
                              )

                              if not (
                                  1 <= value <= 99
                              ):
                                  bad_motor += 1

                          except ValueError:
                              bad_motor += 1

                      if boat:
                          boat_rows += 1

                          try:
                              value = int(
                                  float(boat)
                              )

                              if not (
                                  1 <= value <= 99
                              ):
                                  bad_boat += 1

                          except ValueError:
                              bad_boat += 1

                      if exhibition:
                          exhibition_rows += 1

                          try:
                              value = float(
                                  exhibition
                              )

                              if not (
                                  5.0
                                  <= value
                                  <= 10.0
                              ):
                                  bad_exhibition += 1

                          except ValueError:
                              bad_exhibition += 1

          print(
              "========================================"
          )
          print(
              "100日履歴 拡張項目検証"
          )
          print(
              "========================================"
          )

          print(
              "対象開始日:",
              start,
          )

          print(
              "対象終了日:",
              end,
          )

          print(
              "対象履歴ファイル:",
              len(files),
          )

          print(
              "総艇データ:",
              total_rows,
          )

          print(
              "motor_no取得:",
              motor_rows,
          )

          print(
              "boat_no取得:",
              boat_rows,
          )

          print(
              "exhibition_time取得:",
              exhibition_rows,
          )

          print(
              "motor_no値異常:",
              bad_motor,
          )

          print(
              "boat_no値異常:",
              bad_boat,
          )

          print(
              "exhibition_time値異常:",
              bad_exhibition,
          )

          if len(files) < 90:
              raise SystemExit(
                  "対象期間の履歴ファイルが90日未満です"
              )

          if missing_columns:
              print(
                  "拡張項目不足ファイル:"
              )

              for path in (
                  missing_columns[:10]
              ):
                  print(path)

              raise SystemExit(1)

          if total_rows == 0:
              raise SystemExit(
                  "艇データが0件です"
              )

          if motor_rows == 0:
              raise SystemExit(
                  "motor_noが全件欠損です"
              )

          if boat_rows == 0:
              raise SystemExit(
                  "boat_noが全件欠損です"
              )

          if exhibition_rows == 0:
              raise SystemExit(
                  "exhibition_timeが全件欠損です"
              )

          if (
              bad_motor
              or bad_boat
              or bad_exhibition
          ):
              raise SystemExit(
                  "拡張項目に値域異常があります"
              )

          print("")
          print(
              "100日履歴 拡張項目検証 PASS"
          )
          PY

      - name: 既存validation・manifestを必要な日だけ更新
        env:
          START_DATE: ${{ steps.report.outputs.start_date }}
          END_DATE: ${{ steps.report.outputs.end_date }}
        run: |
          UPDATED=0

          while IFS= read -r VALIDATION_FILE
          do
            DIR=$(dirname "${VALIDATION_FILE}")

            TARGET_DATE=$(basename "${VALIDATION_FILE}" \
              | sed -E 's/validation_([0-9]{8})\.json/\1/')

            if [ "${TARGET_DATE}" -lt "${START_DATE}" ] || \
               [ "${TARGET_DATE}" -gt "${END_DATE}" ]; then
              continue
            fi

            VENUES="${DIR}/venues_${TARGET_DATE}.csv"
            RESULTS="${DIR}/results_${TARGET_DATE}_all.csv"
            BOATS="${DIR}/boat_results_${TARGET_DATE}_all.csv"

            if [ ! -f "${VENUES}" ] || \
               [ ! -f "${RESULTS}" ] || \
               [ ! -f "${BOATS}" ]; then
              continue
            fi

            rm -f data/*.csv data/*.json

            cp "${VENUES}" data/
            cp "${RESULTS}" data/
            cp "${BOATS}" data/

            python -u collectors/validate_daily.py \
              --date "${TARGET_DATE}"

            cp "data/validation_${TARGET_DATE}.json" \
              "${DIR}/"

            cp "data/manifest_${TARGET_DATE}.json" \
              "${DIR}/"

            UPDATED=$((UPDATED + 1))

          done < <(
            find archive \
              -type f \
              -name "validation_*.json" \
              | sort
          )

          echo "再生成した検証日数: ${UPDATED}"

      - name: レポートをArtifactへ短期保存
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-history-rebuild-${{ github.run_number }}
          path: |
            history/backfill_report_*.json
          if-no-files-found: error
          retention-days: 7

      - name: 拡張100日履歴をGitHubへ保存
        run: |
          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"

          git add archive history

          if git diff --cached --quiet; then
            echo "変更はありません"
            exit 0
          fi

          git commit -m "Rebuild enriched BOAT RACE history"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin HEAD:"${GITHUB_REF_NAME}"

          echo ""
          echo "========================================"
          echo "100日拡張履歴 GitHub保存完了"
          echo "========================================"