name: 過去100日履歴・拡張データ再構築

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: history-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild_history:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: ファイルを読み込む
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリを準備
        run: |
          python -m pip install --upgrade pip
          pip install lhafile

      - name: data・historyフォルダを準備
        run: |
          mkdir -p data
          mkdir -p history

      - name: 過去100日を拡張データ付きで再取得
        run: |
          echo "========================================"
          echo "過去100日 履歴データ再構築"
          echo "対象: 20260621 ～ 20260928"
          echo "========================================"

          python -u collectors/backfill_history.py \
            --start 20260621 \
            --end 20260928 \
            --force \
            --sleep 0.7

      - name: バックフィル結果を確認
        run: |
          REPORT="history/backfill_report_20260621_20260928.json"

          if [ ! -f "${REPORT}" ]; then
            echo "バックフィルレポートがありません"
            exit 1
          fi

          python - "${REPORT}" <<'PY'
          import json
          import sys

          with open(
              sys.argv[1],
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          print("========================================")
          print("バックフィル結果")
          print("========================================")

          print("開始日:", data.get("start_date"))
          print("終了日:", data.get("end_date"))
          print(
              "新規取得成功:",
              data.get("success_days", 0),
              "日",
          )
          print(
              "既存スキップ:",
              data.get("skipped_days", 0),
              "日",
          )
          print(
              "取得失敗:",
              data.get("failed_days", 0),
              "日",
          )

          if data.get("failed_days", 0) > 0:
              print("")
              print("取得失敗日:")

              for item in data.get("failed", []):
                  print(
                      item.get("date"),
                      item.get("error"),
                  )

              raise SystemExit(1)

          print("")
          print("バックフィル取得 PASS")
          PY

      - name: 再取得データを先にGitHubへ保存
        run: |
          echo "========================================"
          echo "再取得済み100日データを先に保存"
          echo "========================================"

          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"

          git add archive history

          if git diff --cached --quiet; then
            echo "保存対象の変更はありません"
          else
            git commit -m "Save enriched 100 day BOAT RACE history"

            git pull --rebase origin "${GITHUB_REF_NAME}"

            git push origin HEAD:"${GITHUB_REF_NAME}"

            echo ""
            echo "100日再取得データ GitHub保存完了"
          fi

      - name: 保存済み100日拡張データを検証
        run: |
          echo "========================================"
          echo "100日拡張履歴を検証"
          echo "========================================"

          python -u collectors/validate_enriched_history.py \
            --start 20260621 \
            --end 20260928

      - name: 検証PASSマーカーを作成
        run: |
          echo "status=PASS" \
            > history/enriched_history_20260621_20260928.status

          echo "start_date=20260621" \
            >> history/enriched_history_20260621_20260928.status

          echo "end_date=20260928" \
            >> history/enriched_history_20260621_20260928.status

          echo "motor_no=validated" \
            >> history/enriched_history_20260621_20260928.status

          echo "boat_no=validated" \
            >> history/enriched_history_20260621_20260928.status

          echo "exhibition_time=validated" \
            >> history/enriched_history_20260621_20260928.status

          echo ""
          cat history/enriched_history_20260621_20260928.status

      - name: 検証PASS状態をGitHubへ保存
        run: |
          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"

          git add \
            history/enriched_history_20260621_20260928.status

          if git diff --cached --quiet; then
            echo "PASSマーカーは既に保存されています"
          else
            git commit -m "Mark enriched history as validated"

            git pull --rebase origin "${GITHUB_REF_NAME}"

            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: レポートを短期保存
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-history-rebuild-${{ github.run_number }}
          path: |
            history/backfill_report_20260621_20260928.json
            history/enriched_history_20260621_20260928.status
          if-no-files-found: warn
          retention-days: 7

      - name: 最終確認
        run: |
          echo "========================================"
          echo "100日拡張履歴 再構築完了"
          echo "========================================"

          echo "100日履歴: 保存済み"
          echo "拡張3項目: 検証PASS"
          echo "選手30日・90日集計: 準備OK"
          echo "モーター30日・90日集計: 準備OK"