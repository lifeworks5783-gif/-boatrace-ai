name: 過去100日履歴・拡張データ再構築

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: history-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild_history:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: ファイルを読み込む
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリを準備
        run: |
          python -m pip install --upgrade pip
          pip install lhafile

      - name: data・historyフォルダを準備
        run: |
          mkdir -p data
          mkdir -p history

      - name: 過去100日を拡張データ付きで再取得
        run: |
          echo "========================================"
          echo "過去100日 履歴データ再構築"
          echo "対象: 20260621 ～ 20260928"
          echo "motor_no / boat_no / exhibition_time"
          echo "========================================"

          python -u collectors/backfill_history.py \
            --start 20260621 \
            --end 20260928 \
            --force \
            --sleep 0.7

      - name: バックフィル結果を確認
        run: |
          REPORT="history/backfill_report_20260621_20260928.json"

          if [ ! -f "${REPORT}" ]; then
            echo "バックフィルレポートがありません"
            exit 1
          fi

          python - "${REPORT}" <<'PY'
          import json
          import sys

          with open(
              sys.argv[1],
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          print(
              "========================================"
          )
          print(
              "バックフィル結果"
          )
          print(
              "========================================"
          )

          print(
              "開始日:",
              data.get("start_date"),
          )

          print(
              "終了日:",
              data.get("end_date"),
          )

          print(
              "新規取得成功:",
              data.get("success_days", 0),
              "日",
          )

          print(
              "既存スキップ:",
              data.get("skipped_days", 0),
              "日",
          )

          print(
              "取得失敗:",
              data.get("failed_days", 0),
              "日",
          )

          failed = data.get(
              "failed",
              [],
          )

          if failed:
              print("")
              print(
                  "取得失敗日:"
              )

              for item in failed:
                  print(
                      item.get("date"),
                      item.get("error"),
                  )

              raise SystemExit(1)

          print("")
          print(
              "バックフィル取得 PASS"
          )
          PY

      - name: 100日分の拡張3項目を検証
        run: |
          python - <<'PY'
          import csv
          import re
          from pathlib import Path

          START = 20260621
          END = 20260928

          REQUIRED = {
              "motor_no",
              "boat_no",
              "exhibition_time",
          }

          files = []

          for path in Path(
              "archive"
          ).glob(
              "*/*/*/boat_results_*_all.csv"
          ):
              match = re.search(
                  r"boat_results_(\d{8})_all\.csv$",
                  path.name,
              )

              if not match:
                  continue

              date = int(
                  match.group(1)
              )

              if START <= date <= END:
                  files.append(
                      path
                  )

          files.sort()

          total_rows = 0
          motor_rows = 0
          boat_rows = 0
          exhibition_rows = 0

          bad_motor = 0
          bad_boat = 0
          bad_exhibition = 0

          missing_columns = []

          for path in files:

              with path.open(
                  "r",
                  encoding="utf-8-sig",
                  newline="",
              ) as f:

                  reader = csv.DictReader(
                      f
                  )

                  fields = set(
                      reader.fieldnames
                      or []
                  )

                  if not REQUIRED.issubset(
                      fields
                  ):
                      missing_columns.append(
                          str(path)
                      )
                      continue

                  for row in reader:

                      total_rows += 1

                      motor = str(
                          row.get(
                              "motor_no",
                              "",
                          )
                      ).strip()

                      boat = str(
                          row.get(
                              "boat_no",
                              "",
                          )
                      ).strip()

                      exhibition = str(
                          row.get(
                              "exhibition_time",
                              "",
                          )
                      ).strip()

                      if motor:

                          motor_rows += 1

                          try:
                              value = int(
                                  float(motor)
                              )

                              if not (
                                  1 <= value <= 999
                              ):
                                  bad_motor += 1

                          except ValueError:
                              bad_motor += 1

                      if boat:

                          boat_rows += 1

                          try:
                              value = int(
                                  float(boat)
                              )

                              if not (
                                  1 <= value <= 999
                              ):
                                  bad_boat += 1

