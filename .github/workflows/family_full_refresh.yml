name: 家族ボタン・最新予測更新

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  push:
    paths:
      - "config/run_family_full_refresh_now.txt"

concurrency:
  group: boatrace-main-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: 既存V3を起動
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run fast_live_collection_v3.yml --ref main -f quick_mode=true
          echo "Fast Live Collection V3をボタン高速モードで起動しました。"

