name: Boat history coverage
on:
  push:
    branches: [main]
    paths:
      - collectors/check_boat_history_coverage.py
      - .github/workflows/boat_history_coverage.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python collectors/check_boat_history_coverage.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/boat_history_coverage/
          git diff --cached --quiet || git commit -m "Add boat history coverage results"
          git pull --rebase origin main
          git push origin main
