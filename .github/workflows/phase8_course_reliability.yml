name: Phase8 course reliability
on:
  push:
    branches: [main]
    paths: [collectors/evaluate_phase8_course_reliability.py, .github/workflows/phase8_course_reliability.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python collectors/evaluate_phase8_course_reliability.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/phase8_course_reliability/
          git diff --cached --quiet || git commit -m "Add course reliability evaluation results"
          git push
