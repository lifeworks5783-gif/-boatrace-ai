name: AI score 120-order rank diagnostics
on:
  push:
    branches: [main]
    paths: ["config/run_ai_score_rank_diag.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile collectors/evaluate_ai_score_rank_diagnostics_v1.py
      - run: python collectors/evaluate_ai_score_rank_diagnostics_v1.py
      - run: |
          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"
          git add evaluations/ai_score_rank_diagnostics_v1
          git diff --cached --quiet && exit 0
          git commit -m "Update 120-order AI rank diagnostics"
          git pull --rebase origin main
          git push origin main
