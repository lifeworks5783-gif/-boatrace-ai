name: 直前データ収集・高速

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [main]
    paths:
      - config/run_fast_live_now.txt

  schedule:
    # JST 08:03-22:53
    # 10分間隔。00/05等の混雑しやすい境界を避ける。
    - cron: "3,13,23,33,43,53 23,0-13 * * *"

  workflow_dispatch:

concurrency:
  group: boatrace-fast-beforeinfo
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ==========================================
      # 1. 最新main
      # ==========================================
      - name: 最新mainを取得
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ==========================================
      # 2. Python
      # ==========================================
      - name: Python準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリ
        run: |
          pip install -q requests beautifulsoup4

      # ==========================================
      # 3. 本日日付・基本データ
      # ==========================================
      - name: 日付と基本データを準備
        shell: bash
        run: |
          TARGET_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)

          YEAR=${TARGET_DATE:0:4}
          MONTH=${TARGET_DATE:4:2}
          DAY=${TARGET_DATE:6:2}

          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          echo "YEAR=$YEAR" >> "$GITHUB_ENV"
          echo "MONTH=$MONTH" >> "$GITHUB_ENV"
          echo "DAY=$DAY" >> "$GITHUB_ENV"

          mkdir -p data

          BASE="daily_inputs/$YEAR/$MONTH/$DAY/base"

          if [ -s "$BASE/program_races_$TARGET_DATE.csv" ]; then

            echo "daily_inputs の基本データを使用"

            cp "$BASE"/* data/ 2>/dev/null || true

          elif [ -s "archive/$YEAR/$MONTH/$DAY/pre_race/base/program_races_$TARGET_DATE.csv" ]; then

            echo "archive の基本データを使用"

           