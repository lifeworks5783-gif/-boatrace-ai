name: PDCA historical official settlement regression
on:
  pull_request:
    paths:
      - collectors/evaluate_raijin_all_rank_replay.py
      - collectors/evaluate_signal_pdca_cross.py
      - tests/test_pdca_official_void_and_backfill.py
      - .github/workflows/pdca_official_settlement_regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4 lhafile pandas numpy scipy
      - name: Verify official refund and backfill, plus actual rank
        run: python -m unittest discover -s tests -p 'test_pdca_official_void_and_backfill.py' -v
      - name: Recalculate all-rank Raijin research evidence without publishing
        run: |
          python -u collectors/evaluate_raijin_all_rank_replay.py --output-dir evaluations/raijin_all_rank_v2_replay > /tmp/v2_report.log
          python -u collectors/evaluate_signal_pdca_cross.py --raijin-v2
      - name: Verify classification and refunded race settlement
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          replay=Path('evaluations/raijin_all_rank_v2_replay/details.csv')
          with replay.open(encoding='utf-8-sig',newline='') as f:
              rows={x['race_id']:x for x in csv.DictReader(f)}
          wk=rows['202610082012'];na=rows['202610081405']
          assert wk['actual']=='1-3-2' and int(wk['payout'])==1130
          assert 1<=int(wk['new_actual_rank'])<=120
          assert not na['actual'] and not na['new_actual_rank']
          v=json.loads(Path('evaluations/raijin_v2_signal_pdca_cross/latest/summary.json').read_text())
          assert v['latest_date']=='20261015'
          assert v['trifecta_void_races']>=1
          assert v['per_date']['20261008']['combination_methods']['F0R3']['trifecta_void']>=1
          for date in v['available_dates']:
              a=v['per_date'][date]['combination_methods']
              assert len(a)==16
              assert sum(q['races'] for q in a.values())==v['per_date'][date]['races']
          print('V2_FULL_HISTORY_SETTLEMENT_AND_16_CLASSIFICATIONS_PASS')
          PY
