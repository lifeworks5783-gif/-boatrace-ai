name: 展示進入変更検証
on:
  push:
    branches: [main]
    paths: ["collectors/evaluate_entry_change_conditions.py",".github/workflows/entry_change_conditions.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python collectors/evaluate_entry_change_conditions.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/entry_change_conditions_20260930_20261003/
          git diff --cached --quiet || git commit -m "Save entry change validation"
          git pull --rebase origin main
          git push origin main
