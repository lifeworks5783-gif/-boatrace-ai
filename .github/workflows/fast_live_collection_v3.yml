name: Fast Live Collection V3

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  push:
    paths:
      - "config/run_fast_live_v3_now.txt"
  schedule:
    # GitHub Actions の schedule 遅延で直前情報の公開窓を取り逃がさないよう5分間隔で確認
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 23,0-13 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4
      - name: Collect live beforeinfo
        shell: bash
        run: |
          TARGET_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          YEAR=${TARGET_DATE:0:4}
          MONTH=${TARGET_DATE:4:2}
          DAY=${TARGET_DATE:6:2}
          mkdir -p data
          BASE="daily_inputs/$YEAR/$MONTH/$DAY/base"
          ARCHIVE_BASE="archive/$YEAR/$MONTH/$DAY/pre_race/base"
          if [ -s "$BASE/program_races_$TARGET_DATE.csv" ]; then
            cp "$BASE"/* data/ 2>/dev/null || true
          elif [ -s "$ARCHIVE_BASE/program_races_$TARGET_DATE.csv" ]; then
            cp "$ARCHIVE_BASE"/* data/ 2>/dev/null || true
          fi
          test -s "data/program_races_$TARGET_DATE.csv"
          RAW_ROOT="daily_inputs/$YEAR/$MONTH/$DAY/live/raw"
          LATEST_RAW=$(find "$RAW_ROOT" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -n 1 || true)
          if [ -n "$LATEST_RAW" ]; then
            find "$LATEST_RAW" -maxdepth 1 -type f -name "beforeinfo_*$TARGET_DATE*" -exec cp {} data/ \;
          fi
          python -u collectors/today_beforeinfo.py --mode live

          read_validation_count() {
            python - "$1" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          key = sys.argv[1]
          target_date = os.environ["TARGET_DATE"]
          path = Path("data") / f"beforeinfo_validation_{target_date}.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          print(int(data.get(key, 0) or 0))
          PY
          }

          export TARGET_DATE
          READY=$(read_validation_count new_ready_races)
          NEW=$(read_validation_count selected_new_races)
          UNREADY=$(read_validation_count unready_new_count)
          TOTAL_READY=$READY

          # 一部レースだけ公式直前情報が未確定でも、他レースが取れたことを理由に
          # 再確認を打ち切らない。最大2回、60秒間隔で未確定レースを追う。
          # GitHub schedule の遅延があっても、同じrun内で取り逃しを減らす。
          for ATTEMPT in 1 2; do
            if [ "$UNREADY" -le 0 ]; then
              break
            fi
            echo "未確定の新規直前情報が ${UNREADY}R。60秒後に再確認します (${ATTEMPT}/2)"
            sleep 60
            python -u collectors/today_beforeinfo.py --mode live
            READY_NOW=$(read_validation_count new_ready_races)
            UNREADY=$(read_validation_count unready_new_count)
            TOTAL_READY=$((TOTAL_READY + READY_NOW))
          done

          READY=$TOTAL_READY

          if [ "$READY" -le 0 ]; then
            echo "HAS_READY_BEFOREINFO=false" >> "$GITHUB_ENV"
            echo "今回新たに確定した直前情報なし。保存・予測起動はせず次回確認へ"
            exit 0
          fi

          echo "HAS_READY_BEFOREINFO=true" >> "$GITHUB_ENV"
          STAMP=$(TZ=Asia/Tokyo date +%Y%m%d_%H%M%S)
          DEST="$RAW_ROOT/$STAMP"
          mkdir -p "$DEST"
          find data -maxdepth 1 -type f -name "beforeinfo_*$TARGET_DATE*" -exec cp {} "$DEST/" \;
          git config user.name "boatrace-fast-live-bot"
          git config user.email "boatrace-fast-live-bot@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Fast beforeinfo cumulative snapshot $STAMP"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
      - name: Start live prediction
        if: env.HAS_READY_BEFOREINFO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live_prediction_0930.yml --ref main -f raw_ready=true
