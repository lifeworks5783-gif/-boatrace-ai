name: Fast Live Collection V3

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      quick_mode:
        description: "ボタン更新用。取得済み分を先に反映し、未確定待ちを短縮する"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - "config/run_fast_live_v3_now.txt"
      - "config/run_fast_live_recovery_now.txt"

# Multiple button taps queue instead of cancelling a partially completed run.
concurrency:
  group: boatrace-manual-live-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4
      - name: Collect live beforeinfo
        shell: bash
        run: |
          TARGET_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          YEAR=${TARGET_DATE:0:4}
          MONTH=${TARGET_DATE:4:2}
          DAY=${TARGET_DATE:6:2}
          mkdir -p data
          BASE="daily_inputs/$YEAR/$MONTH/$DAY/base"
          ARCHIVE_BASE="archive/$YEAR/$MONTH/$DAY/pre_race/base"
          if [ -s "$BASE/program_races_$TARGET_DATE.csv" ]; then
            cp "$BASE"/* data/ 2>/dev/null || true
          elif [ -s "$ARCHIVE_BASE/program_races_$TARGET_DATE.csv" ]; then
            cp "$ARCHIVE_BASE"/* data/ 2>/dev/null || true
          fi
          test -s "data/program_races_$TARGET_DATE.csv"
          RAW_ROOT="daily_inputs/$YEAR/$MONTH/$DAY/live/raw"
          LATEST_RAW=$(find "$RAW_ROOT" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -n 1 || true)
          if [ -n "$LATEST_RAW" ]; then
            find "$LATEST_RAW" -maxdepth 1 -type f -name "beforeinfo_*$TARGET_DATE*" -exec cp {} data/ \;
          fi
          python -u collectors/today_beforeinfo.py --mode live

          read_validation_count() {
            python - "$1" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          key = sys.argv[1]
          target_date = os.environ["TARGET_DATE"]
          path = Path("data") / f"beforeinfo_validation_{target_date}.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          print(int(data.get(key, 0) or 0))
          PY
          }

          export TARGET_DATE
          READY=$(read_validation_count new_ready_races)
          NEW=$(read_validation_count selected_new_races)
          UNREADY=$(read_validation_count unready_new_count)
          TOTAL_READY=$READY
          QUICK_MODE="${{ inputs.quick_mode || false }}"

          if [ "$QUICK_MODE" = "true" ]; then
            # 家族ページの「最新情報に更新」ボタンは応答性を優先する。
            # 1件でも取得済みなら待たずにその分を反映する。
            # まだ1件も取れていない場合だけ20秒後に1回再確認する。
            if [ "$UNREADY" -gt 0 ]; then
              echo "ボタン更新: 未取得レースあり。20秒後に再確認します"
              sleep 20
              python -u collectors/today_beforeinfo.py --mode live
              READY_NOW=$(read_validation_count new_ready_races)
              UNREADY=$(read_validation_count unready_new_count)
              TOTAL_READY=$((TOTAL_READY + READY_NOW))
            fi
          else
            # 自動更新は欠損防止を優先し、未確定レースを最大2回追う。
            for ATTEMPT in 1 2; do
              if [ "$UNREADY" -le 0 ]; then
                break
              fi
              echo "未確定の新規直前情報が ${UNREADY}R。60秒後に再確認します (${ATTEMPT}/2)"
              sleep 60
              python -u collectors/today_beforeinfo.py --mode live
              READY_NOW=$(read_validation_count new_ready_races)
              UNREADY=$(read_validation_count unready_new_count)
              TOTAL_READY=$((TOTAL_READY + READY_NOW))
            done
          fi

          READY=$TOTAL_READY

          if [ "$READY" -le 0 ]; then
            echo "HAS_READY_BEFOREINFO=false" >> "$GITHUB_ENV"
            echo "今回新たに確定した直前情報なし。保存・予測起動はせず次回確認へ"
            exit 0
          fi

          echo "HAS_READY_BEFOREINFO=true" >> "$GITHUB_ENV"
          STAMP=$(TZ=Asia/Tokyo date +%Y%m%d_%H%M%S)
          DEST="$RAW_ROOT/$STAMP"
          mkdir -p "$DEST"
          find data -maxdepth 1 -type f -name "beforeinfo_*$TARGET_DATE*" -exec cp {} "$DEST/" \;
          git config user.name "boatrace-fast-live-bot"
          git config user.email "boatrace-fast-live-bot@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Fast beforeinfo cumulative snapshot $STAMP"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
      - name: 直前スコアを保存完了するまで実行
        if: env.HAS_READY_BEFOREINFO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u collectors/dispatch_wait_workflow.py \
            --workflow live_prediction_0930.yml \
            --timeout-seconds 1200 \
            --input raw_ready=true
          echo "直前情報→6艇スコア→共通予測保存: PASS"

      - name: 最新の公式結果を再取得し終了済み全レースを照合する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Important: compare AFTER the live score commit; otherwise
          # the comparison sees old, missing or fallback scores.
          # Button mode explicitly avoids a second asynchronous reconcile.
          python -u collectors/dispatch_wait_workflow.py \
            --workflow intraday_compare.yml \
            --timeout-seconds 1500 \
            --input button_pipeline=true
          echo "公式結果→不足スコア復元→レース照合→研究監査: PASS"

      - name: 照合結果を共通正本へ反映して確定保存する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          python -u collectors/dispatch_wait_workflow.py \
            --workflow canonical_recovery_reconcile.yml \
            --timeout-seconds 900 \
            --input target_date="$TARGET_DATE" \
            --input skip_family_publish=true
          echo "研究用公式予測・風神雷神の共通正本保存: PASS"

      - name: 予測とレース照合の4画面を再生成し公開まで確認する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u collectors/dispatch_wait_workflow.py \
            --workflow family_prediction_page.yml \
            --timeout-seconds 900
          echo "公開用4画面更新: PASS"
