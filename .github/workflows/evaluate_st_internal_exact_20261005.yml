name: Exact ST internal 20261005
on:
  push:
    paths:
      - 'collectors/evaluate_st_internal_exact_20261005.py'
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python collectors/evaluate_st_internal_exact_20261005.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/st_internal_exact_20261005/
          git diff --cached --quiet || git commit -m "Save exact 10/5 ST internal evaluation"
          git pull --rebase origin main
          git push origin main
