name: Research latest-information five-minute scheduler
on:
  schedule:
    # Five-minute spacing, offset from busy top-of-hour.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: research-live-five-minute-dispatch
  cancel-in-progress: false
jobs:
  dispatch-if-idle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch research-only V3 when inputs exist and prior run is idle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GH_REPO" != "lifeworks5783-gif/-boatrace-ai" ]]; then
            echo "Refuse dispatch outside public research repository"
            exit 1
          fi
          TODAY="$(TZ=Asia/Tokyo date +%Y%m%d)"
          YEAR="${TODAY:0:4}"; MONTH="${TODAY:4:2}"; DAY="${TODAY:6:2}"
          ROOT="repos/$GH_REPO/contents"
          # Do not run V3 before the actual morning input/prediction exists.
          if ! gh api "$ROOT/daily_inputs/$YEAR/$MONTH/$DAY/base/program_races_$TODAY.csv" >/dev/null 2>&1; then
            echo "Skip: today's original morning program is not yet saved"
            exit 0
          fi
          if ! gh api "$ROOT/predictions/$YEAR/$MONTH/$DAY/morning_predictions_$TODAY.json" >/dev/null 2>&1; then
            echo "Skip: original morning prediction has not been saved"
            exit 0
          fi
          # Existing V3 writes snapshots, prediction, reconciliation and family pages.
          # Running it concurrently would queue uncontrolled duplicate writers.
          ACTIVE="$(gh api "repos/$GH_REPO/actions/workflows/fast_live_collection_v3.yml/runs?per_page=100" --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          if [[ "$ACTIVE" -gt 0 ]]; then
            echo "Skip: existing live collection is queued or running ($ACTIVE)"
            exit 0
          fi
          gh workflow run fast_live_collection_v3.yml --repo "$GH_REPO" --ref main -f quick_mode=true
          echo "Research-only latest information pipeline dispatched for $TODAY"
