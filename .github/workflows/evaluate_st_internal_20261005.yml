name: Evaluate ST internal 20261005
on:
  workflow_dispatch:
  push:
    paths:
      - 'collectors/evaluate_st_internal_20261005.py'
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python collectors/evaluate_st_internal_20261005.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/st_internal_20261005/
          git diff --cached --quiet || git commit -m "Save 10/5 ST internal evaluation"
          git pull --rebase origin main
          git push origin main
