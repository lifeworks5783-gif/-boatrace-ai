name: Private Drive raw archive → public normalized daily JSON
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Official racing date YYYYMMDD (leave blank for JST today)"
        required: false
        type: string
      max_requests:
        description: "Maximum official pages per run (1–30)"
        required: false
        default: "12"
        type: string

# No cron until OAuth credentials, Drive folder and write/readback checks exist.
# Raw HTML never enters git commits, job artifacts or public page output.
permissions:
  contents: write

concurrency:
  group: boatrace-drive-raw-archive-main
  cancel-in-progress: false

jobs:
  verified-capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser packages
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Archive originals privately before normalizing
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_RAW_FOLDER_ID: ${{ vars.GDRIVE_RAW_FOLDER_ID }}
          TARGET_DATE: ${{ inputs.date }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: |
          set -euo pipefail
          python -m raw_collector.ingest_once \
            --date "${TARGET_DATE:-$(TZ=Asia/Tokyo date +%Y%m%d)}" \
            --max-requests "${MAX_REQUESTS:-12}"
      - name: Commit only normalized daily output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- normalized/
          if git diff --cached --quiet; then
            echo "No newly normalized research data"
          else
            git diff --cached --name-only | grep -v '^normalized/' && exit 1 || true
            git commit -m "Data: verified raw archive, refreshed normalized daily races"
            git push
          fi
