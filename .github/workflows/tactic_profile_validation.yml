name: Tactic profile validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collectors/build_tactic_profiles.py"
      - "collectors/daily_results_fast.py"
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile collectors/daily_results_fast.py collectors/build_tactic_profiles.py
      - run: python collectors/build_tactic_profiles.py

# trigger
