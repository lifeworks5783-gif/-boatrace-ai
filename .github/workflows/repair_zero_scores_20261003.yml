name: Repair 20261003 zero scores
on:
  push:
    branches: [main]
    paths: ["collectors/repair_zero_scores_20261003.py"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python collectors/repair_zero_scores_20261003.py
      - run: python collectors/build_latest_prediction_view.py --date 20261003
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predictions/2026/10/03/live predictions/latest.json predictions/latest.md
          git diff --cached --quiet || git commit -m "repair: recalculate 19 historical zero scores"
          git pull --rebase origin main
          git push origin main
