name: 9月30日・スコア配分答え合わせ

permissions:
  contents: write

on:
  workflow_run:
    workflows:
      - "9月30日・高速予測結果評価"
    types:
      - completed

  workflow_dispatch:

concurrency:
  group: boatrace-main-writer
  cancel-in-progress: false

jobs:
  analyze:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TARGET_DATE: "20260930"
      YEAR: "2026"
      MONTH: "09"
      DAY: "30"

    steps:
      - name: 最新のmainを読み込む
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリを準備
        run: |
          python -m pip install --upgrade pip
          pip install pandas scipy

      - name: 9月30日の結果データを確認
        run: |
          RESULT_FILE="archive/${YEAR}/${MONTH}/${DAY}/boat_results_${TARGET_DATE}_all.csv"

          test -s "${RESULT_FILE}"

          echo "実レース結果: PASS"

      - name: 予測データを確認
        run: |
          test -d "predictions/${YEAR}/${MONTH}/${DAY}"

          echo "予測データ: PASS"

      - name: 直前分析用データを準備
        run: |
          python -u collectors/prepare_live_analysis_input.py \
            --date "${TARGET_DATE}"

          FILE="data/prediction_input_enriched_live_${TARGET_DATE}.json"

          test -s "${FILE}"

          echo "直前分析用データ: PASS"

      - name: スコア配分と実結果を自動照合
        run: |
          python -u collectors/analyze_score_components.py \
            --date "${TARGET_DATE}"

      - name: 展示・ST・F・進入・風を個別分析
        run: |
          python -u collectors/analyze_live_factors.py \
            --date "${TARGET_DATE}"

          FILE="evaluations/${YEAR}/${MONTH}/${DAY}/live_factor_analysis_${TARGET_DATE}.json"

          test -s "${FILE}"

          echo ""
          echo "========================================"
          echo "直前情報 個別分析"
          echo "========================================"
          echo ""

          cat "${FILE}"

      - name: 分析ファイルを確認
        run: |
          DIR="evaluations/${YEAR}/${MONTH}/${DAY}"

          test -s "${DIR}/score_component_analysis_${TARGET_DATE}.json"
          test -s "${DIR}/score_component_analysis_${TARGET_DATE}.md"
          test -s "${DIR}/score_answer_check_boats_${TARGET_DATE}.csv"
          test -s "${DIR}/live_factor_analysis_${TARGET_DATE}.json"
          test -s "${DIR}/live_factor_analysis_${TARGET_DATE}.md"

          echo "分析ファイル確認: PASS"

      - name: 分析結果をArtifactへ保存
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-score-analysis-20260930-${{ github.run_number }}
          path: |
            evaluations/2026/09/30/score_component_analysis_20260930.json
            evaluations/2026/09/30/score_component_analysis_20260930.md
            evaluations/2026/09/30/score_answer_check_boats_20260930.csv
            evaluations/2026/09/30/score_feature_stats_20260930.csv
            evaluations/2026/09/30/score_gap_races_morning_20260930.csv
            evaluations/2026/09/30/score_gap_races_live_20260930.csv
            evaluations/2026/09/30/live_factor_analysis_20260930.json
            evaluations/2026/09/30/live_factor_analysis_20260930.md
            evaluations/latest_score_analysis.md
          if-no-files-found: warn
          retention-days: 30

      - name: Private側へ分析結果を保存
        run: |
          git config user.name "boatrace-data-bot"
          git config user.email "boatrace-data-bot@users.noreply.github.com"

          git add "evaluations/${YEAR}/${MONTH}/${DAY}"
          git add "evaluations/latest_score_analysis.md"

          if git diff --cached --quiet; then
            echo "Private側に新しい変更なし"
          else
            RUN_STAMP=$(TZ=Asia/Tokyo date '+%Y%m%d_%H%M%S')

            git commit -m \
              "Analyze live factors ${TARGET_DATE} ${RUN_STAMP}"

            git push origin HEAD:main

            echo "Private側保存: PASS"
          fi

      - name: 公開確認用リポジトリを読み込む
        uses: actions/checkout@v4
        with:
          repository: lifeworks5783-gif/boatrace-family-view
          ref: main
          token: ${{ secrets.FAMILY_VIEW_TOKEN }}
          path: family_public
          fetch-depth: 0

      - name: 分析JSONを確認用サイトへコピー
        run: |
          cp \
            "evaluations/${YEAR}/${MONTH}/${DAY}/live_factor_analysis_${TARGET_DATE}.json" \
            "family_public/live_factor_analysis.json"

          cp \
            "evaluations/${YEAR}/${MONTH}/${DAY}/live_factor_analysis_${TARGET_DATE}.md" \
            "family_public/live_factor_analysis.md"

          echo "分析結果コピー: PASS"

      - name: 分析JSONを公開確認用リポジトリへ保存
        run: |
          cd family_public

          git config \
            user.name \
            "boatrace-family-view-bot"

          git config \
            user.email \
            "boatrace-family-view-bot@users.noreply.github.com"

          git add \
            live_factor_analysis.json \
            live_factor_analysis.md

          if git diff --cached --quiet; then
            echo "公開確認用データに変更なし"
            exit 0
          fi

          git commit \
            -m "Update live factor analysis"

          git push origin HEAD:main

          echo "確認用分析JSON保存: PASS"

      - name: 最終確認
        run: |
          echo ""
          echo "========================================"
          echo "9月30日 詳細スコア分析 完了"
          echo "========================================"
          echo ""
          echo "分析対象:"
          echo "・展示タイム"
          echo "・展示ST"
          echo "・展示F"
          echo "・展示進入"
          echo "・風"
          echo ""
          echo "重み探索:"
          echo "・展示タイム加点"
          echo "・展示ST加点"
          echo "・展示F減点"
          echo ""
          echo "配点自体はまだ変更していません"