name: 10月2日・新スコア構造探索
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - "collectors/search_structures_20261002.py"
      - "collectors/search_unweighted_formula_20261002.py"
      - "collectors/search_anchor_live_reorder_20261002.py"
      - "collectors/evaluate_racer_course_7steps_20261002.py"
      - "collectors/evaluate_racer_course_step7_20261002.py"
      - "collectors/evaluate_racer_course_multipliers_20261002.py"
      - ".github/workflows/structure_search_20261002.yml"
  workflow_dispatch:
concurrency:
  group: boatrace-main-writer
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: 20構造・係数を実計算
        run: python -u collectors/search_structures_20261002.py
      - name: 係数なし掛け算・足し算を実計算
        run: python -u collectors/search_unweighted_formula_20261002.py
      - name: 朝1位固定・直前2-3位補正を実計算
        run: python -u collectors/search_anchor_live_reorder_20261002.py
      - name: 選手×コース相性 1-6を実計算
        run: python -u collectors/evaluate_racer_course_7steps_20261002.py
      - name: 選手×コース相性 Step7を実計算
        run: python -u collectors/evaluate_racer_course_step7_20261002.py
      - name: 選手コース×級別の乗算補正を実計算
        run: python -u collectors/evaluate_racer_course_multipliers_20261002.py
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/2026/10/02/structure_search evaluations/2026/10/02/unweighted_formula_search evaluations/2026/10/02/anchor_live_reorder evaluations/2026/10/02/racer_course_7steps
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evaluation: search new score structures for 20261002"
          git stash push --include-untracked -m temp || true
          git pull --rebase origin main
          git push origin HEAD:main
