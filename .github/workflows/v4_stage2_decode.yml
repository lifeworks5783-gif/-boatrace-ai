name: V4 Stage 2 Interpret and Store
on:
  workflow_run:
    workflows: ["V4 Stage 1 Raw Capture"]
    types: [completed]
permissions:
  actions: write
  contents: write
concurrency:
  group: boatrace-main-writer
  cancel-in-progress: false
jobs:
  interpret:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4
      - name: Download the exact upstream collection artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name v4-capture --dir _v4_input
          test -s _v4_input/manifest.json
      - name: Decode after raw archive exists
        run: |
          set -euo pipefail
          MODE=$(python -c 'import json;print(json.load(open("_v4_input/manifest.json"))["mode"])')
          if [ "$MODE" = skip ]; then
            mkdir -p _v4_decoded
            echo '{"schema":"boatrace-v4-decoded-v1","mode":"skip","decoded_races":0}' > _v4_decoded/status.json
            exit 0
          fi
          DAY=$(python -c 'import json;print(json.load(open("_v4_input/manifest.json"))["date"])')
          python -m collectors.v4_pipeline decode --day "$DAY" \
             --in-dir _v4_input --out _v4_decoded
      - name: Save decoded small files, never commit HTML originals
        env:
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          MODE=$(python -c 'import json;print(json.load(open("_v4_decoded/status.json"))["mode"])')
          COUNT=$(python -c 'import json;print(json.load(open("_v4_decoded/status.json")).get("decoded_races",0))')
          if [ "$MODE" = skip ] || [ "$COUNT" -eq 0 ]; then
            echo "Nothing decodable; original artifact preserved for troubleshooting"
            exit 0
          fi
          DAY=$(python -c 'import json;print(json.load(open("_v4_decoded/status.json"))["date"])')
          DEST="daily_inputs/$(echo "$DAY" | cut -c1-4)/$(echo "$DAY" | cut -c5-6)/$(echo "$DAY" | cut -c7-8)"
          if [ "$MODE" = morning ]; then
            mkdir -p "$DEST/base"
            cp _v4_decoded/base/* "$DEST/base/"
            git add "$DEST/base"
          elif [ "$MODE" = live ]; then
            SNAPSHOT=$(python -c 'import json;print(json.load(open("_v4_decoded/status.json"))["snapshot_path"])')
            STAMP=$(basename "$SNAPSHOT")
            mkdir -p "$DEST/live/v4_decoded/$STAMP"
            cp "_v4_decoded/$SNAPSHOT"/* "$DEST/live/v4_decoded/$STAMP/"
            git add "$DEST/live/v4_decoded/$STAMP"
          else
            exit 1
          fi
          # One small permanent stage marker, not the raw HTML.
          mkdir -p evaluations/v4/pipeline_runs
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path("_v4_decoded/status.json").read_text())
          info={"schema":"boatrace-v4-stage2-receipt-v1",
                "stage2_run_id":os.environ["GITHUB_RUN_ID"],
                "stage1_run_id":os.environ.get("UPSTREAM_RUN_ID"),
                "mode":data["mode"],"date":data["date"],
                "decoded_races":data.get("decoded_races",0),
                "unparsed_races":data.get("unparsed_races",[]),
                "original_html_persistent":False,
                "source":"v4_capture_artifact_sha_verified"}
          Path("evaluations/v4/pipeline_runs/"+os.environ["GITHUB_RUN_ID"]+"_decode.json").write_text(
            json.dumps(info,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git add "evaluations/v4/pipeline_runs/${GITHUB_RUN_ID}_decode.json"
          git config user.name "boatrace-v4-research-bot"
          git config user.email "boatrace-v4-research-bot@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V4 $MODE: save parsed race data $DAY"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || exit 1
            sleep 2
          done
          echo "Stage 2 storage failed - no prediction dispatch" >&2
          exit 1
      # Retry ONLY records fetched with blank/partial official exhibition.
      # The existing fast collector already has bounded attempts and a
      # pre-deadline Cloudflare missing-only official backup.
      - name: 未完成の公式直前情報だけ独立再取得
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          READY=$(python - <<'PY'
          import json
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          v=json.loads(Path("_v4_decoded/status.json").read_text())
          today=str(v.get("date") or "")
          now=datetime.now(timezone(timedelta(hours=9)))
          count=0
          for record in v.get("unready_races") or []:
              try:
                  cutoff=datetime.strptime(today+" "+record["deadline"],"%Y%m%d %H:%M").replace(tzinfo=now.tzinfo)
              except (KeyError,ValueError):
                  continue
              # Never demand live collection after cutoff. Do not retry
              # far-future races that do not yet have official exhibition.
              if 30 < (cutoff-now).total_seconds() <= 25*60:
                  count+=1
          print(count)
          PY
          )
          if [ "$READY" -eq 0 ]; then
            echo "V4_NO_ACTIONABLE_UNREADY"; exit 0
          fi
          # Avoid duplicate expensive runs when the button/backup is already
          # active or started within the last four minutes.
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/fast_live_collection_v3.yml/runs?per_page=10" --jq '.workflow_runs' || echo '[]')
          CUT_OFF=$(date -u -d '4 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          if jq -e --arg min "$CUT_OFF" 'any(.[]; .status != "completed" or .created_at >= $min)' <<<"$RUNS" >/dev/null; then
            echo "V4_RETRY_ALREADY_QUEUED_OR_RECENT"; exit 0
          fi
          if gh workflow run fast_live_collection_v3.yml --repo "$GITHUB_REPOSITORY" --ref main -f quick_mode=true; then
            echo "V4_MISSING_ONLY_RETRY_DISPATCHED $READY"
          else
            echo "::warning::Missing-only backup dispatch unavailable; original capture retained."
          fi

      - name: Retain immutable decoded status for calculation stage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-decoded-status
          path: _v4_decoded/status.json
          if-no-files-found: error
          retention-days: 7
