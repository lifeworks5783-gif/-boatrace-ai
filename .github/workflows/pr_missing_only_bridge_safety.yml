name: Independent research bridge safety
on:
  push:
    branches: ["feature/cloudflare-missing-only-research-bridge-20261013"]
  pull_request:
    paths:
      - "collectors/cloudflare_missing_only_bridge.py"
      - "tests/test_cloudflare_missing_only_bridge.py"
      - ".github/workflows/pr_missing_only_bridge_safety.yml"
permissions:
  contents: read
jobs:
  offline-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_cloudflare_missing_only_bridge.py -v
      - run: python -m py_compile collectors/cloudflare_missing_only_bridge.py
