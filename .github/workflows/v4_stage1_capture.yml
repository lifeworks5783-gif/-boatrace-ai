name: V4 Stage 1 Raw Capture
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [morning, live]
        default: live
        required: true
  push:
    branches: [main]
    paths: [config/v4_capture_now.txt]
  # Independently tested Stage1 -> Stage2 -> Stage3 canaries passed on Oct 12.
  # Morning retry windows (JST): 03:07, 04:32, 05:07.
  # Live 5-minute capture (JST): 06:02 to 22:57; deadline-gated in collector.
  # Stagger off the busiest :00/:05 cron boundaries to reduce schedule delay.
  # GitHub schedule is best-effort; this is not a real-time SLA.
  schedule:
    - cron: '7 18 * * *'
    - cron: '32 19 * * *'
    - cron: '7 20 * * *'
    - cron: '2-59/5 21-23,0-13 * * *'
permissions:
  contents: read
concurrency:
  group: v4-raw-capture-${{ github.event.inputs.mode || 'live' }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Official HTTP capture dependencies
        run: python -m pip install -q requests beautifulsoup4 lhafile
      - name: Raw HTTP capture (never decode before artifact)
        env:
          REQUEST_MODE: ${{ inputs.mode || 'live' }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Tokyo date +%Y%m%d)"
          BASE="daily_inputs/$(TZ=Asia/Tokyo date +%Y/%m/%d)/base"
          # Cron identifies morning without inheriting the manual live default.
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            case "$SCHEDULE_EXPR" in
              '7 18 * * *'|'32 19 * * *'|'7 20 * * *') REQUEST_MODE=morning ;;
              '2-59/5 21-23,0-13 * * *') REQUEST_MODE=live ;;
              *) echo "Unexpected cron expression"; exit 1 ;;
            esac
          fi
          # A one-time externally committed canary marker selects morning/live
          # without changing the scheduled default or requiring dashboard clicks.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -s config/v4_capture_now.txt ]; then
            REQUEST_MODE=$(head -n1 config/v4_capture_now.txt | tr -d '[:space:]')
          fi
          if [ "$REQUEST_MODE" != morning ] && [ "$REQUEST_MODE" != live ]; then
            echo "Invalid requested capture mode" >&2; exit 1
          fi
          if [ "$REQUEST_MODE" = live ]; then
            HOUR="$(TZ=Asia/Tokyo date +%H)"
            if (( 10#$HOUR < 6 || 10#$HOUR > 22 )) || [ ! -s "$BASE/program_races_$TODAY.csv" ]; then
              REQUEST_MODE=skip
            fi
          fi
          if [ "$REQUEST_MODE" = skip ]; then
            mkdir -p _v4_capture
            echo '{"schema":"boatrace-v4-capture-v1","mode":"skip","records":[]}' > _v4_capture/manifest.json
          else
            python -m collectors.v4_pipeline capture --mode "$REQUEST_MODE" --day "$TODAY" --out _v4_capture
          fi
      - name: Upload preserved exact official bytes (temporary, 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: v4-capture
          path: _v4_capture/
          retention-days: 7
          if-no-files-found: error
