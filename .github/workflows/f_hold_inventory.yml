name: F Hold Inventory
on:
  push:
    branches: [main]
    paths:
      - "collectors/evaluate_f_hold_inventory.py"
      - ".github/workflows/f_hold_inventory.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python collectors/evaluate_f_hold_inventory.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluations/f_hold_inventory_20260930_20261003/summary.json
          git diff --cached --quiet || git commit -m "Update F-hold inventory"
          git push
